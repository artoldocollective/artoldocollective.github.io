const state = {

const stage = document.createElement('div');

stage.style.cssText =
  'position:fixed;inset:0;overflow:hidden;' +
  'pointer-events:none;z-index:2147483000;';

(document.body || document.documentElement).appendChild(stage);

const rand = (a,b) => a + Math.random() * (b-a);

const pick = a => a[Math.floor(Math.random() * a.length)];

function animate(q,frames,duration,easing){

  q.animate(
    frames,
    {
      duration: duration,
      easing: easing || 'cubic-bezier(.15,.75,.25,1)',
      fill: 'forwards'
    }
  );

    if(q && q.parentNode){

}

function node(x,y){

  const q = document.createElement('div');

  q.style.cssText =

    'user-select:none;' +
    'will-change:transform,opacity;';

  q.style.filter = 'blur(' + state.blur + 'px)';
  q.style.opacity = state.opacity;

  stage.appendChild(q);

  return q;
}

function FX(){

  const n = state.amount;
  const d = state.duration;

  for(let i=0;i<n;i++){

    const q = node(
      rand(0,stage.clientWidth),
      -40
    );

    q.textContent = pick(state.emojis) || '✈️';

    q.style.fontSize =
      rand(state.size * 0.55, state.size * 1.35) + 'px';

    const dx = rand(-70,70);
    const dy = stage.clientHeight + 80;

    animate(
      q,
      [
        {
          transform: 'translate(-50%,-50%) scale(.2)',
          opacity: 1
        },
        {
          transform:
            'translate(calc(-50% + ' +
            dx +

            dy +
            'px)) rotate(' +
            rand(-state.rotation,state.rotation) +
            'deg)',
          opacity: 0.5
        }
      ],
      d + rand(0,d * 0.5),
      'linear'
    );
  }
}

let lastMove = 0;
let drag = false;
let lastEventX = null;
let lastEventY = null;
let lastEventTime = 0;

function dedupe(e){

  const now = performance.now();

  if(
    e.clientX === lastEventX &&
    e.clientY === lastEventY &&
    now - lastEventTime < 8
  ){
    return true;
  }

  lastEventX = e.clientX;
  lastEventY = e.clientY;
  lastEventTime = now;

  return false;
}

function run(e){

  if(
    !Number.isFinite(e.clientX) ||
    !Number.isFinite(e.clientY)
  ){
    return;
  }

  FX();
}

function move(e){

  if(dedupe(e)){
    return;
  }

  if(
    state.trigger === 'pointermove' &&
    performance.now() - lastMove >= state.throttle
  ){
    run(e);
    lastMove = performance.now();
  }

  if(state.trigger === 'drag' && drag){
    run(e);
  }
}

function down(e){

  drag = true;

  if(state.trigger === 'pointerdown'){
    run(e);
  }
}

function up(e){

  drag = false;

  if(state.trigger === 'pointerup'){
    run(e);
  }
}

function click(e){

  if(state.trigger === 'click'){
    run(e);
  }
}

function dblclick(e){

  if(state.trigger === 'dblclick'){
    run(e);
  }
}

function enter(e){

  if(state.trigger === 'pointerenter'){
    run(e);
  }
}

function leave(e){

  if(state.trigger === 'pointerleave'){
    run(e);
  }
}


/* DOCUMENT ONLY */

document.addEventListener('mousemove',move,true);
document.addEventListener('pointermove',move,true);

document.addEventListener('mousedown',down,true);
document.addEventListener('pointerdown',down,true);

document.addEventListener('mouseup',up,true);
document.addEventListener('pointerup',up,true);

document.addEventListener('click',click,true);
document.addEventListener('dblclick',dblclick,true);

document.addEventListener('mouseover',enter,true);
document.addEventListener('mouseout',leave,true);

document.addEventListener('pointerover',enter,true);
document.addEventListener('pointerout',leave,true);


/* CLEANUP */

function cleanup(){

  document.removeEventListener('mousemove',move,true);
  document.removeEventListener('pointermove',move,true);

  document.removeEventListener('mousedown',down,true);
  document.removeEventListener('pointerdown',down,true);

  document.removeEventListener('mouseup',up,true);
  document.removeEventListener('pointerup',up,true);

  document.removeEventListener('click',click,true);
  document.removeEventListener('dblclick',dblclick,true);

  document.removeEventListener('mouseover',enter,true);
  document.removeEventListener('mouseout',leave,true);

  document.removeEventListener('pointerover',enter,true);
  document.removeEventListener('pointerout',leave,true);

  if(stage && stage.parentNode){
    stage.remove();
  }
}

return cleanup;

})();

function destroyView(){
  if(typeof activeCleanup==='function'){
    try{activeCleanup()}catch(e){console.error('View cleanup error:',e)}
  }
  activeCleanup=null;
  if(shadow){shadow.innerHTML='';}
  iframe=null;
}

function makeDocumentProxy(root){
  const real=document;
  return {
    body:root,
    documentElement:real.documentElement,
    createElement:real.createElement.bind(real),
    createTextNode:real.createTextNode.bind(real),
    getElementById:(id)=>root.querySelector('#'+CSS.escape(id)),
    querySelector:(sel)=>root.querySelector(sel),
    querySelectorAll:(sel)=>root.querySelectorAll(sel),
    addEventListener:real.addEventListener.bind(real),
    removeEventListener:real.removeEventListener.bind(real),
    readyState:real.readyState
  };
}

function runViewScript(code, view){
  if(!code)return;
  try{
    const scopedDocument=makeDocumentProxy(shadow);
    const fn=new Function('iframe','caption','interactionLayer','view','root','document',code+'\nreturn (typeof cleanup===\'function\')?cleanup:null;');
    activeCleanup=fn(iframe,caption,interactionLayer,view,shadow,scopedDocument)||null;
  }catch(e){console.error('View script error:',e)}
}

function showView(index){
  current=(index+views.length)%views.length;
  destroyView();
  const view=views[current];

  if(!shadow) shadow=host.attachShadow({mode:'open'});
  shadow.innerHTML='';
  const base=document.createElement('style');
  base.textContent=`:host{position:fixed;inset:0;display:block;z-index:1} iframe#streetview{position:fixed;inset:0;width:100%;height:100%;border:none;transform-origin:center center;filter:grayscale(100%) sepia(30%);}`;
  shadow.appendChild(base);

  if(view.css){
    const style=document.createElement('style');
    style.setAttribute('data-view-style',String(current));
    style.textContent=view.css;
    shadow.appendChild(style);
  }

  iframe.setAttribute('allowfullscreen','');
  iframe.setAttribute('loading','lazy');
  iframe.setAttribute('referrerpolicy','no-referrer-when-downgrade');

function snapshotFilename(){
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  return `acephale-streetvow-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
}

async function takeScreenshot(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    alert('Snapshot requires a browser with Screen Capture support.');
    return;
  }

  screenshotButton.disabled=true;
  screenshotButton.style.opacity='0';
  screenshotButton.style.pointerEvents='none';

  let stream=null;
  let video=null;
  try{
    // Native browser capture: captures the rendered tab/window, including the
    // cross-origin Google Street View iframe and our overlays. The cursor is
    // explicitly excluded from the captured image.
    stream=await navigator.mediaDevices.getDisplayMedia({
      video:{
        displaySurface:'browser',
        cursor:'never',
        frameRate:{ideal:30,max:30}
      },
      audio:false,
      preferCurrentTab:true,
      selfBrowserSurface:'include',
      surfaceSwitching:'exclude'
    });

    video=document.createElement('video');
    video.muted=true;
    video.playsInline=true;
    video.srcObject=stream;
    await video.play();

    // Give the capture pipeline a clean frame after the button disappears.
    await new Promise(r=>setTimeout(r,250));

    const track=stream.getVideoTracks()[0];
    const settings=track.getSettings();
    const w=settings.width || video.videoWidth;
    const h=settings.height || video.videoHeight;
    if(!w || !h) throw new Error('The browser returned no video frame.');

    const canvas=document.createElement('canvas');
    canvas.width=w;
    canvas.height=h;
    const ctx=canvas.getContext('2d',{alpha:false});

      canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG encoding failed.')),'image/png');
    });

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=snapshotFilename();
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);

  }catch(err){
    if(err && err.name!=='AbortError' && err.name!=='NotAllowedError'){
      alert('Snapshot failed: '+(err.message||String(err)));
    }
  }finally{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(video){video.pause();video.srcObject=null;video.remove();}
    screenshotButton.disabled=false;
    screenshotButton.style.opacity='1';
    screenshotButton.style.pointerEvents='auto';
  }
}

screenshotButton.addEventListener('click',e=>{e.stopPropagation();takeScreenshot()});
</script>
