<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Acéphale – Chat</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:transparent;
  color:#e9edef;
  overflow-x:hidden;
}

body{
  background-image:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:22px 22px;
}

.scene{
  position:relative;
  padding:80px 0 140px;
  max-width:900px;
  margin:0 auto;
}

.message{
  position:relative;
  max-width:420px;
  margin:110px auto;
  padding:10px 12px;
  border-radius:10px;

  opacity:0;
  transform:translateY(80px) scale(.96);
  transition:opacity .6s ease, transform .6s ease;

  box-shadow:0 1px 1px rgba(0,0,0,.25);
}

/* Telegram-style incoming message */
.left{
  margin-left:36px;
  margin-right:auto;
  background:#1f2c3a; /* Telegram dark incoming bubble */
}

/* Telegram-style outgoing message */
.right{
  margin-right:36px;
  margin-left:auto;
  background:#2b5278; /* Telegram dark outgoing bubble */
}

.name{
  font-size:12px;
  font-weight:700;
  opacity:.75;
  margin-bottom:6px;
}

.text{
  font-size:18px;
  line-height:1.45;
  white-space:pre-wrap;
}

.visible{
  opacity:1;
  transform:translateY(0) scale(1);
}

.cursor{
  display:inline-block;
  width:8px;
  animation:blink 1s infinite;
}

.voice{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 0;
}

.play{
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:14px;
}

.bar{
  flex:1;
  height:6px;
  background:rgba(255,255,255,.15);
  border-radius:99px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:0;
  background:#2aabee; /* Telegram blue accent */
}

.time{
  font-size:12px;
  opacity:.8;
  min-width:42px;
  text-align:right;
}

@keyframes blink{
  50%{opacity:0}
}

@media(max-width:620px){

  .hg-choice-grid{
    grid-template-columns:1fr;
  }

  #hg-sacrifice-result{
    padding:22px 16px;
  }

  .hg-moral-buttons{
    flex-direction:column;
  }

  .hg-tooltip{
    display:none !important;
  }

}
</style>
</head>

{"name":"Georges Ambrosino","text":"Or matter finally admitting it is not stable enough to be neutral.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"Or society briefly showing its true structure: ritual without permission.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"The crisis of civilization is not a symptom—it is its apex. When order becomes total, it begins to rot from its own excess of clarity. I wrote this as a sacred paradox: the summit is already collapse.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"You are turning sociology into ritual again. But I admit: the idea that “civilization = crisis” is structurally elegant. It behaves like a biological law pretending to be metaphysics.","side":"left","type":"text"},
{"name":"Pierre Klossowski","text":"What you call “collapse” is simply the moment when God changes masks. Nietzsche already said it: even death is theatrical.","side":"right","type":"text"},
{"name":"Jules Monnerot","text":"The text is politically dangerous. If crisis is apogee, then every regime justifies itself through decomposition. This is sociology turned inside out like a glove.","side":"left","type":"text"},
{"name":"Georges Ambrosino","text":"The “recovery of the lost world” is thermodynamically absurd. You cannot restart cohesion by force without producing entropy elsewhere. The system always pays.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"But force is exactly what seduces societies in ruin. They mistake rigidity for intensity. Fascism is the sentimental form of exhaustion.","side":"left","type":"text"},
{"name":"Patrick Waldberg","text":"I have observed this in the later meetings: the desire for order was already theatrical. Everyone knew it was failing—but wanted it to fail loudly.","side":"right","type":"text"},
{"name":"Pierre Klossowski","text":"The text’s real opposition is not politics—it is metabolism. Dionysos is digestion of forms, while Caesar is their hardening into bone.","side":"left","type":"text"},
{"name":"Roger Caillois","text":"So Dionysos is not freedom, but dissolution disguised as ecstasy?","side":"right","type":"text"},
{"name":"Georges Bataille","text":"Exactly. Ecstasy is never innocent. It always consumes something—usually the structure that believes it contains it.","side":"left","type":"text"},
{"name":"Walter Benjamin","text":"I read this as an allegory of history: every civilization writes its apocalypse in advance, then calls it progress.","side":"right","type":"text"},
{"name":"Georges Ambrosino","text":"You are making theology out of historical fatigue.","side":"left","type":"text"},
{"name":"Walter Benjamin","text":"Perhaps. But fatigue is also a method of cognition.","side":"right","type":"text"},
{"name":"André Masson","text":"I do not read crisis—I draw it. In your “apogee-collapse,” I see only a headless figure still walking, refusing geometry.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"That is the only correct illustration: thought without a head is still thinking.","side":"right","type":"text"},
{"name":"Henri Dubief","text":"In the forest sessions, we already felt this: civilization was not discussed, it was enacted as a slow disintegration of certainty.","side":"left","type":"text"},
{"name":"Isabelle Waldberg","text":"And yet we sculpted forms as if form could survive its own theory.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"That contradiction is the only sacred thing left: to build what you already know will collapse.","side":"left","type":"text"},
{"name":"Isabelle Waldberg","text":"Why not?","side":"right","type":"text"},
{"name":"André Masson","text":"What's wrong with you Georges?!","side":"left","type":"text"},
{"name":"Georges Bataille","text":"Civilization does not fall after its peak—it becomes its peak. What you call decomposition is simply intensity that has lost its exterior limit.","side":"right","type":"text"},
{"name":"Jules Monnerot","text":"This is no longer sociology. It is a doctrine of structural crisis. If every apogee is crisis, then stability is an illusion maintained by administrative hypnosis.","side":"left","type":"text"},
{"name":"Roger Caillois","text":"There is a hidden symmetry here: order produces critique, critique produces dissolution, dissolution produces myth again. A loop disguised as history.","side":"right","type":"text"},
{"name":"Pierre Klossowski","text":"The “Vaterland” is not geography—it is psychic obedience. Dionysos is what happens when obedience becomes impossible to metabolize.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"Hence the cruelty of Nietzsche: he does not free man, he exposes him to an unbearable freedom that consumes paternal structure.","side":"right","type":"text"},
{"name":"Henri Dubief","text":"We understood this in fragments during the nocturnal readings: the “father” is not a figure, it is a gravitational force of limitation.","side":"left","type":"text"},
{"name":"Georges Ambrosino","text":"The myth of Semele is almost physical: matter cannot receive absolute energy without being destroyed. Birth is always a failed containment.","side":"right","type":"text"},
{"name":"Isabelle Waldberg","text":"So Nietzsche is not interpreting myth, he is reenacting it: thought struck by lightning, surviving only as fragment.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"Exactly. Dionysos is not a symbol of life—it is life after combustion.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"Numance is the paradox of collective existence: a community revealed only at the moment it abolishes itself.","side":"left","type":"text"},
{"name":"Pierre Klossowski","text":"The city becomes sacred only when it ceases to be administrable. That is why its end is its revelation.","side":"right","type":"text"},
{"name":"Patrick Waldberg","text":"In political reality, this is intolerable: modern groups cannot admit that unity appears only as catastrophe.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"A community without head is not chaos—it is circulation. Authority is replaced by shared exposure to mortality.","side":"right","type":"text"},
{"name":"Jules Monnerot","text":"But then politics becomes impossible. Decision disappears. Only affect remains.","side":"left","type":"text"},
{"name":"Walter Benjamin","text":"Perhaps decision was always an illusion of delay. History may already be a structure without head, only narrated as if it had one.","side":"right","type":"text"},
{"name":"Georges Ambrosino","text":"Military order is efficient precisely because it suppresses tragic consciousness. It replaces death with function.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"Yes. The army cannot suffer tragedy—it can only deploy corpses as arguments.","side":"right","type":"text"},
{"name":"Henri Dubief","text":"But Numance shows the opposite: a people that becomes tragedy instead of instrument.","side":"left","type":"text"},
{"name":"Pierre Klossowski","text":"The deepest political truth here is not power, but shared exposure to annihilation.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"So the sacred is not what binds life—but what binds life to its limit.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"Yes. And Numance is not a story of defeat. It is the moment when a people becomes pure intensity without future.","side":"right","type":"text"},
{"name":"Isabelle Waldberg","text":"Then Dionysos is not the god of life—but the god of life that has already accepted its disappearance.","side":"left","type":"text"},
{name:'Georges Bataille', text:'Then doctrine must be sacrificed too.', side:'right', type:'audio', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{"name":"Jean Wahl","text":"There is a moment where thought stops describing crisis and begins to reproduce it as style. That is where philosophy becomes myth again.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"But myth is not an error. It is the only language that survives contact with excess. The danger is not myth—it is forgetting that myth burns.","side":"right","type":"text"},
{"name":"Jules Monnerot","text":"The real risk is substitution: the analysis of collapse becomes a ceremonial fascination with collapse.","side":"left","type":"text"},
{"name":"Roger Caillois","text":"A headless community can only persist as exception. If it stabilizes, it recreates a head elsewhere.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"Yes—any durable acephale is a contradiction. It must remain unstable to remain true.","side":"left","type":"text"},
{"name":"Pierre Klossowski","text":"Which means its only coherence is episodic: moments of intensity, not institutions.","side":"right","type":"text"},
{"name":"Walter Benjamin","text":"Every attempt to escape structure eventually produces a more invisible structure.","side":"left","type":"text"},
{"name":"Henri Dubief","text":"Administration returns as fatigue: when intensity becomes impossible to sustain, management reappears as relief.","side":"right","type":"text"},
{"name":"Georges Ambrosino","text":"So tragedy is not the opposite of bureaucracy. It is what bureaucracy cannot metabolize—but later imitates in softened form.","side":"left","type":"text"},
{"name":"Roger Caillois","text":"Numance is not simply destruction. It is the moment when survival ceases to be the highest value of the collective.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"A people becomes sovereign only when it stops calculating its continuation.","side":"left","type":"text"},
{"name":"Isabelle Waldberg","text":"But this sovereignty is unreadable for politics, because politics is built on duration.","side":"right","type":"text"},
{"name":"Pierre Klossowski","text":"Dionysos is not origin, not destiny—he is interruption. A breach in continuity that cannot be preserved without betraying itself.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"So the Dionysian is never a system. It is what survives the collapse of systems as pure expenditure.","side":"right","type":"text"},
{"name":"Walter Benjamin","text":"Then history is not a line. It is a series of ruptures that only appear linear when already pacified.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"And in that sense: Dionysos is not a god of life or death—but of the moment where that distinction stops working.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"The moment sociology touches the sacred, it stops being neutral knowledge. It becomes contagious: it transforms whoever studies it.","side":"left","type":"text"},
{"name":"Jules Monnerot","text":"Then the discipline is already unstable. If knowledge modifies the knower, we are no longer describing society — we are inside its active forces.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"That is precisely why a cold sociology is impossible. The object burns the observer. The sacred is not studied — it infects.","side":"left","type":"text"},
{"name":"Pierre Klossowski","text":"What we are forming is not an academic group. It is a moral community bound by exposure to the same dangerous knowledge.","side":"right","type":"text"},
{"name":"Georges Ambrosino","text":"And yet it remains open. Anyone can enter — but no one leaves unchanged. Even science becomes initiation.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"A science that does not transform its practitioners is not a science of the real. It is administration.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"The sacred is not a belief. It is a structural pressure inside societies — what makes them oscillate between order and rupture.","side":"left","type":"text"},
{"name":"Jules Monnerot","text":"So every stable society contains within itself the seeds of its own ritualized collapse.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"Yes — and what we call revolution is often just the moment when that sacred pressure becomes visible.","side":"left","type":"text"},
{"name":"Pierre Klossowski","text":"To study society through the sacred is to abandon the idea of detached observation. One participates in the system of forces being described.","side":"right","type":"text"},
{"name":"Georges Ambrosino","text":"Which means that even analysis becomes ritual behavior — a controlled exposure to unstable structures.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"Knowledge is never innocent. In sacred sociology, knowing is already a form of participation in excess.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"Certain ideas behave like biological agents: once introduced into a social field, they propagate beyond control.","side":"left","type":"text"},
{"name":"Jules Monnerot","text":"That explains why societies resist certain sciences: they fear not error, but transformation.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"A true idea is always dangerous. If it is harmless, it is already dead.","side":"left","type":"text"},
{"name":"Pierre Klossowski","text":"So the Collège is not a school. It is a maintained crisis — a deliberate instability held together by shared attention.","side":"right","type":"text"},
{"name":"Georges Ambrosino","text":"A community formed not by identity, but by exposure to the same structural risk.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"Exactly. A community that does not resolve itself into order — but into intensity.","side":"right","type":"text"},
{name:'Pierre Klossowski', text:'Then doctrine must be sacrificed too.', side:'left', type:'audio', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{"name":"Georges Bataille","text":"In a community without a head, there is no command — only shared exposure to what cannot be governed.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"But if there is no head, what prevents dispersion? What holds the circle from becoming nothing but scattered individuals?","side":"left","type":"text"},
{"name":"Georges Bataille","text":"What holds it is precisely what dissolves it elsewhere: mortality. The awareness of limit replaces authority.","side":"right","type":"text"},
{"name":"Henri Dubief","text":"During the nocturnal gathering, no one gives instructions. Yet everything happens as if an invisible coordination persists.","side":"left","type":"text"},
{"name":"Patrick Waldberg","text":"I recorded no leader, no hierarchy — only intensities rising and falling like a collective respiration.","side":"right","type":"text"},
{"name":"Georges Ambrosino","text":"The absence of command does not produce chaos. It produces resonance between participants.","side":"left","type":"text"},
{"name":"Jules Monnerot","text":"Without a head, decision becomes impossible. And yet decisions still occur — but without identifiable authors.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"Decision is a myth of retrospective narration. We believe we decide, but we are decided by the situation itself.","side":"left","type":"text"},
{"name":"Pierre Klossowski","text":"So responsibility disperses into the structure of the moment. No one acts alone — but no one is innocent either.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"It resembles an organism that has lost its central organ, yet continues to function through distributed reflexes.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"Not an organism. A field of combustion points. Each member is a temporary ignition site.","side":"right","type":"text"},
{"name":"Henri Dubief","text":"And yet coherence appears — not structural, but affective. As if the group thinks without thinking.","side":"left","type":"text"},
{"name":"Isabelle Waldberg","text":"In the rituals, nothing is represented. Everything is exposure — of bodies, of attention, of limits.","side":"right","type":"text"},
{"name":"Georges Ambrosino","text":"The sacred here is not above us. It is what happens when stability is briefly removed.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"The sacred is not transcendence. It is proximity to dissolution without collapse.","side":"right","type":"text"},
{"name":"Pierre Klossowski","text":"A headless community is not leaderless in the political sense — it is uncentered in principle.","side":"left","type":"text"},
{"name":"Jules Monnerot","text":"Then it cannot be governed, only experienced. Which makes it incompatible with any stable institution.","side":"right","type":"text"},
{"name":"Georges Bataille","text":"Exactly. It is not a model of society. It is a rupture inside the idea of society itself.","side":"left","type":"text"},
{"name":"Patrick Waldberg","text":"What remains after observation is not structure, but a memory of shared intensity that cannot be reconstructed.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"So the group exists only at the moment of its dissolution into experience.","side":"left","type":"text"},
{"name":"Georges Bataille","text":"A community without head does not persist. It ignites, consumes itself, and leaves only the trace of having been together in excess.","side":"right","type":"text"},
{"name":"Roger Caillois","text":"I don't think so Georges...","side":"left","type":"text"},
{ name: "Georges Bataille", text: "Nietzsche’s collapse is not an end but a ritual opening. If he believed himself Dionysos or the Crucified, then he only completed what philosophy always hides: thought becoming sacrifice. We are no longer interpreting—only enacting.", side: "right", type: "text" },
{ name: "Colette Peignot (Laure)", text: "The text speaks too loudly of reason trying to survive madness. But madness is not a failure—it is exposure. If the head breaks, something more ancient breathes through it.", side: "left", type: "text" },
{ name: "Georges Ambrosino", text: "There is a dangerous precision in the idea of the ‘incarnated man.’ It resembles a physical system overloaded beyond stability. A structure that thinks itself to the point of explosion.", side: "right", type: "text" },
{ name: "Pierre Klossowski", text: "The passage where God becomes ill at human madness is decisive. It reverses theology: not man before God, but God before the excess of man. This is the true scandal of Nietzsche’s fate.", side: "left", type: "text" },
{ name: "Jacques Chavy", text: "If society is already a dialogue of massacres, then we are only formalizing what history already speaks. The ritual would simply make explicit what is otherwise unconscious.", side: "right", type: "text" },
{ name: "Henri Dubief", text: "I read in this text a warning disguised as fascination: whoever tries to unify existence in a single head will be destroyed by that unity. The head cannot survive totality.", side: "left", type: "text" },
{ name: "Isabelle Farner (Isabelle Waldberg)", text: "There is a sculptural logic here: the more you concentrate form into a single point, the more violently it demands rupture. The ‘incarnated man’ is a statue already cracking.", side: "right", type: "text" },
{ name: "Patrick Waldberg", text: "What disturbs me is the transformation of philosophy into obligation. The text no longer describes thought—it commands it to live, to suffer, to act. That is where danger becomes real.", side: "left", type: "text" },
{ name: "Michel Koch", text: "The idea that expression is already a form of sleep is accurate. To speak is to cool the fire. Ritual, then, would not be expression but refusal of expression.", side: "right", type: "text" },
{name:'Pierre Klossowski', text:'Then doctrine must be sacrificed too.', side:'left', type:'audio', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{ name: "Georges Bataille", text: "Yes—but refusal must also be risk. Otherwise it becomes philosophy again. The Acephale is not silence; it is the moment before speech where thought no longer knows its owner.", side: "right", type: "text" },
{ name: "Colette Peignot (Laure)", text: "Then the question is not whether Nietzsche went mad, but whether madness itself is the only form capable of carrying truth without reducing it.", side: "left", type: "text" },
{ name: "Georges Ambrosino", text: "In physical terms, such truth would be unstable by definition. It cannot remain contained. It either disperses or detonates.", side: "right", type: "text" },
{ name: "Pierre Klossowski", text: "And thus theology becomes mechanics: the sacred as instability threshold. Nietzsche is not a subject here but a system passing its limit.", side: "left", type: "text" },
{ name: "Jacques Chavy", text: "So the ‘society without head’ is not symbolic. It is a refusal of stabilization. A collective that never becomes one.", side: "right", type: "text" },
{name:'Pierre Klossowski', text:'Then doctrine must be sacrificed too.', side:'left', type:'audio', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{ name: "Georges Bataille", text: "Exactly. A society that cannot close itself around a meaning. If it had a head, it would already be dead.", side: "right", type: "text" },
{name:'Pierre Klossowski', text:'Then doctrine must be sacrificed too.', side:'left', type:'audio', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{ name: "Georges Bataille", text: "If Nietzsche’s collapse is read as an event, we miss the essential point: thought does not end in clarity or darkness, but in excess. What breaks is not the man, but the separation between thinking and living it.", side: "right", type: "text" },
{ name: "Colette Peignot (Laure)", text: "I do not accept that madness is a fall. It is a passage where the body refuses to remain subordinate to explanation. The tragedy is not loss of reason, but the exposure of reason’s limits.", side: "left", type: "text" },
{name:'Georges Bataille', text:'Then doctrine must be sacrificed too.', side:'right', type:'audio', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{ name: "Pierre Klossowski", text: "Nietzsche does not become Dionysos in delusion. Rather, Dionysos appears at the point where philosophical identity can no longer sustain its own distinction from myth.", side: "left", type: "text" },
{ name: "Georges Ambrosino", text: "From a structural perspective, the ‘incarnated man’ is a system that has absorbed too many contradictory constraints. What we call madness may simply be overload without resolution.", side: "right", type: "text" },
{ name: "Jacques Chavy", text: "History already behaves like a headless process. Wars, ideologies, collapses—none of it requires a center. Acephale only makes explicit what is already operative.", side: "left", type: "text" },
{ name: "Isabelle Farner (Isabelle Waldberg)", text: "When form concentrates too much meaning, it becomes unstable. That instability is not an accident of thought—it is the condition of intensity itself.", side: "right", type: "text" },
{ name: "Henri Dubief", text: "The idea of a society without head implies something unsettling: that coherence is always a later construction. What precedes it is discontinuous and ungoverned.", side: "left", type: "text" },
{ name: "Michel Koch", text: "Expression is never neutral. To speak is already to organize force into form, and every form risks becoming a sleep of what it once tried to transmit.", side: "right", type: "text" },
{ name: "Patrick Waldberg", text: "What disturbs me is not the violence of the thought, but its demand: it does not invite contemplation, it demands participation. That shifts philosophy toward something irreversible.", side: "left", type: "text" },
{ name: "Georges Bataille", text: "Participation is precisely what thought avoids when it wants to remain safe. But here, safety is already a form of betrayal of what is being seen.", side: "right", type: "text" },
{ name: "Colette Peignot (Laure)", text: "If there is a practice here, it is not interpretation but exposure. One does not understand Nietzsche’s fate; one is forced to measure oneself against it.", side: "left", type: "text" },
{ name: "System", text: "Georges Ambrosino has left the group.", side: "right", type: "text" },
{ name: "System", text: "Jacques Chavy has left the group.", side: "left", type: "text" },
{ name: "System", text: "Michel Koch has left the group.", side: "right", type: "text" },
{ name: "System", text: "Henri Dubief has left the group.", side: "left", type: "text" },
{ name: "System", text: "Isabelle Farner (Waldberg) has left the group.", side: "right", type: "text" },
{ name: "System", text: "Pierre Klossowski has left the group.", side: "left", type: "text" },
{ name: "System", text: "Colette Peignot (Laure) has left the group.", side: "right", type: "text" },
{ name: "Georges Bataille", text: "Still here. Of course I am.", side: "left", type: "text" }

];

const chat=document.getElementById('chat');

function render(){
  chat.innerHTML='';

  dataset.forEach((m)=>{
    const el=document.createElement('div');
    el.className='message '+m.side;

    el.dataset.type=m.type||'text';
    el.dataset.fulltext=m.text||'';
    el.dataset.typed='0';

    let content='';

    if(m.type==='audio'){
      content=`
        <div class="name">${m.name}</div>
        <div class="voice">
          <button class="play">▶</button>
          <div class="bar"><div class="progress"></div></div>
          <div class="time">0:00</div>
          <audio src="${m.src}"></audio>
        </div>
      `;
    }else{
      content=`
        <div class="name">${m.name}</div>
        <div class="text"></div>
      `;
    }

    el.innerHTML=content;
    chat.appendChild(el);
  });

  bindAudio();
  observe();
}

function typeMessage(el){
  if(el.dataset.type!=='text'||el.dataset.typed==='1')return;
  el.dataset.typed='1';

  const box=el.querySelector('.text');
  const full=el.dataset.fulltext;

  let n=0;
  box.innerHTML='<span class="cursor">|</span>';

  const timer=setInterval(()=>{
    n++;
    box.innerHTML=full.slice(0,n)+'<span class="cursor">|</span>';

    if(n>=full.length){
      clearInterval(timer);
      box.textContent=full;
    }
  },25);
}

function bindAudio(){
  document.querySelectorAll('.voice').forEach(v=>{
    const btn=v.querySelector('.play');
    const audio=v.querySelector('audio');
    const prog=v.querySelector('.progress');
    const time=v.querySelector('.time');

    btn.onclick=()=>{
      document.querySelectorAll('audio').forEach(a=>{
        if(a!==audio)a.pause();
      });

      if(audio.paused){
        audio.play();
        btn.textContent='❚❚';
      }else{
        audio.pause();
        btn.textContent='▶';
      }
    };

    audio.addEventListener('timeupdate',()=>{
      if(audio.duration){
        prog.style.width=(audio.currentTime/audio.duration*100)+'%';
        const m=Math.floor(audio.currentTime/60);
        const s=Math.floor(audio.currentTime%60).toString().padStart(2,'0');
        time.textContent=`${m}:${s}`;
      }
    });

    audio.addEventListener('ended',()=>{
      btn.textContent='▶';
    });
  });
}

function observe(){
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting && !e.target.dataset.started){
        e.target.dataset.started='1';

        setTimeout(()=>{
          e.target.classList.add('visible');
          typeMessage(e.target);
        },350);
      }
    });
  },{threshold:0.45});

  document.querySelectorAll('.message').forEach(m=>io.observe(m));
}

render();
</script>

<script>

/* =========================
   SEARCH SYSTEM
========================= */

const searchToggle=document.getElementById('searchToggle');
const searchOverlay=document.getElementById('searchOverlay');
const searchInput=document.getElementById('searchInput');
const searchResults=document.getElementById('searchResults');

function openSearch(){
  searchOverlay.classList.add('open');

  setTimeout(()=>{
    searchInput.focus();
  },120);

  renderResults('');
}

function closeSearch(){
  searchOverlay.classList.remove('open');
  searchInput.value='';
}

searchToggle.onclick=openSearch;

document.addEventListener('keydown',(e)=>{

  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    openSearch();
  }

  if(e.key==='Escape'){
    closeSearch();
  }
});

searchOverlay.addEventListener('click',(e)=>{
  if(e.target===searchOverlay){
    closeSearch();
  }
});

function highlight(text,q){
  if(!q)return text;

  const r=new RegExp(`(${escapeRegExp(q)})`,'gi');

  return text.replace(r,'<mark>$1</mark>');
}

function escapeRegExp(string){
  return string.replace(/[.*+?^${}()|[\]\\]/g,'\\\\$&');
}

function renderResults(query){

  const q=query.trim().toLowerCase();

  searchResults.innerHTML='';

  const matches=[];

  dataset.forEach((m,i)=>{

    if(m.type!=='text')return;

    const full=(m.name+' '+m.text).toLowerCase();

    if(!q || full.includes(q)){
      matches.push({
        index:i,
        ...m
      });
    }
  });

  if(matches.length===0){
    searchResults.innerHTML=`
      <div class="searchResult">
        <div class="searchText">No results found.</div>
      </div>
    `;
    return;
  }

  matches.forEach(m=>{

    const div=document.createElement('div');
    div.className='searchResult';

    div.innerHTML=`
      <div class="searchName">
        ${m.name}
      </div>

      <div class="searchText">
        ${highlight(m.text,query)}
      </div>
    `;

    div.onclick=()=>{

      closeSearch();

      const target=document.querySelectorAll('.message')[m.index];

      if(!target)return;

      target.scrollIntoView({
        behavior:'smooth',
        block:'center'
      });

      target.classList.add('focused');

      setTimeout(()=>{
        target.classList.remove('focused');
      },2000);
    };

    searchResults.appendChild(div);
  });
}

searchInput.addEventListener('input',(e)=>{
  renderResults(e.target.value);
});

searchInput.addEventListener('keydown',(e)=>{

  if(e.key==='Enter'){

    const first=document.querySelector('.searchResult');

    if(first){
      first.click();
    }
  }
});

/* ============================================================

function getName(node){

  const name =
    node.querySelector(
      HG.selectors.name
    );

  return name
    ? name.textContent.trim()
    : 'Unknown';

}


function isFlaggable(node){

  if(!node) return false;

  /*
    No System messages.
  */

  if(
    getName(node).toLowerCase() ===
    'system'
  ){
    return false;
  }

  /*
    No audio bubbles.
  */

  if(
    node.dataset.type === 'audio' ||
    node.querySelector('audio')
  ){
    return false;
  }

  return true;

}


function bubbleId(node){

  /*
    Stable enough for this runtime:
    position in the rendered chat.
  */

  return Array
    .from(
      document.querySelectorAll(
        HG.selectors.message
      )
    )
    .indexOf(node);

}


/* ============================================================
   FLAG / UNFLAG
============================================================ */

function toggleSacrifice(
  node,
  button
){

  const id = bubbleId(node);

  const name = getName(node);

  const already =
    state.flagged.has(id);


  if(already){

    state.flagged.delete(id);

    state.choices =
      state.choices.filter(
        x => x.id !== id
      );

    state.authorCounts[name] =
      Math.max(
        0,
        (state.authorCounts[name] || 0) - 1
      );

    if(
      state.authorCounts[name] === 0
    ){
      delete state.authorCounts[name];
    }

    button.classList.remove(
      'hg-flagged'
    );

    node.classList.remove(
      'hg-sacrificially-charged'
    );

  }else{

    state.flagged.add(id);

    state.choices.push({
      id,
      name
    });

    state.authorCounts[name] =
      (state.authorCounts[name] || 0) + 1;

    button.classList.add(
      'hg-flagged'
    );

    node.classList.add(
      'hg-sacrificially-charged'
    );

  }

  updateResult();

}

/* ============================================================
   YOUR CHOICE
============================================================ */

function getYourChoice(){

  const entries =
    Object.entries(
      state.authorCounts
    );

  if(!entries.length){
    return null;
  }

  entries.sort(
    (a,b) => b[1] - a[1]
  );

  /*
    If tied, the author who reached the
    highest count first wins YOUR CHOICE.
  */

  const highest =
    entries[0][1];

  const tied =
    entries
      .filter(x => x[1] === highest)
      .map(x => x[0]);

  if(tied.length === 1){
    return {
      name:tied[0],
      count:highest
    };
  }

  for(const vote of state.choices){

    if(tied.includes(vote.name)){

      return {
        name:vote.name,
        count:highest
      };

    }

  }

  return {
    name:entries[0][0],
    count:highest
  };

}


/* ============================================================
   COLLECTIVE CHOICE
============================================================ */

function getCollectiveChoice(){

  /*
    PARODIC COLLECTIVE:
    deterministic pseudo-consensus derived from
    the corpus + the player's actual choices.

    It is NOT presented during play.
    Only revealed at the end.

    The player's flags contribute strongly,
    but the fictional Acéphalian collective
    introduces an additional hidden weight.

    This guarantees that YOUR CHOICE and
    COLLECTIVE CHOICE can coincide or diverge.
  */

  const authors = {};

  document
    .querySelectorAll(
      HG.selectors.message
    )
    .forEach(node => {

      if(!isFlaggable(node)){
        return;
      }

      const name =
        getName(node);

      authors[name] =
        (authors[name] || 0) + 1;

    });


  let ranking = [];


  Object
    .entries(authors)
    .forEach(([name,presence]) => {

      const yourVotes =
        state.authorCounts[name] || 0;

      /*
        Hidden deterministic pseudo-community weight.
        Based on the letters of the name,
        so it remains stable between reloads.
      */

      let hash = 0;

      for(let i=0;i<name.length;i++){

        hash =
          (
            (hash * 31) +
            name.charCodeAt(i)
          ) >>> 0;

      }

      const collectiveNoise =
        (hash % 9) + 1;


      /*
        Actual player designation matters most.
        Corpus recurrence also matters slightly.
      */

      const score =
        (yourVotes * 12) +
        (presence * .35) +
        collectiveNoise;


      ranking.push({
        name,
        score,
        presence,
        yourVotes
      });

    });


  ranking.sort(
    (a,b) => b.score - a.score
  );


  return ranking.length
    ? ranking[0]
    : null;

}

      </div>

      <div class="hg-executed-name">
        ${escapeHTML(collective.name)}
      </div>

      <div class="hg-executed-line">
        ${HG.labels.after}
      </div>

      <div class="hg-bad-question">
        ${HG.labels.question}
      </div>

      <div class="hg-moral-buttons">

        <button
          type="button"
          data-answer="yes"
        >
          YES
        </button>

        <button
          type="button"
          data-answer="no"
        >
          NO
        </button>

      </div>

      <div
        class="hg-moral-response"
      ></div>

    </div>

  `;


  document.body.appendChild(
    overlay
  );


  skullConfetti();


  overlay
    .querySelectorAll(
      '[data-answer]'
    )
    .forEach(button => {

      button.onclick = () => {

        const answer =
          button.dataset.answer;

        const response =
          overlay.querySelector(
            '.hg-moral-response'
          );


        if(answer === 'yes'){

          response.innerHTML =
            `REMORSE REGISTERED.<br>
             THE SACRIFICE REMAINS VALID.`;

        }else{

          response.innerHTML =
            `NO REMORSE REGISTERED.<br>
             THE SACRIFICE REMAINS VALID.`;

        }


        overlay
          .querySelectorAll(
            '[data-answer]'
          )
          .forEach(b => {

            b.disabled = true;

            b.style.opacity =
              b === button
                ? '1'
                : '.25';

          });


        /*
          Allow click anywhere after response
          to return to Holygram.
        */

        setTimeout(() => {

          overlay.style.cursor =
            'pointer';

          overlay.onclick = e => {

            if(
              e.target.closest(
                'button'
              )
            ){
              return;
            }

            document.documentElement.style.overflow =
              '';

            document.body.style.overflow =
              '';

            overlay.remove();

          };

        },500);

      };

    });

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

  const div =
    document.createElement('div');

  div.textContent =
    value == null
      ? ''
      : String(value);

  return div.innerHTML;

}


/* ============================================================
   EVENTS
============================================================ */

document
  .getElementById(
    'hg-execute'
  )
  .addEventListener(
    'click',
    executeSacrifice
  );


/* ============================================================
   INITIALIZE
============================================================ */

attachButtons();
updateResult();


/*
  Safety net in case Holygram re-renders
  its dataset later.
*/

const observer =
  new MutationObserver(() => {

    attachButtons();

  });

observer.observe(
  chat,
  {
    childList:true,
    subtree:true
  }
);

})();
</script>


<script>

const fireworkEmoticons = [
  "❤️","💀","🗡️","💀","🗡️","💀","🩸",
  "💀","👹","💀","👹","💀","👹","💀"
];

function sacrificeFirework(x,y){

  const particles = 35;

  for(let i = 0; i < particles; i++){

    const emoji =
      document.createElement("div");

    emoji.textContent =
      fireworkEmoticons[
        Math.floor(
          Math.random() *
          fireworkEmoticons.length
        )
      ];

    emoji.style.position = "fixed";
    emoji.style.left = x + "px";
    emoji.style.top = y + "px";
    emoji.style.fontSize =
      (18 + Math.random()*35) + "px";

    emoji.style.zIndex = "2147483647";
    emoji.style.pointerEvents = "none";
    emoji.style.userSelect = "none";

    document.body.appendChild(emoji);

    const angle =
      Math.random() *
      Math.PI * 2;

    const distance =
      150 +
      Math.random()*350;

    const endX =
      Math.cos(angle) *
      distance;

    const endY =
      Math.sin(angle) *
      distance;

    emoji.animate([

      {
        transform:
          "translate(-50%,-50%) scale(.2)",
        opacity:1
      },

      {
        transform:
          `translate(
            calc(-50% + ${endX}px),
            calc(-50% + ${endY}px)
          )
          scale(1.4)
          rotate(${Math.random()*720-360}deg)`,
        opacity:1
      },

      {
        transform:
          `translate(
            calc(-50% + ${endX*1.4}px),
            calc(-50% + ${endY*1.4}px)
          )
          scale(.2)
          rotate(${Math.random()*1000}deg)`,
        opacity:0
      }

    ],{

      duration:
        2200 +
        Math.random()*1500,

      easing:
        "cubic-bezier(.15,.8,.3,1)",

      fill:"forwards"

    });

    setTimeout(()=>{
      emoji.remove();
    },5000);

  }


  /* BIG SKULL FLASH */

  const flash =
    document.createElement("div");

  flash.textContent = "☠️";

  flash.style.position = "fixed";
  flash.style.left = x + "px";
  flash.style.top = y + "px";
  flash.style.fontSize = "90px";

  flash.style.zIndex =
    "2147483647";

  flash.style.pointerEvents =
    "none";

  flash.style.userSelect =
    "none";

  document.body.appendChild(
    flash
  );

  flash.animate([

    {
      transform:
        "translate(-50%,-50%) scale(0)",
      opacity:1
    },

    {
      transform:
        "translate(-50%,-50%) scale(2.5)",
      opacity:0
    }

  ],{
    duration:700,
    easing:"ease-out",
    fill:"forwards"
  });

  setTimeout(()=>{
    flash.remove();
  },1000);

}

</script>
