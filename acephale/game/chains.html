<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta content="noindex, nofollow" name="robots">
<title>4chains</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:transparent;
    color:#d8d8d8;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,255,170,0.08), transparent 20%),
      radial-gradient(circle at 80% 10%, rgba(255,255,255,0.03), transparent 25%),
      radial-gradient(circle at 50% 90%, rgba(255,0,80,0.06), transparent 25%);
    pointer-events:none;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(10,12,16,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid #1d1d1d;
    padding:14px;
}

.logo{
    font-size:1.6rem;
    font-weight:bold;
    color:#7df9d0;
    letter-spacing:2px;
}

.subtitle{
    color:#6c7489;
    font-size:0.85rem;
    margin-top:4px;
}

.container{
    width:min(900px, 95%);
    margin:auto;
    padding:18px 0 120px 0;
}

.post{
    background:linear-gradient(180deg,#131313,#101010);
    border:1px solid #2c2c2c;
    border-radius:16px;
    padding:16px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
    animation:appear .35s ease;
    box-shadow:0 0 25px rgba(0,0,0,0.35);
}

.post::after{
    content:"";
    position:absolute;
    inset:auto -30px -30px auto;
    width:120px;
    height:120px;
    background:radial-gradient(circle, rgba(0,255,180,0.07), transparent 70%);
    pointer-events:none;
    z-index:0;
}

.post > *{
    position:relative;
    z-index:1;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(15px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.postHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#1a1a1a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    border:1px solid #2f2f2f;
}

.userInfo{
    display:flex;
    flex-direction:column;
}

.username{
    color:#8fffe1;
    font-weight:bold;
}

.meta{
    color:#707070;
    font-size:0.8rem;
}

.tag{
    background:#161616;
    border:1px solid #303030;
    color:#9ff8d7;
    padding:5px 9px;
    border-radius:999px;
    font-size:0.75rem;
}

.postText{
    line-height:1.5;
    color:#d4d7de;
    margin-bottom:14px;
    white-space:pre-wrap;
}

.reactions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:12px;
}

.reactBtn{
    border:none;
    background:#1a1a1a;
    color:#d0d7ea;
    padding:9px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:0.2s;
    border:1px solid #303030;
}

.reactBtn:hover{
    transform:translateY(-2px);
    background:#252525;
}

.comments{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.comment{
    background:#0c1118;
    border:1px solid #2a2a2a;
    border-radius:12px;
    padding:10px;
    font-size:0.92rem;
}

.comment strong{
    color:#bfffe9;
}


.playerCommentComposer{
    display:flex;
    gap:8px;
    margin-top:10px;
    position:relative;
    z-index:3;
    pointer-events:auto;
}

.playerCommentInput{
    flex:1;
    position:relative;
    z-index:4;
    pointer-events:auto;
    min-width:0;
    border:1px solid #2f2f2f;
    background:#181818;
    color:#f0f0f0;
    border-radius:999px;
    padding:9px 12px;
    outline:none;
}

.playerCommentBtn{
    border:1px solid #303030;
    position:relative;
    z-index:4;
    pointer-events:auto;
    background:#1a1a1a;
    color:#9ff8d7;
    border-radius:999px;
    padding:9px 13px;
    cursor:pointer;
}

.playerCommentBtn:hover{
    background:#252525;
}

.pinnedCustomPost{
    border-color:#7df9d0;
    box-shadow:0 0 30px rgba(125,249,208,.12);
}

.pinnedCustomPost .tag{
    color:#111;
    background:#9ff8d7;
    border-color:#9ff8d7;
}

.customSelfLink{
    display:inline-block;
    margin-top:4px;
    color:#9ff8d7;
    text-decoration:none;
    border-bottom:1px solid rgba(159,248,215,.45);
    position:relative;
    z-index:2;
}

.customSelfLink:hover{
    color:#fff;
    border-bottom-color:#fff;
}

.systemMessage{
    text-align:center;
    color:#7df9d0;
    padding:12px;
    margin:12px 0;
    opacity:0.7;
    font-size:0.9rem;
}

.controlPanel{
    position:fixed;
    bottom:16px;
    right:16px;
    display:flex;
    gap:10px;
    z-index:100;
}

.controlBtn{
    width:58px;
    height:58px;
    border-radius:50%;
    border:none;
    background:linear-gradient(180deg,#202020,#111111);
    color:#7df9d0;
    font-size:1.3rem;
    cursor:pointer;
    border:1px solid #343434;
    box-shadow:0 0 18px rgba(0,255,180,0.12);
    transition:0.2s;
}

.controlBtn:hover{
    transform:scale(1.08);
}

.glitch{
    animation:glitch 1.2s linear infinite;
}

@keyframes glitch{
    0%{text-shadow:1px 0 red,-1px 0 #9ff8d7;}
    50%{text-shadow:-1px 0 red,1px 0 #9ff8d7;}
    100%{text-shadow:1px 0 red,-1px 0 #9ff8d7;}
}

.floatingWarning{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    top:20px;
    background:#170f13;
    border:1px solid #6e2038;
    color:#ff7d9d;
    padding:12px 18px;
    border-radius:12px;
    z-index:200;
    animation:fadeOut 4s forwards;
}

@keyframes fadeOut{
    0%{opacity:0;}
    10%{opacity:1;}
    80%{opacity:1;}
    100%{opacity:0; transform:translateX(-50%) translateY(-10px);}
}



.modalOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.72);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:20px;
}

.modalOverlay.active{
    display:flex;
}

.modalBox{
    width:min(520px,100%);
    background:rgba(17,17,17,0.96);
    border:1px solid #313131;
    border-radius:22px;
    padding:22px;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
    animation:appear .25s ease;
}

.modalTitle{
    color:#9ff8d7;
    font-size:1.1rem;
    margin-bottom:14px;
    letter-spacing:1px;
}

#modalInput{
    width:100%;
    min-height:140px;
    resize:none;
    border:none;
    outline:none;
    background:#181818;
    border:1px solid #2f2f2f;
    color:#f0f0f0;
    border-radius:16px;
    padding:14px;
    font-size:0.98rem;
}

.modalActions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:16px;
}

.modalBtn{
    border:none;
    background:#9ff8d7;
    color:#111;
    padding:11px 16px;
    border-radius:999px;
    cursor:pointer;
    font-weight:bold;
}

.secondaryBtn{
    background:#252525;
    color:#d7d7d7;
}


@media (max-width:700px){
    .post{
        padding:13px;
    }

    .logo{
        font-size:1.3rem;
    }

    .reactBtn{
        flex:1 1 auto;
        text-align:center;
    }
}
</style>

<script>
const feed = document.getElementById("feed");

const STORAGE_KEY = "void_user_posts_v2";
const VOID_NOTIFICATIONS="void_notifications";

const PLAYER_ACTIVITY_KEY = "void_player_activity_v1";
const CUSTOM_PIN_SHOWN_KEY = "void_custom_pin_shown_v1";

/* ===== CUSTOMIZE THESE THREE VALUES ===== */
const CUSTOM_FIXED_POST_TEXT = "Forget the truth, tell a lie.";
const CUSTOM_SELF_LINK_LABEL = "Enter 🐔 TRUTHahn";
const CUSTOM_SELF_LINK = "./truthahn.html";
/* ======================================= */


function saveUserPost(text){
    const posts = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    posts.unshift({text:text,date:Date.now()});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
}

function loadUserPosts(){
    const posts = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    posts.reverse().forEach(p=>{
        createPost(true,p.text,"You");
    });
}

function clearUserData(){
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(VOID_NOTIFICATIONS);
    localStorage.removeItem(PLAYER_ACTIVITY_KEY);
    localStorage.removeItem(CUSTOM_PIN_SHOWN_KEY);
    location.reload();
}

function notify(text){
    const n = JSON.parse(localStorage.getItem(VOID_NOTIFICATIONS)||"[]");
    n.unshift(text);
    localStorage.setItem(VOID_NOTIFICATIONS,JSON.stringify(n.slice(0,25)));
}

document.addEventListener("keydown",(e)=>{
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==="e"){
        e.preventDefault();
        clearUserData();
    }
});



function getPlayerActivityCount(){
    return parseInt(localStorage.getItem(PLAYER_ACTIVITY_KEY) || "0", 10) || 0;
}

function registerPlayerActivity(){
    const next = getPlayerActivityCount() + 1;
    localStorage.setItem(PLAYER_ACTIVITY_KEY, String(next));

    if(next >= 5){
        showCustomPinnedPost();
    }
}

function showCustomPinnedPost(){
    if(document.getElementById("customPinnedPost")) return;

    const post = document.createElement("div");
    post.className = "post pinnedCustomPost";
    post.id = "customPinnedPost";

    post.innerHTML = `
        <div class="postHeader">
            <div class="user">
                <div class="avatar">⚠️</div>
                <div class="userInfo">
                    <div class="username">SYSTEM</div>
                    <div class="meta">Easter egg unlocked</div>
                </div>
            </div>
            <div class="tag">PINNED</div>
        </div>

        <div class="postText">${CUSTOM_FIXED_POST_TEXT}</div>
        <a class="customSelfLink" href="${CUSTOM_SELF_LINK}" target="_self">${CUSTOM_SELF_LINK_LABEL} ↗</a>
    `;

    feed.prepend(post);
    localStorage.setItem(CUSTOM_PIN_SHOWN_KEY, "1");
}

function insertFeedPost(post){
    const pinned = document.getElementById("customPinnedPost");
    if(pinned){
        pinned.insertAdjacentElement("afterend", post);
    }else{
        feed.prepend(post);
    }
}

function submitPlayerComment(post, input){
    const text = input.value.trim();
    if(!text) return;

    const commentBox = post.querySelector(".comments");
    const d = document.createElement("div");
    d.className = "comment";
    d.innerHTML = `<strong>You</strong>: ${escapeHTML(text)}`;
    commentBox.appendChild(d);

    input.value = "";
    registerPlayerActivity();
}

function escapeHTML(value){
    return value.replace(/[&<>"']/g, ch => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[ch]));

const reactions = ["👍🏻","👎🏻","🙃","😅","🔥","😵","😳","🤬"];

function rand(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function randNum(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

/* Pause automatic board activity while the pointer is over a thread */
let threadHoverPaused = false;

feed.addEventListener("mouseover", (e)=>{
    if(e.target.closest(".post")) threadHoverPaused = true;
});

feed.addEventListener("mouseout", (e)=>{
    const post = e.target.closest(".post");
    if(post && !post.contains(e.relatedTarget)){
        threadHoverPaused = false;
    }
});

function createComment(){
    return `
        <div class="comment">
            <strong>${rand(names)}</strong>: ${rand(comments)}
        </div>
    `;
}

function createPost(initial=false, customText=null, customUser=null){
    const post = document.createElement("div");
    post.className = "post";

    let reactionHTML = "";
    reactions.forEach(r=>{
        reactionHTML += `
            <button class="reactBtn">
                ${r} ${randNum(0,99)}
            </button>
        `;
    });

    let commentHTML = "";
    const amount = randNum(1,4);
    for(let i=0;i<amount;i++){
        commentHTML += createComment();
    }

    post.innerHTML = `
        <div class="postHeader">
            <div class="user">
                <div class="avatar">${rand(avatars)}</div>
                <div class="userInfo">
                    <div class="username">${customUser || rand(names)}</div>
                    <div class="meta">#${randNum(100000,999999)} • ${randNum(1,59)}m ago</div>
                </div>
            </div>

            <div class="tag">${rand(tags)}</div>
        </div>

        <div class="postText">${escapeHTML(customText || rand(texts))}</div>

        <div class="reactions">
            ${reactionHTML}
        </div>

        <div class="comments">
            ${commentHTML}
        </div>

        <div class="playerCommentComposer">
            <input class="playerCommentInput" type="text" placeholder="Reply anonymously...">
            <button class="playerCommentBtn" type="button">Reply</button>
        </div>
    `;

    insertFeedPost(post);

    const btns = post.querySelectorAll(".reactBtn");
    btns.forEach(btn=>{
        btn.addEventListener("click", ()=>{
            const parts = btn.textContent.trim().split(" ");
            let count = parseInt(parts[1]);
            count++;
            btn.innerHTML = parts[0] + " " + count;

            if(Math.random() > 0.82){
                addSystemMessage("A hidden user reacted to your reaction.");
            }
        });
    });


    const playerCommentInput = post.querySelector(".playerCommentInput");
    const playerCommentBtn = post.querySelector(".playerCommentBtn");

    playerCommentBtn.addEventListener("click", ()=>{
        submitPlayerComment(post, playerCommentInput);
    });

    playerCommentInput.addEventListener("keydown", (e)=>{
        if(e.key === "Enter"){
            e.preventDefault();
            submitPlayerComment(post, playerCommentInput);
        }
    });

    setTimeout(()=>{
        const randomReplies = [
            "this one feels different",
            "finally someone said it",
            "you should delete this",
            "the system noticed your post",
            "based anon",
            "thread archived in 3 hours",
            "this is why I still browse here",
            "this post glows",
            "this might be real",
            "OP is being watched"
        ];

        const randomReactions = ["😜","🤩","🥸","😎","🤓","😭"];

        const commentBox = post.querySelector(".comments");
        const reactionBox = post.querySelector(".reactions");

        const autoComment = document.createElement("div");
        autoComment.className = "comment";
        autoComment.innerHTML = `<strong>${rand(names)}</strong>: ${rand(randomReplies)}`;

        commentBox.appendChild(autoComment);

        const extraReaction = document.createElement("button");
        extraReaction.className = "reactBtn";
        extraReaction.innerHTML = `${rand(randomReactions)} ${randNum(20,120)}`;

        reactionBox.appendChild(extraReaction);

        extraReaction.addEventListener("click", ()=>{
            const parts = extraReaction.textContent.trim().split(" ");
            let count = parseInt(parts[1]);
            count++;
            extraReaction.innerHTML = parts[0] + " " + count;
        });

    }, 1500 + Math.random()*2500);


    if(!initial && Math.random() > 0.74){
        createWarning();
    }
}

function addSystemMessage(text){
    const msg = document.createElement("div");
    msg.className = "systemMessage";
    msg.innerText = text;
    feed.prepend(msg);

    setTimeout(()=>msg.remove(), 7000);
}

function createWarning(){
    const warn = document.createElement("div");
    warn.className = "floatingWarning";
    warn.innerText = "Signal instability detected in thread cluster.";
    document.body.appendChild(warn);

    setTimeout(()=>warn.remove(), 4000);
}

function spawnChaos(){
    for(let i=0;i<3;i++){
        setTimeout(()=>createPost(), i*250);
    }

    addSystemMessage("Chaos spike injected into live board.");
}

function injectUserPost(){
    document.getElementById("postModal").classList.add("active");
    document.getElementById("modalInput").focus();
}

function closeModal(){
    document.getElementById("postModal").classList.remove("active");
}

function submitModalPost(){
    const input = document.getElementById("modalInput");
    const custom = input.value.trim();

    if(!custom){
        addSystemMessage("Transmission rejected: empty signal.");
        return;
    }

    createPost(false, custom, "You");
    saveUserPost(custom);
    registerPlayerActivity();

    input.value = "";
    closeModal();

    addSystemMessage("Your anonymous signal entered the system.");
}

for(let i=0;i<7;i++){
    createPost(true);
}

loadUserPosts();

if(getPlayerActivityCount() >= 5 || localStorage.getItem(CUSTOM_PIN_SHOWN_KEY) === "1"){
    showCustomPinnedPost();
}

setInterval(()=>{
    if(threadHoverPaused) return;
    createPost();

    if(feed.children.length > 35){
        feed.removeChild(feed.lastChild);
    }
}, 3500 + Math.random()*3000);

setInterval(()=>{
    if(threadHoverPaused) return;
    const posts = document.querySelectorAll(".post");
    if(posts.length > 0){
        const randomPost = posts[randNum(0, posts.length-1)];
        const commentBox = randomPost.querySelector(".comments");
        commentBox.innerHTML += createComment();
    }
}, 5000);


setInterval(()=>{
    if(threadHoverPaused) return;
    const posts=document.querySelectorAll('.post');
    if(!posts.length) return;

    const p=posts[Math.floor(Math.random()*posts.length)];
    const c=p.querySelector('.comments');

    const quote=Math.floor(Math.random()*900000)+100000;

    const replies=[
      '>>'+quote+' this thread glows',
      '>>OP archive this before midnight',
      '>>'+quote+' I saw the same thing',
      '>>OP the board remembers',
      '>>'+quote+' check the hidden replies'

    const d=document.createElement('div');
    d.className='comment';
    d.innerHTML='<strong>'+['ArchiveGhost','NullWitness','SignalRat'][Math.floor(Math.random()*3)]+'</strong>: '+replies[Math.floor(Math.random()*replies.length)];
    c.appendChild(d);
},9000);

      'A dormant thread has been bumped.',
      'Someone replied to a forgotten post.',
      'Archive scan completed.',
