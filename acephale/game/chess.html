};




let unlockedGrade=parseInt(localStorage.getItem('masonicUnlockedMission')||'1');
let completedGrades=JSON.parse(localStorage.getItem('masonicCompletedMissions')||'[]');
let gradeCompleted=false;

function updateGradeLocks(){

 const sel=document.getElementById('grade');

 [...sel.options].forEach(opt=>{

   const v=parseInt(opt.value||0);

   if(v>0){

      opt.disabled=v>unlockedGrade;

      const base='Mission '+v;

      if(completedGrades.includes(v)){

         if(String(v)===String(trainingGrade)){
            opt.textContent=base;
         }else{
            opt.textContent='✓ '+base;
         }

      }else{

         opt.textContent=base;

      }

   }

 });

}

let trainingGrade=null;
let trainingIndex=0;

function showModal(title,text,aText='Continue',bText='Dismiss',aFn=null,bFn=null){
const o=document.getElementById('modalOverlay');
o.style.display='flex';
modalTitle.textContent=title;
modalText.textContent=text;
modalA.textContent=aText;
modalB.textContent=bText;
modalA.onclick=()=>{o.style.display='none'; if(aFn)aFn();};
modalB.onclick=()=>{o.style.display='none'; if(bFn)bFn();};
}


function moveHint(san){
    if(!san) return "Completed";
    if(san==="O-O") return "♔ Castle Kingside";
    if(san==="O-O-O") return "♔ Castle Queenside";
    if(san.startsWith("N")) return "♘ Knight → "+san.replace("N","");
    if(san.startsWith("B")) return "♗ Bishop → "+san.replace("B","");
    if(san.startsWith("R")) return "♖ Rook → "+san.replace("R","");
    if(san.startsWith("Q")) return "♕ Queen → "+san.replace("Q","");
    if(san.startsWith("K")) return "♔ King → "+san.replace("K","");
    return "♙ Pawn → "+san;
}


function updateProgress(){

 const completed=completedGrades.length;
 const pct=Math.round((completed/33)*100);

 const el=document.getElementById('degreeProgress');

 if(el){

   el.innerHTML=
   'Mission completed: '+completed+'/33<br>'+
   pct+'% Progress';

 }

}

function updateTrainer(){
const g=document.getElementById('grade').value;
const box=document.getElementById('openingTrainer');
if(!g || !grades[g]){
 box.innerHTML='Free Play | Missions disabled';
 return;
}
trainingGrade=String(g);
updateProgress();

const op=grades[g];
const currentMove=op.moves[trainingIndex] || null;

box.innerHTML =
'<b>Mission '+g+'/33</b><br>'+
op.name+
'<br><br><span style="color:#d4af37">Play:</span><br>'+
'<div style="font-size:20px;font-weight:bold;margin-top:6px;">'+
moveHint(currentMove)+
'</div>';
}



const blob=new Blob([`
self.importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
`],{type:'application/javascript'});

const engine=new Worker(URL.createObjectURL(blob));

const P={
p:"⚔️",r:"🏰",n:"🦄",b:"👻",q:"🧜🏻‍♀️",k:"🧙🏻‍♂️",
P:"🥷🏻",R:"🏛️",N:"🎠",B:"💀",Q:"🗽",K:"🤴🏼"
};

let selected=null;
let legal=[];

let whiteTime=300;
let blackTime=300;
let clockTimer=null;
let gameStarted=false;

function fmtTime(t){
const m=Math.floor(t/60);
const s=t%60;
return String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}

function updateClocks(){
document.getElementById("whiteClock").textContent=fmtTime(whiteTime);
document.getElementById("blackClock").textContent=fmtTime(blackTime);
}

function setupTimeControl(){
const d=document.getElementById("difficulty").value;

if(d==="500"){ whiteTime=600; blackTime=600; }      // Apprentice 10 min
else if(d==="1200"){ whiteTime=300; blackTime=300; } // Fellow 5 min
else { whiteTime=180; blackTime=180; }               // Master 3 min

updateClocks();

if(clockTimer) clearInterval(clockTimer);

clockTimer=setInterval(()=>{

if(!gameStarted) return;

if(ritualPause) return;

if(chess.in_checkmate()) return;

if(chess.turn()==="w"){

    whiteTime=Math.max(0,whiteTime-1);

    if(whiteTime===0){

        clearInterval(clockTimer);

        showModal(
            "Time Expired",
            "The Teutonic Order prevails by time.",
            "New Battle",
            "Dismiss",
            ()=>{ newGame(); }
        );
    }

}else{

    blackTime=Math.max(0,blackTime-1);

    if(blackTime===0){

        clearInterval(clockTimer);

        showModal(
            "Time Expired",
            "The Acéphale prevails by time.",
            "New Battle",
            "Dismiss",
            ()=>{ newGame(); }
        );
    }
}

updateClocks();

},1000);
}


function playMove(){}


function draw(){

const board=document.getElementById("board");
board.innerHTML="";

const pos=chess.board();

for(let r=0;r<8;r++){
for(let c=0;c<8;c++){

const sq=document.createElement("div");
sq.className="sq "+(((r+c)%2)?"dark":"light");

const name="abcdefgh"[c]+(8-r);

const piece=pos[r][c];

if(piece){
sq.textContent=P[piece.color==="w"?piece.type.toUpperCase():piece.type];
sq.classList.add(piece.color==="w"?"blue":"red");
}

if(legal.includes(name)){
const d=document.createElement("div");
d.className="dot";
sq.appendChild(d);
}

if(c===0){
const rank=document.createElement("div");
rank.className="coord rank";
rank.textContent=8-r;
sq.appendChild(rank);
}

if(r===7){
const file=document.createElement("div");
file.className="coord file";
file.textContent="abcdefgh"[c].toUpperCase();
sq.appendChild(file);
}

sq.onclick=()=>clickSquare(name);

board.appendChild(sq);
}
}

updateHistory();
updateScore();

let st="Your move";

if(chess.in_check()) st="CHECK!";
if(chess.in_checkmate()) st="CHECKMATE!";

if(chess.turn()==="b" && !chess.in_checkmate())
st="AI thinking...";

document.getElementById("status").textContent=st;
}

function clickSquare(square){

if(gradeCompleted) return;

if(chess.turn()!=="w") return;

if(!selected){

const p=chess.get(square);

if(p && p.color==="w"){
selected=square;
legal=chess.moves({square:square,verbose:true}).map(m=>m.to);
}

draw();
return;
}

const move=chess.move({
from:selected,
to:square,
promotion:"q"
});

selected=null;
legal=[];

if(move){

if(trainingGrade && grades[trainingGrade]){

 const expected=grades[trainingGrade].moves[trainingIndex];

 if(expected && move.san!==expected){

   chess.undo();

   showModal(
"Wrong Move",
"Expected: "+expected,
"Restart Mission",
"Dismiss",
()=>{
 trainingIndex=0;
 newGame();
}
);

   draw();
   return;
 }

 trainingIndex++;
 updateTrainer();

 if(trainingIndex>=grades[trainingGrade].moves.length){

   gradeCompleted=true;

   if(!completedGrades.includes(parseInt(trainingGrade))){

      completedGrades.push(parseInt(trainingGrade));

      localStorage.setItem(
      'masonicCompletedGrades',
      JSON.stringify(completedGrades)
      );
   }

   if(clockTimer){
      clearInterval(clockTimer);
   }

   updateGradeLocks();

   showModal(
    "Mission Completed",
    grades[trainingGrade].name+" mastered.",
    "Next Mission",
    "Dismiss",

    ()=>{

      let g=parseInt(trainingGrade)+1;

      if(g<=33){

         if(g>unlockedGrade){
            unlockedGrade=g;

            localStorage.setItem(
            'masonicUnlockedGrade',
            String(unlockedGrade)
            );

            updateGradeLocks();
         }

         document.getElementById("grade").value=g;
         trainingGrade=String(g);
         trainingIndex=0;
         gradeCompleted=false;

         newGame();
      }
    },

    ()=>{

      gradeCompleted=false;
      document.getElementById("grade").value="";
      trainingGrade=null;
      trainingIndex=0;

      newGame();
    }
   );

   draw();
   return;
 }
}

if(!gameStarted){gameStarted=true;}

playMove();
draw();
setTimeout(function waitForRitual(){

    if(ritualPause){

        setTimeout(waitForRitual,100);
        return;
    }

    aiMove();

},100);

}else{
draw();
}
}

function cleanSAN(san){
return san.replace(/[+#]/g,'').replace(/[!?]/g,'');
}

function trainerEnabled(){
return !!document.getElementById("grade").value;
}

const trainerReplies={
1:["e5","Nc6","Bc5","Nf6","O-O"],
2:["e5","Nc6","a6","Nf6","Be7"],

if(!trainerEnabled()){

engine.onmessage=function(e){

if(txt.startsWith("bestmove")){

const m=txt.split(" ")[1];

if(m && m.length>=4){
chess.move({
from:m.slice(0,2),
to:m.slice(2,4),
promotion:"q"
});
}

playMove();
draw();
}
};

engine.postMessage("position fen "+chess.fen());
engine.postMessage("go movetime "+document.getElementById("difficulty").value);

return;
}

const g=parseInt(document.getElementById("grade").value||"0");
const replies=trainerReplies[g];

if(!replies){
draw();
return;
}

const replyIndex=Math.floor((chess.history().length-1)/2);
const san=replies[replyIndex];

if(!san){
draw();
return;
}

const legalMoves=chess.moves({verbose:true});

const found=legalMoves.find(m=>
cleanSAN(m.san)===cleanSAN(san)
);

if(found){
chess.move(found.san);
}

playMove();
draw();
}

}

}

chess.board().flat().forEach(p=>{

const v=values[p.type]||0;

function queueRitual(id){

    if(!ritualData[id]) return;

    ritualQueue.push(id);

    ritualQueue.sort((a,b)=>{

        return ritualData[b].priority -
               ritualData[a].priority;
    });

    if(!ritualPlaying){

        playNextRitual();
    }
}

    if(!ritual){

    /* ===================================== */

        const fromRank =
            parseInt(move.from[1]);

        const toRank =
            parseInt(move.to[1]);

        const dist =
            Math.abs(toRank - fromRank);

        if(move.captured){

            if(Math.random() < 0.35){

                rituals.push(
                    "PAWN_CAPTURE"
                );
            }

            rituals.push(

            );

            if(Math.random() < 0.15){

                rituals.push(
                    "PAWN_ADVANCE"
                );
            }

            move.flags &&
            move.flags.includes("e")

            rituals.push("EN_PASSANT");

            rituals.push(
                "PAWN_PROMOTION"
            );
        }

            rituals.push("KNIGHT_FORK");

            move.to.charCodeAt(0) -

            rituals.push(

            rituals.push(
                "BISHOP_DIAGONAL_ADVANCE"
            );

    /* ===================================== */

        move.san === "O-O" ||
        move.san === "O-O-O"
    ){

        rituals.push("CASTLING");
    }

    /* CHECK STATES */
    /* ===================================== */

const isMate = safe(()=>chess.in_checkmate());
const isStalemate = safe(()=>chess.in_stalemate());
const isCheck = safe(()=>chess.in_check());

if(isCheck && !isMate && !isStalemate){
    rituals.push("CHECK");
}

    if(
        safe(()=>isDoubleCheck())
    ){

        rituals.push("DOUBLE_CHECK");
    }

    if(
        safe(()=>chess.in_checkmate())
    ){

        rituals.push("CHECKMATE");
    }

    if(

    ){

        rituals.push("STALEMATE");

function isKnightFork(move){

    if(move.piece !== "n")
        return false;

    if(!chess.SQUARES)
        return false;

    const enemy = chess.turn();

    let attacked = 0;

    chess.SQUARES.forEach(square=>{

        const piece =
            chess.get(square);

        if(
            piece &&
            piece.color === enemy
        ){

            const attacks =
                chess.moves({
                    square:move.to,
                    verbose:true
                });

            if(
                attacks.some(
                    m => m.to === square
                )
            ){

                attacked++;
            }
        }
    });

    return attacked >= 2;
}

        return false;

    };

    const moving =
        values[move.piece] || 0;

    const captured =
        values[move.captured] || 0;
