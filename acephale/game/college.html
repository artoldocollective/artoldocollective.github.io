.cursor{

.voice{

.play{

.bar{

.progress{

.time{

@keyframes blink{

const chat=document.getElementById('chat');
function render(){
  chat.innerHTML='';
  data.forEach((m)=>{
    const el=document.createElement('div');
    el.className='message '+m.side;

    el.dataset.type=m.type||'text';
    el.dataset.fulltext=m.text||'';
    el.dataset.typed='0';

    let content='';

    if(m.type==='audio'){
      content=`
        <div class="name">${m.name}</div>
        <div class="voice">
          <button class="play">▶</button>
          <div class="bar"><div class="progress"></div></div>
          <div class="time">0:00</div>
          <audio src="${m.src}"></audio>
        </div>
      `;
    }else{
      content=`
        <div class="name">${m.name}</div>
        <div class="text"></div>
      `;
    }

    el.innerHTML=content;
    chat.appendChild(el);
  });

  bindAudio();
  observe();
}

function typeMessage(el){
  if(el.dataset.type!=='text'||el.dataset.typed==='1')return;
  el.dataset.typed='1';

  const box=el.querySelector('.text');
  const full=el.dataset.fulltext;

  let n=0;
  box.innerHTML='<span class="cursor">|</span>';

  const timer=setInterval(()=>{
    n++;
    box.innerHTML=full.slice(0,n)+'<span class="cursor">|</span>';

    if(n>=full.length){
      clearInterval(timer);
      box.textContent=full;
    }
  },25);
}

function bindAudio(){
  document.querySelectorAll('.voice').forEach(v=>{
    const btn=v.querySelector('.play');
    const audio=v.querySelector('audio');
    const prog=v.querySelector('.progress');
    const time=v.querySelector('.time');

    btn.onclick=()=>{
      document.querySelectorAll('audio').forEach(a=>{
        if(a!==audio)a.pause();
      });

      if(audio.paused){
        audio.play();
        btn.textContent='❚❚';
      }else{
        audio.pause();
        btn.textContent='▶';
      }
    };

    audio.addEventListener('timeupdate',()=>{
      if(audio.duration){
        prog.style.width=(audio.currentTime/audio.duration*100)+'%';
        const m=Math.floor(audio.currentTime/60);
        const s=Math.floor(audio.currentTime%60).toString().padStart(2,'0');
        time.textContent=`${m}:${s}`;
      }
    });

    audio.addEventListener('ended',()=>{
      btn.textContent='▶';
    });
  });
}

function observe(){
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting && !e.target.dataset.started){
        e.target.dataset.started='1';

        setTimeout(()=>{
          e.target.classList.add('visible');
          typeMessage(e.target);
        },350);
      }
    });
  },{threshold:0.45});

  document.querySelectorAll('.message').forEach(m=>io.observe(m));
}

render();
</script>

<script>

/* =========================
   SEARCH SYSTEM
========================= */

const searchToggle=document.getElementById('searchToggle');
const searchOverlay=document.getElementById('searchOverlay');
const searchInput=document.getElementById('searchInput');
const searchResults=document.getElementById('searchResults');

function openSearch(){
  searchOverlay.classList.add('open');

  setTimeout(()=>{
    searchInput.focus();
  },120);

  renderResults('');
}

function closeSearch(){
  searchOverlay.classList.remove('open');
  searchInput.value='';
}

searchToggle.onclick=openSearch;

document.addEventListener('keydown',(e)=>{

  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    openSearch();
  }

  if(e.key==='Escape'){
    closeSearch();
  }
});

searchOverlay.addEventListener('click',(e)=>{
  if(e.target===searchOverlay){
    closeSearch();
  }
});

function highlight(text,q){
  if(!q)return text;

  const r=new RegExp(`(${escapeRegExp(q)})`,'gi');

  return text.replace(r,'<mark>$1</mark>');
}

function escapeRegExp(string){
  return string.replace(/[.*+?^${}()|[\]\\]/g,'\\\\$&');
}

function renderResults(query){

  const q = query.trim().toLowerCase();

  searchResults.innerHTML = '';

  const matches = data
    .map((item, index) => ({ ...item, index }))
    .filter(item =>
      !q ||
      item.name.toLowerCase().includes(q) ||
      item.text.toLowerCase().includes(q)
    );

  if (!matches.length){
    searchResults.innerHTML = `
      <div class="searchResult">
        <div class="searchText">No results found.</div>
      </div>
    `;
    return;
  }

  matches.forEach(item => {

    const div = document.createElement('div');
    div.className = 'searchResult';

    div.innerHTML = `
      <div class="searchName">${item.name}</div>
      <div class="searchText">
        ${highlight(item.text, query)}
      </div>
    `;

    div.onclick = () => {

      closeSearch();

      const target =
        document.querySelectorAll('.message')[item.index];

      if (!target) return;

      target.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });

      target.classList.add('focused');

      setTimeout(() => {
        target.classList.remove('focused');
      }, 2000);

    };

    searchResults.appendChild(div);

  });

}

searchInput.addEventListener('input',(e)=>{
  renderResults(e.target.value);
});

searchInput.addEventListener('keydown',(e)=>{

  if(e.key==='Enter'){

    const first=document.querySelector('.searchResult');

    if(first){
      first.click();
    }
  }
});

</script>

        'emo',
        registers.emo
      )}

      ${registerHTML(
        'common',
        registers.common
      )}

      ${registerHTML(
        'hot',
        registers.hot
      )}

      ${registerHTML(
        'thirties',
        registers.thirties
      )}

      ${registerHTML(
        'cyber',
        registers.cyber
      )}

    </div>


    <div class="gc-meta-row">

      <div class="gc-meta-card">

        <div class="gc-meta-label">
          REGIME
        </div>

        <div class="gc-meta-value">
          ${
            CONFIG.regimes[
              meta.regime
            ] || ''
          }
          ${escapeHTML(
            meta.regime || '—'
          )}
        </div>

      </div>


      <div class="gc-meta-card">

        <div class="gc-meta-label">
          ATMOSPHERE
        </div>

        <div class="gc-meta-value">
          ${
            CONFIG.atmospheres[
              meta.atmosphere
            ] || ''
          }
          ${escapeHTML(
            meta.atmosphere || '—'
          )}
        </div>

      </div>

    </div>


    <button
      class="gc-compare"
      type="button"
    >
      COMPARE WITH NEXT BUBBLE →
    </button>

  `;


  popup
    .querySelector('.gc-compare')
    .onclick = e => {

      e.stopPropagation();

      compareWithNext(node);

    };


  node.appendChild(popup);

}


function registerHTML(key,value){

  return `

    <div class="gc-register">

      <div class="gc-register-name">
        ${
          CONFIG.registerLabels[key]
        }
      </div>

      <div class="gc-register-value">
        ${escapeHTML(value || '—')}
      </div>

    </div>

  `;

}


/* ============================================================
   SELECT PAIR
============================================================ */

function compareWithNext(nodeA){

  const all = [
    ...document.querySelectorAll('.gc-target')
  ];

  const position = all.indexOf(nodeA);

  const nodeB = all[position + 1];

  if(!nodeB){
    alert('This is the final Sacred Bubble.');
    return;
  }

  const indexA = Number(nodeA.dataset.gcId);
  const indexB = Number(nodeB.dataset.gcId);

  const metaA = getAnalysis(indexA);
  const metaB = getAnalysis(indexB);

  if(
    !metaA ||
    !metaB ||
    !metaA.nodes ||
    !metaB.nodes
  ){
    alert(
      'Both bubbles need semantic node analysis before this transition can be played.'
    );
    return;
  }

  state.activeA = nodeA;
  state.activeB = nodeB;

  openTransitionWheel(
    nodeA,
    nodeB,
    metaA,
    metaB
  );
}


/* ============================================================
   TRANSITION WHEEL
============================================================ */

function openTransitionWheel(
  nodeA,
  nodeB,
  metaA,
  metaB
){

  closeCaptions();

  document
    .querySelectorAll(
      '.gc-transition-overlay'
    )
    .forEach(x => x.remove());


  const source =
    dominantNode(metaA);

  const target =
    dominantNode(metaB);


  /*
    There are only 12 directional transitions
    if the two dominant nodes differ.

    If both bubbles have the same dominant node,
    there is no directional mutation to guess.
  */

  if(source === target){

    openStablePairResult(
      nodeA,
      nodeB,
      metaA,
      metaB,
      source
    );

    return;

  }


  const overlay =
    document.createElement('div');

  overlay.className =
    'gc-transition-overlay';


  const box =
    document.createElement('div');

  box.className =
    'gc-transition-box';


  box.innerHTML = `

    <button
      class="gc-close"
      type="button"
    >×</button>

    <div class="gc-transition-title">
      PHENOMENOLOGY OF TRANSITIONS
    </div>

    <div class="gc-transition-question">
      WHAT HAPPENED?
    </div>

    <div class="gc-transition-sub">
      Read both Sacred Bubbles and choose
      one of the twelve directional mutations.
    </div>

    <div class="gc-pair-preview">

      <div class="gc-mini-bubble">
        ${bubblePreview(nodeA)}
      </div>

      <div class="gc-pair-arrow">
        →
      </div>

      <div class="gc-mini-bubble">
        ${bubblePreview(nodeB)}
      </div>

    </div>

    <div class="gc-wheel"></div>

    <div class="gc-wheel-tooltip"></div>

  `;


  overlay.appendChild(box);

  document.body.appendChild(overlay);


  box
    .querySelector('.gc-close')
    .onclick = () => overlay.remove();


  const wheel =
    box.querySelector('.gc-wheel');

  const tooltip =
    box.querySelector(
      '.gc-wheel-tooltip'
    );


  const entries =
    Object.entries(TRANSITIONS);


  entries.forEach(
    ([key,item],i) => {

      const angle =
        (Math.PI * 2 / entries.length)
        * i
        - Math.PI / 2;

      const radius = 42;

      const x =
        50 + Math.cos(angle)*radius;

      const y =
        50 + Math.sin(angle)*radius;


      const btn =
        document.createElement('button');

      btn.className =
        'gc-transition-choice';

      btn.innerHTML =
        item.glyph;

      btn.style.left =
        `${x}%`;

      btn.style.top =
        `${y}%`;


      btn.onmouseenter = e => {

        tooltip.textContent =
          item.label;

        tooltip.style.opacity = 1;

        moveTooltip(
          tooltip,
          e
        );

      };


      btn.onmousemove = e => {

        moveTooltip(
          tooltip,
          e
        );

      };


      btn.onmouseleave = () => {

        tooltip.style.opacity = 0;

      };


      btn.onclick = () => {

        validateTransition(
          overlay,
          nodeA,
          nodeB,
          metaA,
          metaB,
          key
        );

      };


      wheel.appendChild(btn);

    }
  );

}


function moveTooltip(
  tooltip,
  event
){

  tooltip.style.left =
    event.clientX + 'px';

  tooltip.style.top =
    event.clientY + 'px';

}


/* ============================================================
   VALIDATE TRANSITION
============================================================ */

function validateTransition(
  overlay,
  nodeA,
  nodeB,
  metaA,
  metaB,
  chosenKey
){

  const source =
    dominantNode(metaA);

  const target =
    dominantNode(metaB);

  const correctKey =
    `${source}>${target}`;

  const correct =
    chosenKey === correctKey;

  const pair =
    pairKey(nodeA,nodeB);


  if(
    !state.answeredPairs.has(pair)
  ){

    state.answeredPairs.add(pair);

    state.answered++;

    if(correct){

      state.correct++;

      state.score++;

    }

    updateHUD();

  }


  const correctInfo =
    TRANSITIONS[correctKey];

  const chosenInfo =
    TRANSITIONS[chosenKey];

  const consensus =
    calculateConsensus(
      metaA,
      metaB
    );


  const box =
    overlay.querySelector(
      '.gc-transition-box'
    );


  box.innerHTML = `

    <button
      class="gc-close"
      type="button"
    >×</button>


    <div class="gc-transition-result">

      <div class="gc-result-status">
        ${
          correct
          ? '✓ TRANSITION DETECTED'
          : '✕ ALTERNATIVE READING'
        }
      </div>


      <div class="gc-result-main">

        ${correctInfo.glyph}

        ${correctInfo.label}

      </div>


      <div class="gc-result-relation">

        ${correctInfo.relation}

      </div>


      ${
        !correct
        ? `

        <div
          style="
            font-size:12px;
            opacity:.6;
            margin-bottom:10px;
          "
        >
          YOUR CHOICE:
          ${chosenInfo.glyph}
          ${chosenInfo.label}
        </div>

        `
        : ''
      }


      <div class="gc-consensus">

        ${
          correct
          ? `
            <strong>${consensus}%</strong>
            of the Collegians answered like you.
          `
          : `
            <strong>${consensus}%</strong>
            of the Collegians identified
            <strong>${correctInfo.label}</strong>.
          `
        }

      </div>


      <div class="gc-xray-title">

        POST-GAME SEMANTIC X-RAY

      </div>


<div class="gc-xray-grid">

  ${nodeXRay(
    'BUBBLE A',
    metaA,
    nodeA
  )}

  ${nodeXRay(
    'BUBBLE B',
    metaB,
    nodeB
  )}

</div>


      <button
        class="gc-next"
        type="button"
      >
        RETURN TO SHUTAPP
      </button>

    </div>

  `;


  box
    .querySelector('.gc-close')
    .onclick = () => overlay.remove();


  box
    .querySelector('.gc-next')
    .onclick = () => {

      overlay.remove();

      nodeB.scrollIntoView({
        behavior:'smooth',
        block:'center'
      });

    };


  if(
    state.answered >=
    CONFIG.maxQuestions
  ){

    setTimeout(
      finalScreen,
      350
    );

  }

}


/* ============================================================
   SAME NODE
============================================================ */

function openStablePairResult(
  nodeA,
  nodeB,
  metaA,
  metaB,
  source
){

  const overlay =
    document.createElement('div');

  overlay.className =
    'gc-transition-overlay';


  overlay.innerHTML = `

    <div class="gc-transition-box">

      <button
        class="gc-close"
        type="button"
      >×</button>

      <div class="gc-transition-result">

        <div class="gc-result-status">
          STABLE PASSAGE
        </div>

        <div class="gc-result-main">

          ${CONFIG.nodes[source]}
          ${source} → ${source}

        </div>

        <div class="gc-result-relation">

          NO DIRECTIONAL MUTATION

        </div>

        <p
          style="
            font-size:13px;
            line-height:1.55;
            opacity:.7;
          "
        >
          Both consecutive bubbles share
          the same dominant Caillois node.
          The twelve-part transition wheel
          is therefore not activated for
          this pair.
        </p>

        <div class="gc-xray-title">

          SEMANTIC X-RAY

        </div>

<div class="gc-xray-grid">

  ${nodeXRay(
    'BUBBLE A',
    metaA,
    nodeA
  )}

  ${nodeXRay(
    'BUBBLE B',
    metaB,
    nodeB
  )}

</div>

      </div>

    </div>

  `;


  document.body.appendChild(
    overlay
  );


  overlay
    .querySelector('.gc-close')
    .onclick = () => overlay.remove();

}


/* ============================================================
   CONSENSUS
============================================================ */

function calculateConsensus(
  metaA,
  metaB
){

  /*
    "COLLEGIANS CONSENSUS"

    Derived from semantic certainty.

    The clearer the dominant node
    compared with the runner-up,
    the higher the simulated consensus.

    Range: 52% – 97%
  */

  const confidenceA =
    nodeConfidence(metaA);

  const confidenceB =
    nodeConfidence(metaB);

  const confidence =
    (confidenceA + confidenceB) / 2;

  return Math.round(
    52 + confidence * 45
  );

}


function nodeConfidence(meta){

  const nodes =
    normalizedNodes(meta);

  if(!nodes) return 0;

  const values =
    Object.values(nodes)
      .sort((a,b) => b-a);

  const first =
    values[0] || 0;

  const second =
    values[1] || 0;

  const margin =
    first-second;

  /*
    Margin of .50 or above is
    treated as maximum confidence.
  */

  return Math.max(
    0,
    Math.min(
      1,
      margin/.50
    )
  );

}


/* ============================================================
   X-RAY
============================================================ */

function nodeXRay(
  title,
  meta,
  node
){

  const nodes =
    normalizedNodes(meta);

  if(!nodes){

    return `

      <div class="gc-xray">

        <strong>${title}</strong>

        No node data.

      </div>

    `;

  }


  const lines =
    Object.entries(CONFIG.nodes)
      .map(([key,emoji]) => {

        const value =
          nodes[key] || 0;

        const pct =
          Math.round(value*100);

        return `

          <div class="gc-node-line">

            <span>
              ${emoji} ${key}
            </span>

            <div class="gc-node-bar">

              <div
                class="gc-node-fill"
                style="
                  width:${pct}%;
                "
              ></div>

            </div>

            <span>
              ${pct}%
            </span>

          </div>

        `;

      })
      .join('');


return `

  <div class="gc-xray">

    <strong>${title}</strong>

    <div class="gc-xray-message">
      ${bubblePreview(node)}
    </div>

    ${lines}

  </div>

`;

}


/* ============================================================
   HELPERS
============================================================ */

function bubblePreview(node){

  const name =
    node.querySelector('.name');

  const text =
    node.querySelector('.text');


  return `

    ${
      name
      ? `<strong>${escapeHTML(name.textContent)}</strong><br>`
      : ''
    }

    ${
      text
      ? escapeHTML(text.textContent)
      : escapeHTML(node.textContent)
    }

  `;

}


function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* ============================================================
   HUD UPDATE
============================================================ */

function updateHUD(){

  document
    .getElementById('gc-score')
    .innerText =
      state.score;

  document
    .getElementById('gc-answered')
    .innerText =
      state.answered;

  document
    .getElementById('gc-correct')
    .innerText =
      state.correct;

}


/* ============================================================
   FINAL
============================================================ */

function finalScreen(){

  if(
    document.querySelector(
      '.gc-final'
    )
  ) return;


  const div =
    document.createElement('div');

  div.className =
    'gc-final';


  const ratio =
    state.answered
      ? Math.round(
          state.correct /
          state.answered *
          100
        )
      : 0;


  let diagnosis = '';


  if(ratio < 35){

    diagnosis =
      'The circuit remains suspicious of your sociology.';

  }

  else if(ratio < 70){

    diagnosis =
      'You recognize several mutations of the Sacred Circuit.';

  }

  else{

    diagnosis =
      'The Collegians reluctantly admit that you can read the circuit.';

  }


  div.innerHTML = `

    <div
      style="
        font-size:10px;
        letter-spacing:.15em;
        opacity:.5;
      "
    >
      FINAL DIAGNOSIS
    </div>

    <h1>${ratio}%</h1>

    <p>${diagnosis}</p>

    <hr
      style="
        border:0;
        border-top:
          1px solid #333;
      "
    >

    <p>
      CORRECT:
      ${state.correct}
    </p>

    <p>
      TRANSITIONS:
      ${state.answered}
    </p>

  `;


  document.body.appendChild(
    div
  );

}


/* ============================================================
   CLOSE
============================================================ */

function closeCaptions(){

  document
    .querySelectorAll(
      '.gc-popup'
    )
    .forEach(
      x => x.remove()
    );

  document
    .querySelectorAll(
      '.gc-target'
    )
    .forEach(
      x => x.classList.remove(
        'gc-active'
      )
    );

}


window.addEventListener(
  'click',
  e => {

    if(
      !e.target.closest(
        '.gc-popup'
      ) &&
      !e.target.closest(
        '.gc-overlay-btn'
      )
    ){

      closeCaptions();

    }

  }
);


})();

</script>


<script>

const flyingEmoticons = [
    "❤️","😂","😍","🔥","✨","😎","🤖",
    "💀","👾","🌈","⚡","💜","😈","🥳"
];

function brainFirework(x, y){

    for(let i = 0; i < 12; i++){

        setTimeout(()=>{

            const emoji = document.createElement("div");

            emoji.textContent =
                flyingEmoticons[
                    Math.floor(Math.random()*flyingEmoticons.length)
                ];

            const startX = x + (Math.random()*60-30);
            const startY = y;

            emoji.style.position = "fixed";
            emoji.style.left = startX + "px";
            emoji.style.top = startY + "px";
            emoji.style.fontSize = (25 + Math.random()*35) + "px";
            emoji.style.zIndex = "99999";
            emoji.style.pointerEvents = "none";

            document.body.appendChild(emoji);

            const drift = Math.random()*200-100;
            const rise = 500 + Math.random()*400;
            const spin = Math.random()*720-360;

            emoji.animate([

                {
                    transform:"translate(0,0) scale(1)",
                    opacity:1
                },

                {
                    transform:
                    `translate(${drift}px,-${rise}px)
                     scale(1.3)
                     rotate(${spin}deg)`,
                    opacity:0.9
                },

                {
                    transform:
                    `translate(${drift*1.5}px,-${rise+250}px)
                     scale(0.7)
                     rotate(${spin*2}deg)`,
                    opacity:0
                }

            ],{
                duration:4500 + Math.random()*2500,
                easing:"cubic-bezier(.15,.7,.2,1)",
                fill:"forwards"
            });

            setTimeout(()=>{
                emoji.remove();
            },7500);

        }, i*100);

    }

}

</script>
