    // --------- Component: minimal FXAA postprocess (no external deps) ----------
AFRAME.registerComponent("fxaa", {
  schema: {
    enabled: { type: "boolean", default: true }
  },

  init() {
    this._setup = this._setup.bind(this);
    this._resize = this._resize.bind(this);

    this.el.addEventListener("loaded", this._setup);
    window.addEventListener("resize", this._resize);
  },

  remove() {
    window.removeEventListener("resize", this._resize);
  },

  _setup() {
    if (!this.data.enabled) return;
    const sceneEl = this.el;
    const renderer = sceneEl.renderer;
    if (!renderer) return;

    // Create render target at current size
    this._createTargets();

    // Fullscreen quad scene
    this.postScene = new THREE.Scene();
    this.postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const fxaaMaterial = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: this.rt.texture },
        resolution: { value: new THREE.Vector2(1 / this._w, 1 / this._h) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform sampler2D tDiffuse;
        uniform vec2 resolution;

        // FXAA 3.11 (simplified)
        void main() {
          vec3 rgbNW = texture2D(tDiffuse, vUv + vec2(-1.0, -1.0) * resolution).xyz;
          vec3 rgbNE = texture2D(tDiffuse, vUv + vec2( 1.0, -1.0) * resolution).xyz;
          vec3 rgbSW = texture2D(tDiffuse, vUv + vec2(-1.0,  1.0) * resolution).xyz;
          vec3 rgbSE = texture2D(tDiffuse, vUv + vec2( 1.0,  1.0) * resolution).xyz;
          vec3 rgbM  = texture2D(tDiffuse, vUv).xyz;

          vec3 luma = vec3(0.299, 0.587, 0.114);
          float lumaNW = dot(rgbNW, luma);
          float lumaNE = dot(rgbNE, luma);
          float lumaSW = dot(rgbSW, luma);
          float lumaSE = dot(rgbSE, luma);
          float lumaM  = dot(rgbM,  luma);

          float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
          float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

          vec2 dir;
          dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
          dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

          float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * 0.25 * 0.03125, 0.0078125);
          float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
          dir = clamp(dir * rcpDirMin, vec2(-8.0), vec2(8.0)) * resolution;

          vec3 rgbA = 0.5 * (
            texture2D(tDiffuse, vUv + dir * (1.0/3.0 - 0.5)).xyz +
            texture2D(tDiffuse, vUv + dir * (2.0/3.0 - 0.5)).xyz
          );

          vec3 rgbB = rgbA * 0.5 + 0.25 * (
            texture2D(tDiffuse, vUv + dir * (0.0/3.0 - 0.5)).xyz +
            texture2D(tDiffuse, vUv + dir * (3.0/3.0 - 0.5)).xyz
          );

          float lumaB = dot(rgbB, luma);
          if ((lumaB < lumaMin) || (lumaB > lumaMax)) {
            gl_FragColor = vec4(rgbA, 1.0);
          } else {
            gl_FragColor = vec4(rgbB, 1.0);
          }
        }
      `
    });

    this.fxaaMat = fxaaMaterial;

    const quad = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      fxaaMaterial
    );
    this.postScene.add(quad);

    // Monkey-patch scene render to run post
    const originalRender = sceneEl.render.bind(sceneEl);
    this._originalRender = originalRender;

    sceneEl.render = (time, dt) => {
      // Render scene into RT using original render path
      renderer.setRenderTarget(this.rt);
      renderer.clear();
      originalRender(time, dt);

      // Render FXAA quad to screen
      renderer.setRenderTarget(null);
      this.fxaaMat.uniforms.tDiffuse.value = this.rt.texture;
      this.fxaaMat.uniforms.resolution.value.set(1 / this._w, 1 / this._h);
      renderer.render(this.postScene, this.postCamera);
    };

    this._resize();
  },

  _createTargets() {
    const sceneEl = this.el;
    const renderer = sceneEl.renderer;
    const canvas = renderer.domElement;

    this._w = Math.max(2, canvas.width);
    this._h = Math.max(2, canvas.height);

    if (this.rt) this.rt.dispose();

    this.rt = new THREE.WebGLRenderTarget(this._w, this._h, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat
    });
  },

  _resize() {
    if (!this.rt || !this.el.renderer) return;
    this._createTargets();
  }
});

    </script>

    <script>
      // --------- Inline PNG generator: 12 transparent numbered textures (1-12) ----------
function generateNumberPNGs(opts = {}) {
  const size = opts.size ?? 512;
  const font = opts.font ?? "bold 260px serif";
  const fill = opts.fill ?? "#ffffff";

  // Greek letters (20 values)
  const greek = [
    "🤡","☠️","👹","👻","👺",
    "🧙🏻‍♂️","🏰","🥷🏻","🦄","🧛",
    "🤖","🗽","👽","👾","💩",
    "🐍","🦉","🦇","👁️","🦂"
  ];

  const urls = [];

  for (let i = 0; i < 20; i++) {
    const c = document.createElement("canvas");
    c.width = size;
    c.height = size;

    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, size, size);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = font;
    ctx.fillStyle = fill;

    ctx.fillText(greek[i], size / 2, size / 2);

    urls.push(c.toDataURL("image/png"));
  }

  return urls;
}


const INLINE_NUMBER_PNGS = generateNumberPNGs({ size: 1024, font: "bold 520px sans-serif", lineWidth: 36 });

      // --------- Component: auto-place 12 image planes centered on each d12 face ----------
      AFRAME.registerComponent("d20-faces", {
        schema: {
          // comma-separated asset selectors: "#img1,#img2,..."
          srcs: { type: "string", default: "" },
          size: { type: "number", default: 0.85 },     // plane width/height
          offset: { type: "number", default: 0.02 },   // push planes off the surface to avoid z-fighting
          normalTolerance: { type: "number", default: 0.08 } // grouping tolerance
        },

        init() {
          this._onObject3DSet = this._onObject3DSet.bind(this);
          this.el.addEventListener("object3dset", this._onObject3DSet);

          // In case the mesh is already there:
          this._tryBuild();
        },

        remove() {
          this.el.removeEventListener("object3dset", this._onObject3DSet);
        },

        _onObject3DSet(e) {
          if (e.detail.type === "mesh") this._tryBuild();
        },

        _tryBuild() {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh) return;

          // Some primitives wrap the mesh in a Group; find the first Mesh.
          const targetMesh = this._findFirstMesh(mesh);
          if (!targetMesh || !targetMesh.geometry) return;

          // Avoid rebuilding twice
          if (this._built) return;
          this._built = true;

          this._buildPlanesForDodeca(targetMesh);
        },

        _findFirstMesh(obj) {
          if (obj.isMesh) return obj;
          let found = null;
          obj.traverse((o) => {
            if (!found && o.isMesh) found = o;
          });
          return found;
        },

        _buildPlanesForDodeca(mesh) {
          const geom = mesh.geometry;
          const pos = geom.attributes.position;
          if (!pos) return;

          let srcList = this.data.srcs
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean);

          // If no external images provided, fall back to generated inline PNGs.
          if (!srcList.length) {
            srcList = INLINE_NUMBER_PNGS;
          }

          // --- Helper vector reuse ---
          const vA = new THREE.Vector3();
          const vB = new THREE.Vector3();
          const vC = new THREE.Vector3();
          const e1 = new THREE.Vector3();
          const e2 = new THREE.Vector3();
          const n = new THREE.Vector3();
          const center = new THREE.Vector3();

          // Dodecahedron is pentagons, but geometry is triangles.
          // We group triangles into 12 faces by (approx) normal direction.
          const groups = []; // { normal: Vector3, centers: [Vector3], count: number }

          const tol = this.data.normalTolerance;

          for (let i = 0; i < pos.count; i += 3) {
            vA.fromBufferAttribute(pos, i + 0);
            vB.fromBufferAttribute(pos, i + 1);
            vC.fromBufferAttribute(pos, i + 2);

            e1.subVectors(vB, vA);
            e2.subVectors(vC, vA);
            n.crossVectors(e1, e2).normalize();

            center.addVectors(vA, vB).add(vC).multiplyScalar(1 / 3);

            const eAB = vA.distanceTo(vB);
            const eBC = vB.distanceTo(vC);
            const eCA = vC.distanceTo(vA);
            const maxEdge = Math.max(eAB, eBC, eCA);

            // Find matching group by normal similarity (dot close to 1)
            let g = null;
            for (let gi = 0; gi < groups.length; gi++) {
              const dot = groups[gi].normal.dot(n);
              if (dot > 1 - tol) {
                g = groups[gi];
                break;
              }
            }

            if (!g) {
              groups.push({
                normal: n.clone(),
                centerSum: center.clone(),
                count: 1,
                maxEdge: maxEdge
              });
            } else {
              g.centerSum.add(center);
              g.count++;
              // Keep a stable average normal too (helps noisy geometries)
              g.normal.lerp(n, 0.15).normalize();
              g.maxEdge = Math.max(g.maxEdge || 0, maxEdge);
            }
          }

          // We expect 20 groups (faces). If not, we still proceed with what we found.
          // Sort faces in a stable order so images map predictably.
          // (Sort by normal.y then normal.z then normal.x)
          groups.sort((a, b) => {
            if (a.normal.y !== b.normal.y) return b.normal.y - a.normal.y;
            if (a.normal.z !== b.normal.z) return b.normal.z - a.normal.z;
            return b.normal.x - a.normal.x;
          });

          // Create planes
          const size = this.data.size;
          const push = this.data.offset;

          const up = new THREE.Vector3(0, 1, 0);
          const tmpPos = new THREE.Vector3();
          const lookAtTarget = new THREE.Vector3();
          const quat = new THREE.Quaternion();
          const rotEuler = new THREE.Euler();

          groups.slice(0, 20).forEach((g, idx) => {
            const faceCenter = g.centerSum.multiplyScalar(1 / g.count);
            const faceNormal = g.normal.clone();

            // Move plane slightly outward along normal
            tmpPos.copy(faceCenter).add(faceNormal.multiplyScalar(push));

            // Build rotation so plane faces outward along normal.
            // We'll make a quaternion that looks from plane position toward plane position + normal.
            lookAtTarget.copy(tmpPos).add(faceNormal);
            const m = new THREE.Matrix4();
            m.lookAt(tmpPos, lookAtTarget, up); // creates a camera-like matrix
            quat.setFromRotationMatrix(m);
            // This lookAt makes -Z forward; A-Frame plane faces +Z by default.
            // Flip 180° around Y to correct:
            const flip = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
            quat.multiply(flip);

            rotEuler.setFromQuaternion(quat, "YXZ");

            const plane = document.createElement("a-plane");
            const faceSize = Math.min(size, (g.maxEdge || size) * 0.58);
            plane.setAttribute("width", faceSize);
            plane.setAttribute("height", faceSize);
            plane.setAttribute("position", `${tmpPos.x} ${tmpPos.y} ${tmpPos.z}`);
            plane.setAttribute(
              "rotation",
              `${THREE.MathUtils.radToDeg(rotEuler.x)} ${THREE.MathUtils.radToDeg(rotEuler.y)} ${THREE.MathUtils.radToDeg(rotEuler.z)}`
            );

            // Image source (loops if fewer than 12 provided)
            plane.setAttribute("material", {src: srcList[idx % srcList.length], transparent: true, alphaTest: 0.4});

// Optional: slightly rounded corners feel via opacity + scale (keep simple)
            plane.setAttribute("class", "d20-face");
            this.el.appendChild(plane);

            // Sharper at angles: maximize texture anisotropy when the texture is ready
            plane.addEventListener("materialtextureloaded", () => {
              const mesh = plane.getObject3D("mesh");
              const tex = mesh && mesh.material && mesh.material.map;
              const renderer = this.el.sceneEl && this.el.sceneEl.renderer;
              if (tex && renderer) {
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                tex.needsUpdate = true;
              }
            });
});
        }
      });

      // --------- Component: animated rolling d12 ----------
      AFRAME.registerComponent("d20-roll", {
        schema: {
          duration: { type: "int", default: 900 },
          spins: { type: "int", default: 3 }, // extra full spins per roll
          easing: { type: "string", default: "easeOutCubic" }
        },

        init() {
          this.rolling = false;

          // Click to roll by default
          this.el.addEventListener("click", () => this.roll());

          // Nice cursor feedback if you add cursor/raycaster
          this.el.classList.add("clickable");
        },

        roll() {
          if (this.rolling) return;
          this.rolling = true;

          // Start from current rotation
          const r = this.el.getAttribute("rotation") || { x: 0, y: 0, z: 0 };

          // Random target rotation plus some extra spins
          const spins = this.data.spins * 360;
          const target = {
            x: (Math.random() * 360) + spins,
            y: (Math.random() * 360) + spins,
            z: (Math.random() * 360) + spins
          };

          // Use a unique animation name so repeated rolls replace previous cleanly
          this.el.setAttribute("animation__roll", {
            property: "rotation",
            dur: this.data.duration,
            easing: this.data.easing,
            from: `${r.x} ${r.y} ${r.z}`,
            to: `${target.x} ${target.y} ${target.z}`
          });

          // Reset rolling flag after animation
          setTimeout(() => (this.rolling = false), this.data.duration + 50);
        }
      });

          float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * 0.25 * 0.03125, 0.0078125);
          float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
          dir = clamp(dir * rcpDirMin, vec2(-8.0), vec2(8.0)) * resolution;

          vec3 rgbA = 0.5 * (
            texture2D(tDiffuse, vUv + dir * (1.0/3.0 - 0.5)).xyz +

    this.fxaaMat = fxaaMaterial;

    const quad = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),

    this.postScene.add(quad);

    const originalRender = sceneEl.render.bind(sceneEl);
    this._originalRender = originalRender;

    sceneEl.render = (time, dt) => {

AFRAME.registerComponent("tex-aniso", {
  init() {
    this.el.addEventListener("object3dset", (e) => {
      if (e.detail.type !== "mesh") return;
      const mesh = this.el.getObject3D("mesh");
      const target = (function find(o){ if(!o) return null; if (o.isMesh) return o; let m=null; o.traverse(x=>{ if(!m && x.isMesh) m=x;}); return m;})(mesh);
      const mat = target && target.material;
      const tex = mat && mat.map;
      const renderer = this.el.sceneEl && this.el.sceneEl.renderer;
      if (tex && renderer) {
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.needsUpdate = true;
      }
    });
  }
});

<script>
(function () {
  const ua = navigator.userAgent || "";
  const isSafari = /Safari/i.test(ua) && !/Chrome|Chromium|Edg|OPR|Android/i.test(ua);
  if (!isSafari) return;

  // Safari can show 1px edge artifacts with transparent canvases + FXAA post-pass.
  // Disable the FXAA component only on Safari, keeping everything else identical.
  (function disableFXAA() {
    const sc = document.querySelector("a-scene");
    if (sc) {
      sc.setAttribute("fxaa", "enabled:false");
      return;
    }
    requestAnimationFrame(disableFXAA);
  })();
})();
</script>

function showSecretButton(rolled) {
  var btn = document.getElementById("secretBtn");
  var box = document.getElementById("secretText");
  if (!btn || !box) return;

  btn.style.display = "block";
  box.style.display = "none";
  box.textContent = "";

  btn.onclick = function () {
    box.innerHTML = SECRETS[(rolled - 1) % 20] || ("<p>Secret for " + rolled + "</p>");
    box.style.display = "block";
    // optional: hide button once revealed
    btn.style.display = "none";
  };
}

function hideSecretUI() {
  var btn = document.getElementById("secretBtn");
  var box = document.getElementById("secretText");
  if (btn) { btn.style.display = "none"; btn.onclick = null; }
  if (box) { box.style.display = "none"; box.textContent = ""; }
}


    function topFaceIndexByNormal(dieEl) {
      var planes = dieEl.querySelectorAll(".d20-face");
      if (!planes || !planes.length) return -1;

      dieEl.sceneEl.object3D.updateMatrixWorld(true);

      var up = new THREE.Vector3(0, 1, 0);
      var bestDot = -Infinity;
      var bestIdx = 0;

      var q = new THREE.Quaternion();
      var localNormal = new THREE.Vector3(0, 0, 1);

      planes.forEach(function (plane, idx) {
        plane.object3D.getWorldQuaternion(q);
        var n = localNormal.clone().applyQuaternion(q).normalize();
        var dot = n.dot(up);
        if (dot > bestDot) { bestDot = dot; bestIdx = idx; }
      });

      return bestIdx;
    }

    function rolledNumber(dieEl) {
      var idx = topFaceIndexByNormal(dieEl);
      return idx >= 0 ? String(idx + 1) : "?";
    }

    function snapDieToTopFace(dieEl) {
      var planes = dieEl.querySelectorAll(".d20-face");
      if (!planes || !planes.length) return;

      dieEl.sceneEl.object3D.updateMatrixWorld(true);

      var idx = topFaceIndexByNormal(dieEl);
      if (idx < 0) return;

      var up = new THREE.Vector3(0, 1, 0);
      var localNormal = new THREE.Vector3(0, 0, 1);

      // Face world normal
      var qFace = new THREE.Quaternion();
      planes[idx].object3D.getWorldQuaternion(qFace);
      var nWorld = localNormal.clone().applyQuaternion(qFace).normalize();

      // Delta to align face normal to up
      var qDelta = new THREE.Quaternion().setFromUnitVectors(nWorld, up);

      // Die world quaternion
      var qDieWorld = new THREE.Quaternion();
      dieEl.object3D.getWorldQuaternion(qDieWorld);

      // Snapped world quaternion
      var qSnappedWorld = qDelta.multiply(qDieWorld);

      // Convert world->local via parent
      var qParentWorld = new THREE.Quaternion();
      if (dieEl.object3D.parent) dieEl.object3D.parent.getWorldQuaternion(qParentWorld);
      qParentWorld.invert();
      var qSnappedLocal = qParentWorld.multiply(qSnappedWorld);

      dieEl.object3D.quaternion.copy(qSnappedLocal);
      dieEl.sceneEl.object3D.updateMatrixWorld(true);
    }

  try {
    if (die.components && die.components["d20-roll"] && typeof die.components["d20-roll"].roll === "function") {

}

function bindCanvasListeners() {
  if (!die.sceneEl || !die.sceneEl.canvas) return false;

  return true;
}

if (die.sceneEl) {
  die.sceneEl.addEventListener("render-target-loaded", function () {
    bindCanvasListeners();
  });
  bindCanvasListeners();
}

die.addEventListener("click", function () {
        setHud("Rolling…");
          hideSecretUI();
        var dur = (die.components["d20-roll"] && die.components["d20-roll"].data && die.components["d20-roll"].data.duration) || 1000;

        // Fallback update even if events don't fire
        setTimeout(function () {
          snapDieToTopFace(die);
          var n = parseInt(rolledNumber(die), 10);
          setHud("You rolled: " + n);
          if (n) showSecretButton(n);
        }, dur + 80);
      });

      die.addEventListener("animationcomplete__roll", function () {
        snapDieToTopFace(die);
        var n = parseInt(rolledNumber(die), 10);
          setHud("You rolled: " + n);
          if (n) showSecretButton(n);
      });

      return true;
    }

    window.addEventListener("load", function () {
      var tries = 0;
      var t = setInterval(function () {
        tries++;
        if (wire()) { clearInterval(t); }
        if (tries > 200) { clearInterval(t); }
      }, 50);
    });
  })();

AFRAME.registerComponent("fxaa", {
  schema: {
    enabled: { type: "boolean", default: true }
  },

  init() {
    this._setup = this._setup.bind(this);
    this._resize = this._resize.bind(this);

    this.el.addEventListener("loaded", this._setup);
    window.addEventListener("resize", this._resize);
  },

  remove() {
    window.removeEventListener("resize", this._resize);
  },

  _setup() {
    if (!this.data.enabled) return;
    const sceneEl = this.el;
    const renderer = sceneEl.renderer;
    if (!renderer) return;

    // Create render target at current size
    this._createTargets();
