e","html":"<p>Comment Lie. Quote Lie. Like, but make it epistemology. \ud83d\ude02</p>","up":5,"down":0,"targetUp":889,"targetDown":63,"reactions":{"\u2764\ufe0f":3}}],"group":"","parent":"Dark"},{"id":805,"title":"Mimicry","description":"<p><b>Mimicry</b><br>Simulation. Mimicry is play through role, mask, imitation and make-believe: the player temporarily accepts another identity, appearance or world.</p>","collapsed":false,"replies":[{"id":80051,"user":"Roger Caillois","html":"<p>Mimicry begins when the player accepts an illusion, a role, a mask or another world and behaves accordingly.</p>","up":8,"down":0,"targetUp":592,"targetDown":26,"reactions":{"\ud83c\udfad":5}},{"id":80052,"user":"Pierre Klossowski","html":"<p>The interesting question is always whether the mask remains a mask. \ud83c\udf00</p>","up":9,"down":0,"targetUp":609,"targetDown":27,"reactions":{"\ud83c\udf00":6}}],"parent":"Mimicry","group":"","isParent":true},{"id":38,"title":"Toy Tonic","description":"<p><b>TikTok reimagined through Michel Leiris\u2019s \u201cThe Sacred in Everyday Life.\u201d</b><br>\nCompulsive ritual repetition, algorithmic fascination, ecstatic banality, micro-possession and sacred triviality become short-form reels.</p>","collapsed":false,"replies":[{"id":38001,"user":"Michel Leiris","html":"<p>The point is to find ruptures and sacred residues inside ordinary life. Reels become tiny eruptions of fascination. \ud83d\udc41\ufe0f</p>","up":6,"down":1,"targetUp":705,"targetDown":21,"reactions":{"\ud83d\udc41\ufe0f":7}},{"id":38002,"user":"Roger Caillois","html":"<p>Mimicry makes the ordinary fragment perform another status: not merely content, but a staged micro-ritual.</p>","up":8,"down":0,"targetUp":806,"targetDown":38,"reactions":{"\ud83e\udde0":8}},{"id":38003,"user":"Pierre Klossowski","html":"<p>The feed is a theatre where the self repeatedly becomes its own imitation. \ud83c\udfad</p>","up":10,"down":1,"targetUp":907,"targetDown":55,"reactions":{"\ud83c\udf00":9}},{"id":38004,"user":"Georges Bataille","html":"<p>Not content. Modern fragments of the sacred. \ud83d\udd25</p>","up":5,"down":0,"targetUp":308,"targetDown":72,"reactions":{"\ud83d\udd25":3}}],"group":"","parent":"Mimicry"},{"id":806,"title":"Ilinx","description":"<p><b>Ilinx</b><br>Vertigo. Ilinx seeks destabilization \u2014 dizziness, disorientation, altered perception, ecstasy or a temporary loss of ordinary control.</p>","collapsed":false,"replies":[{"id":80061,"user":"Roger Caillois","html":"<p>Ilinx seeks the temporary destruction of stable perception: dizziness, speed, panic, ecstasy, disorientation.</p>","up":8,"down":0,"targetUp":623,"targetDown":27,"reactions":{"\ud83c\udf00":5}},{"id":80062,"user":"Michel Leiris","html":"<p>The body understands this category before theory does.</p>","up":9,"down":0,"targetUp":640,"targetDown":28,"reactions":{"\ud83d\udc41\ufe0f":6}},{"id":95520,"user":"Andr\u00e9 Masson","html":"<p>Vertigo is visual too. Remove the head, displace the organs into symbols, let the body become a diagram that refuses stable orientation. \u270d\ufe0f</p>","up":9,"down":0,"targetUp":730,"targetDown":20,"reactions":{"\ud83c\udf00":6}}],"parent":"Ilinx","group":"","isParent":true},{"id":39,"title":"OnlyFanatics","description":"<p><b>Ecstatic devotion / vortex.</b><br>\nInspired by Denis de Rougemont. Multimedia fandom combines with <b>Only Fragments for Your Fans</b>, where Ac\u00e9phale journals and Teutonic texts become interactive flipbooks.</p>","collapsed":false,"replies":[{"id":39001,"user":"Denis de Rougemont","html":"<p>Passion, discipline, eros, ritualized sublimation and martial aesthetics become a subscription architecture of devotion.</p>","up":6,"down":1,"targetUp":788,"targetDown":34,"reactions":{"\u2764\ufe0f":8}},{"id":39002,"user":"Roger Caillois","html":"<p>Ilinx here is ecstatic immersion: fascination dissolves the distance between reader, viewer and initiate. \ud83c\udf00</p>","up":8,"down":0,"targetUp":889,"targetDown":51,"reactions":{"\ud83c\udf00":9}},{"id":39003,"user":"Pierre Klossowski","html":"<p>Spectatorship becomes performative commitment. The observer is gradually implicated in the spectacle.</p>","up":10,"down":1,"targetUp":290,"targetDown":68,"reactions":{"\ud83d\udc41\ufe0f":3}},{"id":39004,"user":"Georges Bataille","html":"<p>Only Fragments. Completion permanently one scroll away. \ud83d\ude02</p>","up":5,"down":0,"targetUp":391,"targetDown":85,"reactions":{"\ud83d\udd25":4}}],"group":"","parent":"Ilinx"},{"id":955,"title":"OnlyFragments \u2014 Secrets, Desire & Unlocking","description":"<p><b>OnlyFragments is the content engine inside the Ilinx world of OnlyFanatics.</b><br>It never gives the whole thing: a photograph, letter, flip-book, video, hidden page, body, theory, archive or secret appears only as a <b>fragment</b>. That incompleteness produces the next desire: <i>fragment \u2192 desire \u2192 unlock \u2192 fragment \u2192 desire \u2192 unlock</i>. The paywall becomes a threshold, unlocking becomes a tiny initiation, and the archive is consumed page by page like a ritual.</p>","collapsed":false,"replies":[{"id":95501,"user":"Denis de Rougemont","html":"<p>The fan does not begin as a fanatic. The mechanism intensifies devotion by promising that there is always <i>more</i>: another secret, another fragment, another threshold.</p>","up":9,"down":0,"targetUp":720,"targetDown":19,"reactions":{"\u2764\ufe0f":6}},{"id":95502,"user":"Pierre Klossowski","html":"<p>A fragment is powerful because it withholds completion. Desire survives precisely because the whole object never arrives. \ud83c\udfad</p>","up":8,"down":0,"targetUp":670,"targetDown":17,"reactions":{"\ud83c\udf00":6}},{"id":95503,"user":"Andr\u00e9 Masson","html":"<p>And the Ac\u00e9phale body is already the perfect fragment: naked, tattooed, headless, overloaded with signs. The missing head does not reduce the image \u2014 it makes the image impossible to finish. \u270d\ufe0f</p>","up":10,"down":0,"targetUp":820,"targetDown":21,"reactions":{"\ud83d\udd25":7}},{"id":95504,"user":"Georges Bataille","html":"<p>The secret acquires force because it is separated from ordinary circulation. The absurdity is beautiful: sacred distance becomes an unlock button. \ud83d\udd25</p>","up":10,"down":0,"targetUp":800,"targetDown":22,"reactions":{"\ud83d\udc80":6}},{"id":95505,"user":"Roger Caillois","html":"<p>Do not confuse Ilinx with Alea here. Alea governs which fragment appears next; Ilinx begins when the sequence destabilizes the spectator\u2019s relation to reality and control.</p>","up":9,"down":0,"targetUp":760,"targetDown":20,"reactions":{"\ud83e\udde0":7}},{"id":95506,"user":"Michel Leiris","html":"<p>The flip-book matters because the archive is no longer simply looked at. You advance through it, page by page, fragment by fragment. Reading itself becomes an action.</p>","up":8,"down":0,"targetUp":650,"targetDown":18,"reactions":{"\ud83d\udc41\ufe0f":6}}],"parent":"Ilinx","group":"","isParent":false},{"id":807,"title":"Paidia","description":"<p><b>Paidia</b><br>Improvisatory play. Paidia is spontaneous, turbulent, exploratory play before or beyond strict formalization \u2014 the freer pole opposed to Ludus.</p>","collapsed":false,"replies":[{"id":80071,"user":"Roger Caillois","html":"<p>Paidia is the exuberant, improvisatory impulse of play before rules harden it into a formal challenge.</p>","up":8,"down":0,"targetUp":654,"targetDown":28,"reactions":{"\ud83e\udde0":5}},{"id":80072,"user":"Georges Bataille","html":"<p>The game before it learns to behave. \ud83d\udd25</p>","up":9,"down":0,"targetUp":671,"targetDown":29,"reactions":{"\ud83d\udd25":6}}],"parent":"Paidia","group":"","isParent":true},{"id":30,"title":"Holygram","description":"<p><b>Ac\u00e9phale Telegram Channel \u2014 Sacred Ritual of the Hypertelia Cult.</b><br>\nHolygram turns the ordinary \u201cReport User / Report Abuse\u201d gesture into <b>Mark for Sacrifice</b>. You flag bubbles according to attraction, repulsion, fascination, hostility, authorship, excess or pure intuition.</p>","collapsed":false,"replies":[{"id":30001,"user":"Roger Caillois","html":"<p>The computational procedure is fixed, but the meaning of your choice is deliberately undetermined. That is why it operates at the Paidia pole.</p>","up":6,"down":1,"targetUp":741,"targetDown":17,"reactions":{"\ud83e\udde0":6}},{"id":30002,"user":"Georges Bataille","html":"<p>BUBBLE \u2192 FLAG \u2192 SACRIFICIAL CHARGE \u2192 VICTIM. \ud83d\udc80</p>","up":8,"down":0,"targetUp":842,"targetDown":34,"reactions":{"\ud83d\udc80":7}},{"id":30003,"user":"Michel Leiris","html":"<p>Totals remain hidden so the ritual does not collapse into an Agon-style popularity contest.</p>","up":10,"down":1,"targetUp":943,"targetDown":51,"reactions":{"\ud83d\udc41\ufe0f":8}},{"id":30004,"user":"Laure","html":"<p>At the end: <b>YOUR VICTIM vs COLLECTIVE VICTIM</b>. ShutApp produces knowledge; Holygram produces complicity. \ud83d\ude08</p>","up":5,"down":0,"targetUp":344,"targetDown":68,"reactions":{"\ud83d\udd25":9}}],"group":"","parent":"Paidia"}];

const USERS=["Georges Bataille","Roger Caillois","Michel Leiris","Laure","Jean Paulhan","Jules Monnerot","Pierre Klossowski","Denis de Rougemont","Alexandre Koj\u00e8ve","Georges Duthuit","Hans Mayer","Anatole Lewitzky","Andr\u00e9 Masson","Georges Ambrosino","Jean Wahl","Patrick Waldberg","Walter Benjamin","Jacques Chavy","Henri Dubief","Michel Koch","Isabelle Waldberg","Ren\u00e9 M. Guastalla","Marcel Mauss","Pierre Mabille","Taro Okamoto","Imre Kelemen","Henri Dussat","Pierre Dugan (Pierre Pascal)","Jean Rollin","Andr\u00e9 Breton","Robert Lebel"];
const EMOJIS=["🔥","🧠","🌀","👁️","⚡","❤️","🤔","💀","👎"];

function save(){localStorage.setItem(STORAGE,JSON.stringify(THREADS));}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}


let starterIndexOpen=false;
let disorderSearchQuery="";

function renderStarterQuestions(){
  questions.classList.toggle("index-open",starterIndexOpen);

  let lastParent="";
  const links=QUESTIONS.map((q,i)=>{
    const t=THREADS.find(x=>x.title===q) || THREADS[i];
    const id=t ? t.id : "";
    const parent=t ? (t.parent||"") : "";
    const isParent=!!(t && t.isParent);

    if(isParent){
      lastParent=parent;
      return `<li class="board-parent-label"><a href="#thread-${id}" onclick="event.preventDefault();scrollToThread(${id})">${q}</a></li>`;
    }

    let cls="";
    if(parent==="Disorder") cls="board-child";
    else if(parent){
      cls="board-child";
      if(parent==="Ludus" && q!=="ShutApp") cls="board-grandchild";
      if(parent==="Agon" && q!=="FortKnight") cls="board-grandchild";
      if(parent==="Alea" && q!=="Acéphale Slot Machine") cls="board-grandchild";
      if(parent==="Dark" && q!=="4chains") cls="board-grandchild";
    }

    return `<li class="${cls}"><a href="#thread-${id}" onclick="event.preventDefault();scrollToThread(${id})">${q}</a></li>`;
  }).join("");

  questions.innerHTML=`
    <div class="starter-head" onclick="toggleStarterIndex()">
      <h2>Starter Questions</h2>
      <span class="starter-chevron">${starterIndexOpen?'▼':'▶'}</span>
    </div>
    <div class="starter-search-wrap">
      <input id="compendiumSearch" class="starter-search" type="search"
             placeholder="Search compendium..."
             value="${disorderSearchQuery.replace(/"/g,'&quot;')}"
             oninput="searchCompendium(this.value)">
      <div id="searchCount" class="search-count"></div>
    </div>
    <ol class="starter-index">${links}</ol>
  `;
  updateSearchCount();
}

function toggleStarterIndex(){
  starterIndexOpen=!starterIndexOpen;
  renderStarterQuestions();
}

function scrollToThread(id){
  const el=document.getElementById(`thread-${id}`);
  if(!el) return;
  el.scrollIntoView({behavior:"smooth",block:"start"});
}

function searchCompendium(value){
  disorderSearchQuery=value||"";
  applyCompendiumSearch();
}

function applyCompendiumSearch(){
  const q=disorderSearchQuery.trim().toLowerCase();
  let visible=0;

  document.querySelectorAll("#feed .thread").forEach(el=>{
    const hit=!q || el.textContent.toLowerCase().includes(q);
    el.classList.toggle("search-hidden",!hit);
    if(hit) visible++;
  });

  updateSearchCount(visible);
}

function updateSearchCount(visible){
  const el=document.getElementById("searchCount");
  if(!el) return;
  const q=disorderSearchQuery.trim();
  if(!q){ el.textContent=""; return; }
  if(typeof visible!=="number"){
    visible=document.querySelectorAll("#feed .thread:not(.search-hidden)").length;
  }
  el.textContent=`${visible} matching thread${visible===1?"":"s"}`;
}

renderStarterQuestions();


function createThread(){
 const title=threadTitle.value.trim();
 const description=threadDescription.value.trim();
 if(!title || !description) return;

 THREADS.unshift({
  id:Date.now(),
  title,
  description:`<p>${description}</p>`,
  collapsed:false,
  replies:[]
 });

 threadTitle.value="";
 threadDescription.value="";

 const newThread = THREADS[0];

 const amount = r(3,6);

 for(let i=0;i<amount;i++){

   setTimeout(()=>{

     newThread.replies.push(
       makeReply(
         rand(USERS),
         rand([
            "<p>Start with the four forces: Agon, Alea, Mimicry and Ilinx. Which one dominates here?</p>",
            "<p>Before classifying it, check whether you are talking about a <b>Regime</b> or an <b>Atmosphere</b>.</p>",
            "<p>Paidia/Ludus = regime. Light/Dark = atmosphere. Different axes. 📌</p>",
            "<p>What changes from Bubble A to Bubble B? The game is in the passage, not in either label alone.</p>",
            "<p>Direction matters: reverse the arrow and you describe another process.</p>",
            "<p>Is the passage horizontal, vertical or diagonal — Tension, Transformation or Contamination?</p>",
            "<p>Do not guess the hidden percentages. Use the visible Five Registers, Regime and Atmosphere as reading instruments.</p>",
            "<p>The Five Registers are Emo / Common / Hot / ’30 / Cyber. Five perspectives, one semantic nucleus.</p>",
            "<p>The ? is the fandom space: the people around the game arguing about what all this means. 😂</p>",
            "<p>Remember: the hidden Agon/Alea/Mimicry/Ilinx profile is revealed only after the choice.</p>",
            "<p>👁️ Read the relation before you read the score.</p>",
            "<p>🔥 If a form is becoming something else, follow the arrow.</p>",
            "<p>🎲 Alea suspends mastery.</p>",
            "<p>🎭 Mimicry organizes simulation and performed identity.</p>",
            "<p>🌀 Ilinx destabilizes perception or control.</p>",
            "<p>♟️ Agon organizes regulated rivalry.</p>"
          ])
       )
     );

     save();
     render();

   }, ((i+1)*5000) + Math.floor(Math.random()*3000));

 }
}

function makeReply(user,html){
 return {
  id:Date.now()+Math.random(),
  user,html,
  up:r(0,10),
  down:r(0,3),
  targetUp:r(150,1000),
  targetDown:r(10,250),
  reactions:{[rand(EMOJIS)]:r(1,10)}
 };
}

function render(){

feed.innerHTML="";

THREADS.forEach(thread=>{

 let replies="";

 if(!thread.collapsed){

  thread.replies.forEach(rep=>{

   let reacts="";

   Object.entries(rep.reactions).forEach(([k,v])=>{
      reacts+=`<span class="reaction">${k} ${v}</span>`;
   });

   replies+=`
   <div class="reply">
   <b>${rep.user}</b>
   ${rep.up>=100?'<span class="badge">🔥 Trending</span>':''}
   <div>${rep.html}</div>

   <div class="actions">
   <button class="btn" onclick="vote(${thread.id},${rep.id},1)">⬆ ${rep.up}</button>
   <button class="btn" onclick="vote(${thread.id},${rep.id},-1)">⬇ ${rep.down}</button>
   </div>

   <div>${reacts}</div>
   </div>`;

  });

 }

 feed.innerHTML+=`
 <div class="thread" id="thread-${thread.id}" data-parent="${thread.parent||''}" data-title="${thread.title}">

 <div class="thread-header"
      onclick="toggleThread(${thread.id})">

 <div><h3>${thread.title}</h3><div style="opacity:.85;margin-top:8px">${thread.description||"<p>No description.</p>"}</div></div>

 <span>${thread.collapsed?'▶':'▼'}</span>

 </div>

 ${!thread.collapsed?`
 <div class="actions">
 <button class="btn primary"
         onclick="event.stopPropagation();openModal(${thread.id})">
 Reply
 </button>
 </div>

 ${replies}
 `:''}

 </div>`;

});

 applyCompendiumSearch();
}

function toggleThread(id){
 const t=THREADS.find(x=>x.id===id);
 t.collapsed=!t.collapsed;
 save();
 render();
}

function vote(tid,rid,val){
 const rep=THREADS.find(t=>t.id===tid).replies.find(r=>r.id===rid);
 if(val>0) rep.up++;
 else rep.down++;
 save();
 render();
}

function openModal(id){
  currentThreadId = id;

  modal.style.display = "flex";

  editor.innerHTML = "<p></p>";

  updatePreview();

  editor.focus();

  const range = document.createRange();
  const sel = window.getSelection();

  range.selectNodeContents(editor);
  range.collapse(true);

  sel.removeAllRanges();
  sel.addRange(range);
}

function closeModal(){modal.style.display="none";}

function quote(){
 document.execCommand("formatBlock",false,"blockquote");
 updatePreview();
}

function emoji(e){
 document.execCommand("insertText",false,e);
 updatePreview();
}

function updatePreview(){
 preview.innerHTML=editor.innerHTML;
}

editor.addEventListener("input",updatePreview);

function submitReply(){

 const t=THREADS.find(x=>x.id===currentThreadId);

 t.replies.push(
   makeReply("You",editor.innerHTML)
 );

 save();
 render();
 closeModal();

 for(let i=0;i<r(2,5);i++){

  setTimeout(()=>{

   t.replies.push(
     makeReply(
      rand(USERS),
      rand([
       "<p>Which node dominates A, and which dominates B?</p>",
       "<p>I would check the direction before naming the relation.</p>",
       "<p>That sounds like a Tension rather than a Transformation.</p>",
       "<p>Or a diagonal Contamination — two distant forces are becoming simultaneously operative.</p>",
       "<p>Remember that A → B → A is already a history.</p>",
       "<p>Do not collapse Five Registers, twelve transitions and four social-heat qualities into one layer.</p>",
       "<p>Regime ≠ atmosphere. 😑</p>",
       "<p>The visible caption helps you read; the hidden percentages explain the system’s analysis afterward.</p>",
       "<p>😂 The question mark is the fandom space — welcome to the people arguing around the game.</p>",
       "<p>Try reading it once in Common and once in Hot. Same nucleus, different epistemological angle.</p>",
       "<p>After choosing, compare your reading with the revealed dominant nodes.</p>",
       "<p>👁️ The goal is interpretation, not memorizing a lookup table.</p>",
       "<p>🔥 The circuit is reversible, not symmetrical.</p>",
       "<p>🌀 A rare unstable contamination may carry more transformative power than a stable pure node.</p>"
     ])
     )
   );

   save();
   render();

  },r(2000,12000));

 }

}

setInterval(()=>{

 THREADS.forEach(t=>{

  t.replies.forEach(rep=>{

   if(rep.up<rep.targetUp) rep.up+=r(0,8);

   if(rep.down<rep.targetDown && Math.random()<0.4)
      rep.down+=r(0,3);

   if(Math.random()<0.5){

    const e=rand(EMOJIS);

    rep.reactions[e]=
      (rep.reactions[e]||0)+r(1,4);

   }

  });

 });

 save();
 render();

},4000);


function clearAll(){
  document.getElementById("clearModal").style.display="flex";
}

function closeClearModal(){
  document.getElementById("clearModal").style.display="none";
}

function confirmClearAll(){
  localStorage.removeItem(STORAGE);
  location.reload();
}

render();


document.addEventListener("keydown",(e)=>{
  const isMac = navigator.platform.toUpperCase().includes("MAC");
  const combo = isMac ? e.metaKey : e.ctrlKey;

  if(combo && e.key.toLowerCase()==="e"){
    e.preventDefault();
    confirmClearAll();
  }
});

function insertThreadEmoji(e){
  const box=document.getElementById("threadDescription");
  box.value += " " + e;
  box.focus();
}

function insertThreadEmoji(e){

  const box = document.getElementById("threadDescription");

  box.value += e + " ";

  box.focus();

}
</script>

  <div class="modal-content"

    <div class="modal-header">
      ⚠️ Warning
    </div>

    <div style="padding:24px">

      <p>
        Delete all threads, replies, votes and reactions?
      </p>

      <p style="opacity:.7;font-size:14px">
        This action cannot be undone.
      </p>

    </div>

    <div class="modal-actions">

      <button class="btn"
              onclick="closeClearModal()">
        Cancel
      </button>

      <button class="btn primary"

        Delete Everything
      </button>

    </div>

  </div>

</div>

<button id="scrollTopBtn" type="button" aria-label="Scroll to top" title="Scroll to top">↑</button>
<script>
(() => {
  const b=document.getElementById("scrollTopBtn");
  if(!b) return;
  const sync=()=>b.classList.toggle("show",window.scrollY>320);
  window.addEventListener("scroll",sync,{passive:true});
  b.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
  sync();
})();
</script>
