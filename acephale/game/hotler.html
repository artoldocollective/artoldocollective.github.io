recipient:"Georges Bataille",
date:"July 1939 onward",
subject:"Caillois’s 'Examination of Conscience'",
body:"Caillois’s missing text or 'message' appears already to reorganize the entire enterprise under the appearance of moderation.\n\nThe text advocates:\n\n- reserve;\n- discipline;\n- methodological caution;\n- occultation;\n- delayed manifestation;\n- restricted organization.\n\nBut beneath these precautions there already appears the architecture of a spiritual authority.\n\nOne does not speak of:\n\n- doctrine;\n- councils;\n- orthodoxy;\n- spiritual power,\n\nwithout already entering the terrain of sacred organization.\n\nCaillois accuses apocalypse while secretly preparing hierarchy.\n\nAt least I openly admit my attraction toward:\n\n- expenditure;\n- rupture;\n- sacred loss;\n- ecstatic participation;\n- festival;\n- death.\n\nHe wishes to preserve the sacred while sterilizing its combustion.\n\nBut a sacred principle deprived of danger becomes administration.\n\nAnd administration is precisely what we began by fighting."
},

{
id:141,
sender:"Zeitgeist RSS Feed",
recipient:"Georges Bataille",
date:"July 1939 onward",
subject:"Nietzsche, Kojève, and the 'geistige Tierreich'",
body:"The internal crisis of the Collège increasingly revolves around Nietzsche and the meaning of intellectual existence itself.\n\nNietzsche matters because he demands consequences.\n\nNot ideas.\n\nConsequences.\n\nThe problem is not domination over an external monstrosity, but domination over what is recognized as oneself and collectively released in festival.\n\nKojève’s seminars continue haunting me:\n\ndas geistige Tierreich.\n\nThe spiritual animal kingdom.\n\nIntellectual life increasingly resembles:\n\n- reciprocal fraud;\n- ceremonial seriousness;\n- theatrical knowledge;\n- simulated totality.\n\nEveryone speaks in the name of completion while preserving mutilation.\n\nThis is why almost no trace of Nietzsche survives in minds despite everyone citing him.\n\nModern intellectual culture absorbs revelations without transformation.\n\nHence the necessity:\n\nnot of another review,\nbut of nuclei.\n\nGroups tied not by agreement,\nbut by dangerous recognitions.\n\nThe Collège cannot remain merely interpretive.\n\nIt must become either:\n\n- a concentration of lived sacred experience;\n- or merely another literary institution."
},

{
id:152,
sender:"Zeitgeist RSS Feed",
recipient:"Georges Bataille",
date:"13 November 1939",
subject:"Letter to Roger Caillois on sociology, spiritual power, and the paralysis of the Collège",
body:"Saint-Germain-en-Laye, 59 bis rue de Mareil.\n\nMy dear Caillois,\n\nYour text astonished me. I scarcely see what it is connected to. Do you realize how far we still are — even if we grant the greatest possible share to optimism — from being able to speak of a pathology of societies?\n\nFor me, that is inconceivable.\n\nAt the very least it would be necessary to put forward some positive principle — a will, an attraction.\n\nOtherwise everything becomes terribly heavy.\n\nYou can, or will be able to, read in the N.R.F. of 1 November a text by Drieu.\n\nYou know that I have no particular predisposition in favor of Drieu.\n\nBut, however reluctantly I admit it, this text is much more serious than yours.\n\nIf the Collège de Sociologie had something to say at this moment, it ought to begin from the same consideration as Drieu:\n\nthings are inextricable.\n\nUnder such conditions, it is better to say nothing.\n\nWhy moreover attach the only positive principle we are able to introduce — the necessity of a spiritual power — to analyses of developments that are not yet completed?\n\nBy definition, such analyses will necessarily be poorly made.\n\nDrieu’s own analysis, for the moment, possesses only a coarse solidity.\n\nYou reproached me for attaching importance to current events.\n\nYet I have never attached myself to them except from afar.\n\nWith regard to events, whatever they may be, I see in principle only two kinds of considerations to make:\n\nfirst, they must be used to demonstrate to what extent the absence of a spiritual power renders the position of man miserable;\n\nsecond, one must try to determine whether a given eventuality is favorable or unfavorable to the birth and development of this spiritual power, because there may be an interest in taking sides — as discreetly as possible.\n\nPaulhan’s reaction to this text is no more favorable than mine.\n\nWe agree concerning the position you take.\n\nWe agree concerning hatred of Hitlerism.\n\nBut we also agree in admitting that you are not especially suited to a task which demands — which requires — more suppleness than rigor.\n\nI am sending Leiris, now mobilized, a summary and extracts, but it seems obvious to me that he will react no better than Paulhan or myself.\n\nFrom that side, I expect rather a hostile reaction.\n\nHostile toward the text, naturally.\n\nI would very much like you to tell me something more precise concerning the activity of the Collège de Sociologie in Argentina.\n\nHere its activity is null.\n\nI shall mention only the fact that Marcel Moré now gathers at his home, every two weeks, what remains here of:\n\n- the Collège;\n- the Volontés group;\n- and a small group that he had formed with Landsberg and Klossowski inside Esprit.\n\nWahl attends these meetings and Monnerot is expected to come.\n\nThere will probably be a mimeographed bulletin which I shall send to you.\n\nI hope that you will reply as soon as possible and that we shall remain in constant relations.\n\nAffectionately,\n\nGeorges Bataille\n\nSent by air mail.\nUndated.\nPostmark: 13 November 1939.\nAddressed to:\nMonsieur Roger Caillois\nRufino de Elizalde 2847\nBuenos Aires\nArgentine Republic."
},

{
id:153,
sender:"Zeitgeist RSS Feed",
recipient:"Georges Bataille",
date:"October–November 1939",
subject:"Editorial notes on Caillois, Sur, Hitlerism, and the postwar crisis of the Collège",
body:"I am sending the reviews to Paulhan — I did not have them with me when I saw him.\n\nI intend to send you an article for Sur within fifteen days.\n\nI shall send it by air mail as well.\n\nEditorial Notes:\n\nThe article in question is almost certainly the French version of Roger Caillois’s essay 'Naturaleza del hitlerismo' ('Nature of Hitlerism'), published in Spanish in the Buenos Aires review Sur, no. 61, October 1939.\n\nThe issue also included texts by Jean Cazaux and Armand Petitjean.\n\nCaillois introduced the dossier with a text signed only by initials, presenting the article as a contribution intended to represent abroad the point of view developed for nearly three years by Georges Bataille, Michel Leiris, and himself within the Collège de Sociologie.\n\nJean Paulhan had already written to Caillois on 7 October 1939 expressing impatience to read the new declaration of the Collège.\n\nIn the same letter, Paulhan admitted the disturbing proximity between certain theses of the Collège and aspects of Hitlerism itself:\n\nparticularly the idea of granting power to those deemed worthy of it.\n\nHe wondered on what grounds Hitlerism could simultaneously be described as an abscess to be drained.\n\nPaulhan even suggested that Nietzsche himself might have preferred fascism over liberal democracy or communist collectivism.\n\nOn 21 October 1939, Caillois sent Paulhan the article later published in Sur, describing it as effectively the Collège’s declaration on the present war.\n\nHe emphasized that the text deliberately excluded any paroxystic or ecstatic dimension.\n\nOne section of the essay defined Hitlerism as a dangerous pathological form of social structure.\n\nBataille’s response, in the main letter above, directly attacks this formulation.\n\nAt the same time, Caillois also prepared a separate declaration or manifesto distinct from the article itself.\n\nPaulhan ultimately judged the declaration lucid and precise, though Bataille reportedly considered its correctness fundamentally uninteresting.\n\nNo consensus for signing the manifesto was ever reached.\n\nThe debate increasingly centered on the question of spiritual power.\n\nCaillois continued developing the notion in texts such as 'Sociology of the Cleric' and later in the preface to The Communion of the Strong.\n\nBataille, meanwhile, insisted that any true spiritual authority could only emerge through inner rupture, expenditure, sacrifice, incompletion, and discontinuity.\n\nThe divergence between them became irreversible.\n\nBataille’s insistence on discretion also reappears repeatedly during this period.\n\nIn 'The Threat of War' and in his letters to Leiris, he argues that infernal or sacred matters can only be approached indirectly and with reserve.\n\nThe accusation later made by Boris Souvarine that Bataille had somehow drifted toward Hitlerism is contradicted by multiple testimonies from contemporaries including Waldberg, Blanchot, Dubief, Masson, and Pastoureau.\n\nCaillois himself clarified in a letter to Paulhan that his hostility toward Hitlerism derived above all from racism:\n\nHitlerism allowed no freedom of adhesion because belonging depended not on merit or election, but on birth.\n\nThis, he claimed, was equally Bataille’s position and fundamentally compatible with Nietzsche.\n\nMeanwhile, the original Collège in France had effectively ceased activity.\n\nA residual network survived through meetings organized by Marcel Moré every two weeks.\n\nParticipants included remnants of:\n\n- the Collège de Sociologie;\n- the Volontés group;\n- and a smaller circle connected to Esprit through Landsberg and Klossowski.\n\nJean Wahl attended regularly.\n\nMonnerot was expected to participate.\n\nThese meetings later became known as the 'Discussions on War.'\n\nDuring one discussion on 21 November 1939, Bataille argued that the unfinished nature of the world itself implied the necessity of spiritual power.\n\nFor him, political systems seeking total completion or closure necessarily destroyed genuine spiritual life.\n\nThe discussions repeatedly returned to incompletion, sacrifice, inner experience, and the impossibility of reducing existence to political order.\n\nCaillois’s 'Theory of Festival' was later published in Paulhan’s N.R.F. in December 1939 and January 1940.\n\nThe projected review of the Collège, however, never materialized."
},

id:157,
sender:"Zeitgeist RSS Feed",
recipient:"Georges Bataille",
date:"August–September 1945",
subject:"Editorial notes on Caillois’s return from Argentina and the aftermath of the Collège",
body:"On 13 August 1945, shortly after returning from Argentina, Roger Caillois wrote to Jean Paulhan:\n\n'No, I have not yet seen Petitjean, Bataille, or others, and I shall probably refrain from doing so until I become a little more reacclimatized. These six years have changed me greatly.'\n\nIn a postscript he added:\n\n'At the moment I am occupying myself, temporarily, with France Libre.'\n\nThis contextualizes Bataille’s letter of September 1945 and explains both the emotional restraint and the evident desire for reunion.\n\nThe envelope of Bataille’s letter also reveals a small lapse:\n\nwhile trying to reconstruct Caillois’s address, Bataille first wrote 'rue Parme' before correcting it to 'rue de Condé,' an interference likely produced by the memory of rue Parmentier.\n\nCaillois later reflected extensively on this reunion.\n\nIn his interview with Jean-Michel Lapouge, he recalled that upon returning to Paris in 1945 he read Bataille’s The Inner Experience.\n\nThe war, he said, had demonstrated the futility of the original project of the Collège de Sociologie.\n\nThe dark forces the group had dreamed of unleashing had liberated themselves without mediation, and their consequences were not at all what the members of the Collège had expected.\n\nAccording to Caillois, the catastrophe of the war redirected Bataille toward an inner world.\n\nYet despite everything, their friendship remained intact.\n\nCaillois recalled seeing Bataille again soon after his return.\n\nAt that moment Bataille was planning to launch a new review and hoped to associate Caillois with the project.\n\nThe letter of September 1945 therefore marks not only a personal reunion after six years of separation, but also the beginning of a fragile postwar attempt to rethink intellectual community after the collapse of the sacred-political ambitions of the 1930s."
},

{
id:159,
sender:"Zeitgeist RSS Feed",
recipient:"Georges Bataille",
date:"September 1945",
subject:"Notes on Bataille, Caillois, Monnerot, and the immediate postwar context",
body:"This note clarifies the historical context surrounding Bataille’s letter of 24 September 1945.\n\nThe information that Roger Caillois had finally returned to Paris likely came through Jean Paulhan.\n\nAt this time Bataille was already dividing his life between Paris and Vézelay. Beginning in 1943 he lived primarily in Vézelay and would remain there until 1949.\n\nIt was during this Vézelay period that Bataille wrote important works connected to Nietzsche and inner experience, while simultaneously preparing the foundation for the review Critique, launched in 1946.\n\nThe present letter reflects Bataille’s continued attempts to reconstitute intellectual and personal relations shattered by war, exile, and the collapse of the original Collège de Sociologie project.\n\nThe mention of Georges Monnerot is significant.\n\nMonnerot later recalled that he renewed relations with Bataille during the Occupation after having encountered him in the studio of the painter Balthus in January 1944, while German intelligence services were showing an unwanted interest in him.\n\nAccording to Monnerot’s later testimony, he subsequently helped Bataille found the review Critique in 1946.\n\nIndeed, Monnerot became one of the five members of the original editorial committee of Critique.\n\nThe letter therefore belongs to the transitional moment between:\n\n- the dissolution of the prewar sacred-sociological constellation;\n- the traumatic experience of war;\n- and the reconstruction of a new postwar intellectual network around Bataille.\n\nIt also documents the survival of what later editors would describe as an 'intact friendship' between Bataille and Caillois despite the theoretical and political fractures of 1939."
},

{
id:160,
sender:"Georges Bataille",
recipient:"Roger Caillois",
date:"1 October 1945",
subject:"On ceremonial literature, war, sovereignty, and the unfinished problems of the Collège",
body:"I am struck by what you told me — and wrote to me — concerning ceremonial literature, just as I am struck by your article on war; the two themes touch one another.\n\nUnfortunately I was only able to read your text quickly, in the métro, in the waiting room of a doctor.\n\nI agree, needless to say, with the thesis itself, but if things are truly as you describe them, then this should entail consequences — theoretical and practical — far beyond simple assent or observation.\n\nIf you fail to perceive the economic character of these phenomena, it is because you reduce economy to production, as nearly all modern science does.\n\nIf acquired or liberated energy must necessarily be expended, then the same structure appears in festival, in primitive warfare, and in modern warfare, though with one decisive variation: war itself has become economic.\n\nYou did not, I think, sufficiently emphasize the difference between ancient wars and modern systems of armament.\n\nToday it is industries that fight one another and discharge their accumulated potential.\n\nFrom this follows an essential consequence:\n\nwar has lost the sovereign character it once shared with festival.\n\nLike industrial enterprise itself, war has become merely a subordinate operation.\n\nAnd this is precisely what deprives ceremonial literature of the meaning you would still wish to assign to it.\n\nSuch literature can only function in relation to a sovereign entity.\n\nYet war itself is now incapable of restoring sovereignty to us.\n\nI doubt there was ever, in earlier times, anything more than attempts at sovereignty.\n\nBut today there is no longer even an attempt whenever one serves a society that no longer claims sovereignty.\n\nI exaggerate, of course:\nnecessarily you still attempt something, even while blinding yourself to it.\n\nBut if ceremonial literature is no longer possible, it is because sovereignty itself is no longer given — not even in its hazardous forms.\n\nWe can no longer serve sovereignty.\n\nWe can only will it.\n\nAnd since society itself renounces it, we are forced to will it on our own account — though obviously not in order to enjoy it.\n\nIf you remember, even obscurely, these were precisely the problems of the Collège de Sociologie.\n\nAnd fundamentally they were also Nietzsche’s problems when he said that the task now falling to us was to replace God.\n\nThat said, I feel the greatest sympathy for a text that is at once lucid and evocative, and which has nothing in common with the dominant concern for subordination.\n\nGeorges Bataille\n\nI believe that within one or two months I will have a text ready for France Libre.\n\nDo not forget your article on literature and morality.\n\nI think Pierre Prévost will contact you soon. I am giving him your address at France Libre."
},

{
id:162,
sender:"Zeitgeist RSS Feed",
date:"1946–1951",
subject:"Notes on 'The Cult of War', 'War and the Sacred', and the continuity of Caillois’s theory of war",
body:"The text discussed in Bataille’s letter — titled in Spanish either 'El culto de la guerra' or 'Del culto de la guerra' — was published in August 1946 in Roger Caillois’s collection 'Fisiologia de Leviatán', released in Buenos Aires by Editorial Sudamericana.\n\nThe volume was translated by J. Calvo and C.A. Jordana.\n\nLater, in revised form, the same text became the third appendix — 'War and the Sacred' — to the expanded 1950 edition of 'Man and the Sacred.'\n\nCuriously, in the preface to the second edition, Caillois never mentions that the text had already appeared previously.\n\nSee also Georges Bataille’s review essay 'War and the Philosophy of the Sacred' published in Critique no. 45 (February 1951), especially pages 141–143.\n\nThe central thesis is that war constitutes a 'total phenomenon' and the 'paroxysm of modern society,' functioning as the modern and dark counterpart to festival, which had represented the paroxysm of primitive society.\n\nThis thesis would later be reaffirmed in 'Bellone ou la Pente de la guerre' (1963).\n\nThe second section of that work, 'The Vertigo of War,' largely republishes material already developed in 'Four Essays on Contemporary Sociology' (1951).\n\nParticularly important is the final chapter, 'Paroxysms of Society,' where Caillois continues to elaborate the idea of war as both cultic excess and collective social delirium.\n\nThroughout these later works Caillois repeatedly invokes what he calls the 'cult and mystique of war.'"
},

{
id:163,
sender:"Zeitgeist RSS Feed",
date:"1945–1956",
subject:"Notes on general economy, catastrophic expenditure, and sovereignty in Bataille",
body:"A direct connection must be established between this correspondence and Bataille’s developing work on 'The Accursed Share.'\n\nOn 29 September 1945 Bataille described the project to Gallimard as already highly advanced and expected to complete it around March 1946.\n\nThe theoretical introduction already contains the decisive notion of excess energy conceived as catastrophic expenditure.\n\nThis framework transforms the earlier sacred sociology of the Collège into a full theory of general economy.\n\nWar becomes not merely a sacred or political phenomenon but one of the privileged forms through which surplus energy is violently discharged.\n\nBataille would later write in 'Sovereignty' that war is certainly the most costly form of destruction of goods and that it risks becoming the fraudulent bankruptcy of humanity itself.\n\n'Sovereignty' eventually became the title of the unpublished third volume of 'The Accursed Share,' written between 1953 and 1954 but abandoned before publication.\n\nSeveral sections were detached and published separately in 1956 under the title 'La souveraineté.'\n\nThe present correspondence therefore records the precise conceptual transition from:\n\n- sacred sociology;\n- festival and sacrifice;\n- toward general economy, excess expenditure, and sovereignty.\n\nThis is also why Bataille insists that modern war no longer possesses true sovereignty.\n\nIndustrial civilization transforms war itself into a subordinate economic operation.\n\nThe sovereign dimension survives only negatively, as impossible desire, loss, or catastrophic expenditure."
},

{
id:164,
sender:"Zeitgeist RSS Feed",
date:"1941–1987",
subject:"Notes on 'Economy on the Scale of the Universe', Pierre Prévost, and the postwar continuation of Bataille’s circle",
body:"The future text mentioned by Bataille in the letter to Caillois was almost certainly 'Economy on the Scale of the Universe.'\n\nIts conclusion already displays the cosmic rhetoric characteristic of Bataille’s mature writing:\n\nhuman beings are described as existing at the scale of immense liberations of energy and charged with returning solar energy to its primordial freedom.\n\nThe text culminates in an apocalyptic affirmation:\n\nwhether through willed glory or suffered horror, the release of excess energy will inevitably occur.\n\nThe mention of Pierre Prévost is historically important.\n\nPrévost belonged, alongside Maurice Blanchot, to the 'Collège d’études socratiques' organized by Bataille between the winter of 1941 and March 1943.\n\nThis clandestine wartime group met on rue de Lille and attempted to elaborate a scholastic framework for inner experience.\n\nPrévost, a journalist specializing in financial and stock-market questions, later became the first managing editor of the review Critique when it was founded in 1946.\n\nHis memoir 'Pierre Prévost rencontre Georges Bataille' (1987) remains one of the most important testimonies concerning:\n\n- the Collège de Sociologie;\n- its dissolution;\n- the wartime intellectual underground;\n- and the creation of Critique after Liberation.\n\nThe memoir is especially valuable regarding the final disintegration of the original Collège project and the transformation of Bataille’s intellectual network after the war."
},

body:"Vézelay (Yonne), 18 November 1945.\n\nMy dear friend,\n\nAs agreed, I am sending you an article for France Libre.\n\nYou had proposed that I give it to you around the 15th. I assume there is still time.\n\nI would be glad if you told me what you think of this summary.\n\nIt seems to me fairly consistent with the text on war that you had shown me and which I liked very much.\n\nCould you also do me a great favor.\n\nIf payment is planned for the articles, could you — while the London office still exists — arrange for the fees to be sent in English currency to:\n\nMrs St Clair Armitage\nUnderhill\nWittersham (Kent)\n\nShe is the aunt of Diane Kotchoubey, with whom I am living and whom you saw with me.\n\nVery warmly yours,\n\nGeorges Bataille\n\nIf you agree, Diane will naturally inform her aunt: from that point it will simply be enough to send her a cheque.\n\nPostal note:\nPostmark partially illegible except for '45'.\nAddressed to Roger Caillois at 'France Libre', 66 quai des Orfèvres, Paris, later corrected to 10 Grange Batelière, Paris."

body:"The article mentioned in this letter is almost certainly the future text later known under the Spanish title 'El culto de la guerra' or 'Del culto de la guerra.'\n\nThe article was eventually published in August 1946 in Roger Caillois’s Buenos Aires collection 'Fisiologia de Leviatán.'\n\nIn revised form it later became the appendix 'War and the Sacred' in the expanded 1950 edition of 'Man and the Sacred.'\n\nBataille explicitly states that the article he is sending is in agreement with the text on war previously shown to him by Caillois.\n\nThis confirms the remarkable postwar continuity between:\n\n- Bataille’s theory of expenditure and sovereignty;\n- and Caillois’s theory of war as social paroxysm.\n\nThe correspondence demonstrates that despite the collapse of the Collège de Sociologie and the political catastrophe of the war itself, important conceptual affinities between Bataille and Caillois persisted after 1945.\n\nThe practical request concerning payment in English currency reflects the severe material difficulties of the immediate postwar period.\n\nDiane Kotchoubey, with whom Bataille was then living, appears here indirectly through the request involving her aunt in Kent.\n\nThe mention of the still-existing London office of France Libre situates the letter within the fragile administrative transition immediately following Liberation."

{
id:167,
sender:"Zeitgeist RSS Feed",
date:"1945–1946",
subject:"Notes on 'L'économie à la mesure de l'univers' and the emergence of The Accursed Share",
body:"The article mentioned in Bataille’s letter of 18 November 1945 is 'L'économie à la mesure de l'univers' ('Economy on the Scale of the Universe').\n\nThe text was eventually published in issue no. 65 of Constellation — 'La France libre' — deposited legally on 3 July 1946.\n\nBataille sent the article to Roger Caillois before receiving the extremely important letter of 28 November 1945 from Georges Ambrosino.\n\nAmbrosino suggested numerous corrections, many of them substantial, most of which Bataille incorporated into the final published version.\n\nIt would therefore be legitimate to say — adapting Bataille’s own later remark concerning The Accursed Share — that the article was, to an important extent, also Ambrosino’s work.\n\nIn Constellation the article was introduced as:\n\n'Brief preliminary notes toward the writing of an essay in general economy, to appear under the title: The Accursed Share.'\n\nThis is one of the earliest explicit announcements of the project that would become La Part maudite.\n\nThe text already contains the foundations of Bataille’s theory of general economy:\n\n- solar excess;\n- energetic surplus;\n- expenditure;\n- catastrophic release;\n- and the impossibility of indefinite accumulation.\n\nThe article must also be read in continuity with Roger Caillois’s reflections on war, festival, collective expenditure, and social paroxysm discussed in the previous correspondence.\n\nThe exchange demonstrates that after the collapse of the Collège de Sociologie, the conceptual dialogue between Bataille and Caillois still persisted around:\n\n- sovereignty;\n- sacrifice;\n- war;\n- festival;\n- and expenditure.\n\nThe London address referenced in the editorial apparatus is:\n\n29 Thurloe Street SW7.\n\nThe final incomplete note refers to Diane de Beauharnais Kotchoubey, Bataille’s companion during this period."
},

{
id:168,
sender:"Georges Bataille → Georges Bataille (archival self-forward)",
date:"7 February 1946",
subject:"On economy, morality, rigor, and Caillois’s 'Literature and Morality'",
body:"What has become of my article on economy?\n\nWill you not send me proofs?\n\nI must say that I would have liked it to appear before April. Besides, I do not see that 'La France libre' has yet appeared in France. Could you inform me in a few words of the situation?\n\nYour text on Literature and Morality will soon be sent to press.\n\nI agree with it far more through natural reaction than theoretically. What embarrasses me above all is that I possess only a vague — and highly questionable — idea of the morality to which it refers.\n\nWhat generally strikes most of your readers is the impossibility in which you leave them of knowing toward what end and by what authority you speak.\n\nMoreover, the weak part of your article is precisely the section that touches theory — and even approaches it rather strangely when you ask this surprising question:\n\n'What use is morality?'\n\nFor me — who has perhaps had no greater concern than contesting the right endlessly to ask 'what use is...?' — who in any case connects every moral consideration to the positing of a value such that one can no longer ask what purpose it serves, this is disarming.\n\nHow do you fail to perceive the uneasiness you create by demanding a rigor whose internal logic you do not help anyone perceive within your writings?\n\nI increasingly ask myself whether true rigor would not require first of all that one lack rigor — provided one remains conscious of it — because, I believe, we can only be rigorous on certain points on the condition of lacking rigor on others.\n\nKnowledge does not seem to me in the least to take sides against rigor.\n\nAnd that is why your attitude pleases me.\n\nI shall come to Paris around the fifteenth and perhaps this time I shall not have the bad luck of missing you.\n\nAll my friendship to your brother as well, whom I care for greatly.\n\n— Georges Bataille\n\n* Postmark partially illegible except for the date numeral: 8.\nAddressed to: Monsieur Roger Caillois / 1 (or 2?) rue Parmentier / Vitry-sur-Seine / (Seine)."
},

{
id:170,
sender:"Zeitgeist RSS Feed",

subject:"On the missing draft of 'Economy on the Scale of the Universe'",
body:"The original version of 'L'économie à la mesure de l'univers' ('Economy on the Scale of the Universe') sent to Roger Caillois and Georges Ambrosino has not been recovered.\n\nHowever, Ambrosino’s letter of 28 November 1945 makes it possible to measure the distance between the primitive manuscript and the version eventually published in issue no. 65 of Constellation.\n\nAt the end of September 1945 Bataille described The Accursed Share to Gallimard as a work already 'far advanced,' adding:\n\n'I think I shall see the end of it around March 1946.'\n\nAmbrosino, in his reply of 28 November 1945, proposed instead:\n\n'September 1946 must be our extreme deadline.'\n\nThese exchanges document the active formation of Bataille’s theory of general economy immediately after the war.\n\nThe article already contained the conceptual foundations that would later organize The Accursed Share:\n\n- excess energy;\n- solar expenditure;\n- catastrophic release;\n- non-productive consumption;\n- and the impossibility of unlimited accumulation."
},

{
id:171,
sender:"Zeitgeist RSS Feed",
date:"1946",
subject:"On Caillois’s 'Literature and Morality' and the Cahiers d’Actualité project",
body:"The reference to Pierre Prévost in Bataille’s earlier correspondence might suggest that Roger Caillois’s text on literature and morality had originally been intended for Critique.\n\nThis impression is misleading.\n\nPierre Prévost later confirmed that the text was not destined for Critique but for the projected second Cahier d’Actualité.\n\nThe project was being assembled at the time by:\n\n- Georges Bataille;\n- Maurice Blanchot;\n- and Pierre Prévost.\n\nOnly the first Cahier eventually appeared, published by Calmann-Lévy in 1945 under the title 'L’Espagne libre.'\n\nBy 7 February 1946 Caillois’s text was already ready for printing.\n\nIt almost certainly corresponds to:\n\n'Les rapports de la morale et de la littérature'\n\npublished in Spectateur on 1 October 1946 and later reprinted in Chroniques de Babel.\n\nThe central formulation criticized by Bataille appears there nearly verbatim:\n\n'I often ask myself what morality is for, and until now I have found no better answer than this: morality serves to increase the amount of confidence available in the world.'\n\nBataille’s disagreement with this utilitarian framing is profound.\n\nFor him, morality cannot ultimately be justified through usefulness.\n\nA sovereign value is precisely one for which the question 'what use is it?' can no longer legitimately be asked.\n\nThe dispute therefore concerns not only morality itself, but the entire problem of sovereignty, utility, sacred value, and intellectual authority after the collapse of the Collège de Sociologie."
},

{
id:172,
sender:"Zeitgeist RSS Feed",
date:"1946–1947",
subject:"Critique, Caillois, and 'The Inquisitor without a Church'",
body:"Despite the growing theoretical divergence between Georges Bataille and Roger Caillois after the war, Caillois soon became an important contributor to Critique, the review founded by Bataille.\n\nAmong the texts Caillois published there were:\n\n- 'The Political Thought of Raymond Aron' (Critique no. 5, October 1946);\n- 'The Classical Cubism of Juan Gris' (Critique no. 12, May 1947);\n- and numerous review essays concerning Kanapa, Groethuysen, Emmanuel d’Astier, and Alexandre Koyré.\n\nMost importantly, Bataille himself devoted a major essay to Caillois:\n\n'Roger Caillois ou l’Inquisiteur sans Église'\n\npublished in Critique nos. 8–9 (January–February 1947).\n\nThe essay discusses:\n\n- La Communion des Forts;\n- Les Impostures de la poésie;\n- and Le Rocher de Sisyphe.\n\nThe title itself condenses the paradoxical nature of their postwar relationship.\n\nCaillois appears simultaneously as:\n\n- theorist of rigor;\n- seeker of spiritual authority;\n- defender of intellectual order;\n- and thinker deprived of the institutional or sacred structure capable of grounding that authority.\n\nThe unresolved tensions inherited from the Collège de Sociologie therefore continue inside Critique itself:\n\n- sovereignty versus rigor;\n- sacred expenditure versus intellectual discipline;\n- mystical experience versus sociological structure;\n- and the question of whether spiritual authority can still exist after the catastrophe of war."
},

{

subject:"Genesis, sexuality, and the continuation of the Collège",
body:"[On stationery headed:]\n\nGENESE\nSexology – Psychoanalysis – Philosophy of Sexuality\nIllustrated Review Appearing Every Two Months\n7 Rue Saint-Séverin, Paris V\nODE. 45-43\n\nOrléans, 24 November 1957\n\nMy dear friend,\n\nI am sending you the advertisement for a projected review,\nwhich places itself in the tradition of Anthropophyteia.\n\nDuring an upcoming stay in Paris I intend to ask you for a meeting.\n\nI would like to ask what you think of it.\n\nYour advice, in any case, would be extremely valuable to me.\n\nAfter all, it still concerns the continuation of that Collège,\nwhich perhaps finally has great difficulty dying...\n\nWith warm friendship,\n\nGeorges Bataille\n\n* Postmark: 25 XI 57 12k.\nAddressed to: Monsieur Roger Caillois / UNESCO / Avenue Kléber / Paris 16e.\nOn the envelope (15 × 23 cm), in Bataille’s handwriting:\n'Sent by G. Bataille, 1 rue Dupanloup, Orléans.'"

{
id:174,
sender:"Zeitgeist RSS Feed",
date:"1957–1958",
subject:"Notes on Genèse, Anthropophyteia, and the surviving continuation of the Collège",
body:"The address and telephone number appearing on the Genèse letterhead are those of Maurice Girodias, publisher.\n\nThis is confirmed by two letters sent by Girodias to Georges Bataille in July 1957 and 11 August 1958 concerning the project.\n\nThe 'advertisement' mentioned by Bataille included an unpublished text:\n\n'La signification de l’érotisme' ('The Meaning of Eroticism').\n\nThis text was later published by J.P. Le Bouler and Denis Rabourdin in the Revue de la Bibliothèque nationale (no. 17, Autumn 1985).\n\nThat edition also devoted substantial attention to the Genèse dossier sent by Bataille to Roger Caillois.\n\nThe projected review Genèse was announced publicly by Bataille in December 1957, with publication anticipated for June 1958.\n\nThis announcement appeared in:\n\n'Bataille, Feydeau et Dieu'\n\nan interview conducted with Marguerite Duras for France-Observateur (12 December 1957).\n\nThe review explicitly situated itself within the tradition of Anthropophyteia:\n\n'Anthropophyteia: Yearbooks for Folkloric Research and Investigations into the Historical Development of Sexual Morality,'\n\nedited by Friedrich Salomo Krauss and published in Leipzig between 1904 and 1913 in ten volumes.\n\nThe reference is significant because Bataille had already invoked Anthropophyteia years earlier while preparing visual and conceptual material connected to the projected multi-volume edition of The Accursed Share.\n\nIn a 1954 list of illustrations he noted:\n\n'Portraits of seductive women — see Fuchs and Anthropophyteia.'\n\nThe final remark of Bataille’s 1957 letter — that this project still concerned 'the continuation of that Collège, which perhaps finally has great difficulty dying' — refers explicitly to the Collège de Sociologie.\n\nNearly twenty years after its dissolution, Bataille still understood certain editorial, anthropological, erotic, and sacred investigations as survivals or mutations of the unfinished Collège project."
},

{
id:175,
sender:"Roger Caillois",
recipient:"Georges Bataille",
date:"Circa December 1957",
subject:"On Eroticism and the Genèse project",
body:"Thank you for your books, especially 'Eroticism,' which seems to me the most important.\n\nI am very favorable to the principle of Genèse. But will you have sufficient material to fill six issues per year in a worthy manner?\n\nI assume that you have already resolved this question, at least for the first issues.\n\nLet me know when you pass through Paris and come have lunch. Simply warn me two or three days in advance.\n\nWe will then have plenty of time to speak about these problems.\n\nVery faithfully yours,\nR. C.\n\n[Editorial Note]\n\nThis letter survives in the Bibliothèque nationale archives:\n\nB.N., Manuscrits, N.a.fr. 15853, folio 337.\n\nThe address given by Caillois is:\n\n169 rue de l’Université, Paris 7e.\n\nThe books mentioned by Caillois almost certainly include Bataille’s recently published 'L’Érotisme' (1957), which Caillois explicitly singles out as 'the most important.'\n\nThe exchange continues the discussion opened by Bataille’s November 1957 letter concerning the projected review 'Genèse.'\n\nCaillois expresses both enthusiasm and skepticism:\n\n- enthusiasm toward the intellectual principle of the review;\n- skepticism concerning the practical difficulty of sustaining six issues annually.\n\nThe question of periodicity and material reflects a recurring structural problem in Bataille’s editorial enterprises, from Acéphale to the unrealized review projects surrounding the Collège de Sociologie.\n\nThe invitation to lunch in Paris suggests that, despite decades of theoretical divergence, the personal relationship between Bataille and Caillois remained intact and intellectually active.\n\nThe tone is notably warm, restrained, and free of the polemical tension characteristic of the 1939 correspondence."
},

{
id:176,
sender:"Zeitgeist RSS Feed",
date:"1957–1958",
subject:"Notes on Caillois, Eroticism, Genèse, and the persistence of the Collège",
body:"No other letters from Roger Caillois to Georges Bataille are preserved at the Bibliothèque nationale.\n\nThe 'Mme Alena (Vichrova-)Bykova' mentioned in the archival notes is the woman Caillois married on 14 August 1957.\n\nThe books thanked by Caillois in his letter most likely include:\n\n- 'La Littérature et le mal';\n- 'L’Érotisme';\n- 'Le Bleu du ciel'.\n\nThese titles were being actively circulated in autumn 1957 through a promotional bulletin distributed jointly by Gallimard, Minuit, and Pauvert under the heading:\n\n'Georges Bataille (à soixante ans...)'.\n\n'L’Érotisme' had been completed printing on 3 October 1957.\n\nThe review project 'Genèse' — described by Bataille as a 'review appearing every two months' — was conceived as a continuation of the intellectual and anthropological investigations associated with the Collège de Sociologie.\n\nThe unpublished project survives through promotional dossiers, correspondence, and preparatory materials.\n\nA substantial portion of this archive was later edited by J.P. Le Bouler and Dominique Rabourdin in their edition of 'La signification de l’érotisme.'\n\nDespite Bataille’s enthusiasm, 'Genèse' never appeared.\n\nMaurice Girodias definitively abandoned the project on 6 December 1958.\n\nThe exchange between Bataille and Caillois in these years reveals a remarkable late reconciliation.\n\nIn 'L’Érotisme' (1957), Bataille explicitly credits Caillois for developing one of the first elaborate theories of transgression and festival:\n\n'Seul Roger Caillois, utilisant l’enseignement et les conseils de Mauss, donna le premier, dans sa théorie de la fête, un aspect élaboré de la transgression.'\n\nBataille refers specifically to:\n\n- 'L’Homme et le sacré';\n- the chapter 'Le sacré de transgression : théorie de la fête';\n- the influence of Marcel Mauss.\n\nFar from treating Caillois merely as a compiler, Bataille insists that he possessed:\n\n- an active and personal intelligence;\n- the capacity to organize anthropological material into genuine conceptual thought;\n- a powerful theory of sacred transgression.\n\nIn 'L’Érotisme,' Bataille writes:\n\n'La chance voulut que Roger Caillois, loin d’être un compilateur, fût lui-même non seulement capable d’exposer les faits sous une forme saisissante, mais de donner à ses développements la fermeté d’une pensée active et personnelle.'\n\nThis retrospective recognition is crucial.\n\nThe violent tensions of 1939 — concerning mysticism, expenditure, spiritual power, sacrifice, and sovereignty — had not erased the intellectual importance that Bataille continued to attribute to Caillois.\n\nEven after the collapse of the Collège de Sociologie, the dialogue concerning:\n\n- festival;\n- sacred transgression;\n- sovereignty;\n- eroticism;\n- expenditure;\n- and collective experience\n\nremained active beneath their correspondence.\n\nThe abandoned project of 'Genèse' therefore appears less as an isolated editorial venture than as one final spectral afterlife of the Collège itself."
},

{
id:177,
sender:"Georges Bataille",
recipient:"Roger Caillois",
date:"4 February 1959",
subject:"On Crastre, 'Jeux et les hommes,' and a meeting in Paris",
body:"ORLÉANS, 4 February 1959,\n\nMy dear friend,\n\nI shall be delighted by this collaboration from Crastre, and I do not doubt that Piel will agree.\n\nBut I am not giving up on the review of 'Jeux et les hommes.' I am simply very embarrassed to be late with it.\n\nI shall be in Paris Monday and Tuesday, and I will telephone you Monday morning, for I would be very happy to see you.\n\nVery warmly yours,\nGeorges Bataille\n\nThank you for your shipment, which I appreciate greatly.\n\n[Archival Note]\n\nEnvelope letterhead:\n\nBIBLIOTHÈQUE D’ORLÉANS.\n\nPostmark:\n\n4 February 1959.\n\nAddressed to:\n\nMonsieur Roger Caillois\n15 rue Pétrarque\nParis 16e.\n\n[Editorial Context]\n\nThis brief note belongs to the final period of the Bataille–Caillois correspondence.\n\nThe 'Jeux et les hommes' mentioned here refers to Roger Caillois’s major work 'Les Jeux et les hommes' (1958), his systematic theory of play categories:\n\n- agon;\n- alea;\n- mimicry;\n- ilinx.\n\nBataille indicates that he still intends to write a review of the book, though he is delayed.\n\nThe mention of Jean Piel is significant.\n\nPiel — one of Bataille’s closest intellectual collaborators and a central figure at Critique — had long been involved in sustaining the postwar intellectual networks emerging from the remains of the Collège de Sociologie.\n\nThe reference to 'Crastre' likely concerns a prospective contributor or collaborator connected to Critique or related editorial projects.\n\nThe tone of the letter is notably calm and affectionate.\n\nBy 1959, the earlier fractures surrounding:\n\n- sacred sociology;\n- mysticism;\n- sovereignty;\n- expenditure;\n- spiritual power;\n- and the collapse of the Collège\n\nhad largely given way to a quieter relation of mutual recognition.\n\nThis final phase of the correspondence reveals not reconciliation through agreement, but through the persistence of intellectual esteem across decades of divergence."
},

{
id:180,
sender:"Michel Leiris",
recipient:"Georges Bataille",
date:"3 July 1939",
subject:"On the activity and direction of the Collège de Sociologie",
body:"Paris, 3 July 1939.\n\nMy dear Georges,\n\nIt is to you alone that I address myself here, since Caillois is absent.\n\nWhile working on drafting the report on the activity of the Collège de Sociologie since its foundation in March 1937 — a report which I was supposed to read at tomorrow’s session — I found myself led to reflect more closely than I had done until now upon what the activity of the Collège has been during these last two years, and more and more doubts assail me concerning the rigor with which this activity has been conducted; to such a degree that I can no longer regard myself as qualified to present myself tomorrow as spokesperson for our organization.\n\nIf the idea of a congress which we discussed with Caillois and several others takes shape in the autumn, I shall develop my objections during those discussion sessions. Let it suffice today for me to mention the principal points upon which my disagreement rests.\n\n1°) In the first paragraph of the 'Note concerning the foundation of a Collège de Sociologie,' published in 'Acéphale' and reproduced in the July 1938 issue of the N.R.F., it is indicated that the Collège gives itself as its primary aim the study of 'social structures.' Now I believe that serious faults against the rules of method established by Durkheim — whose spirit we have never ceased invoking — have repeatedly been committed within the Collège: work proceeding from poorly defined notions, comparisons between facts taken from societies of profoundly different character, etc...\n\n2°) In the second paragraph, there is discussion of forming ourselves into a 'moral community' that would represent something radically distinct from the habitual associations of scholars. Agreed. But this 'moral community' remains entirely to be defined and I strongly fear that if people issuing from the intellectual milieu from which we ourselves come attempt to constitute themselves as an Order or a Church, they will merely end up forming what in ordinary language is called a 'chapel.'\n\nConcerning the foundation of an order, it seems to me in every respect premature so long as we have not succeeded in defining a doctrine. One does not found an order in order that a religion might emerge from it; on the contrary, it is within religions that orders are founded.\n\n3°) The third paragraph of the same note speaks of the constitution of a 'sacred sociology.' Although I in no way fail to recognize the importance of the sacred within social phenomena, and all that it represents for us vitally, I believe that emphasizing the role of this order of facts to the degree that we have emphasized it — almost to the point of making the sacred the unique principle of explanation — contradicts the acquisitions of modern sociology and notably the Maussian notion of the 'total phenomenon.'\n\nFar from me is the idea of wanting to turn the Collège into a learned society where one would devote oneself to pure sociological research. But in the end, a choice must be made and, if we claim the sociological science constituted by men such as Durkheim, Mauss, and Robert Hertz, it is indispensable that we conform ourselves to its methods.\n\nOtherwise, we must cease calling ourselves 'sociologists,' in order to dissipate all ambiguity.\n\nI am counting greatly, in order to clarify all this and give our movement its decisive orientation, upon those discussion sessions which would take place in the autumn, and I send to you, as well as to our friends, the assurance of all my devotion toward the preparation of this congress whose gathering I consider necessary.\n\nMichel Leiris,\nmember of the Collège de Sociologie."

let emails = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
) || JSON.parse(JSON.stringify(defaultEmails));

let selectedEmailId = null;
let deletedEmailCount = parseInt(localStorage.getItem(DELETE_COUNT_KEY) || "0", 10);

const pinnedEmail = {
    id: PINNED_EMAIL_ID,
    pinned: true,
    sender: "Lucid Lake Institute",
    recipient: "Georges Bataille",
    date: "04.10.2026",
    subject: "Secret Acéphale Maps unlocked",
    body: "For the first time in history, independent researchers Sara Ferro & Chris Weil have located the geographical traces of Acéphale and the Collège de Sociologie, mapping all known sites in an interactive map by connecting the dots...",
    links: [
        {
            text: "Open Acéphale Maps",
            url: "./acephale-maps.html",
            target: "_self"
        }
    ],
    replies: []
};

function ensurePinnedEmail(){
    if(deletedEmailCount >= 5 && !emails.some(e => String(e.id) === PINNED_EMAIL_ID)){
        emails.unshift(JSON.parse(JSON.stringify(pinnedEmail)));
        saveEmails();
    }
}

function saveEmails(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(emails)
    );
}


/* RENDER */

function renderEmails(filter=""){

    const list = document.getElementById("emailList");

    list.innerHTML = "";

    const search = (filter || "").toLowerCase().trim();

    ensurePinnedEmail();

    const pinned = emails.filter(email => email.pinned);
    const filtered = emails.filter(email => {

        if(email.pinned) return false;

        const searchableText = [
            email.sender || "",
            email.recipient || "",
            email.subject || "",
            email.body || "",
            email.date || ""
        ]
        .join(" ")
        .toLowerCase();

        return searchableText.includes(search);

    });

    [...pinned, ...filtered].forEach(email => {

        const card = document.createElement("div");

        card.className = "email-card";

        if(email.pinned){
            card.classList.add("pinned");
        }

        if(String(selectedEmailId) === String(email.id)){
            card.classList.add("active");
        }

        card.innerHTML = `

            <div class="email-top">

                <div class="sender">
                    ${email.sender}
                </div>

                <div class="date">
                    ${email.date}
                </div>

            </div>

            <div class="subject">
                ${email.subject}
            </div>

            <div class="preview">
                ${email.body.substring(0,90)}...
            </div>

        `;

        card.onclick = () => {
            selectedEmailId = email.id;
            document.querySelectorAll(".email-card.active").forEach(el => el.classList.remove("active"));
            card.classList.add("active");
            openEmail(email.id);
        };

        list.appendChild(card);

    });

}

/* OPEN */

function renderEmailBody(email){
    const viewBody = document.getElementById("viewBody");
    viewBody.innerHTML = "";

    const body = String(email.body || "");
    const urlRegex = /(https?:\/\/[^\s<]+)/g;
    const parts = body.split(urlRegex);

    parts.forEach(part => {
        if(/^https?:\/\//i.test(part)){
            const a = document.createElement("a");
            a.href = part;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = part;
            viewBody.appendChild(a);
        }else{
            viewBody.appendChild(document.createTextNode(part));
        }
    });

    const links = Array.isArray(email.links)
        ? email.links
        : (email.link ? [email.link] : []);

    if(links.length){
        viewBody.appendChild(document.createTextNode("\n\n"));

        links.forEach((link, index) => {
            if(!link || !link.url) return;

            if(index > 0){
                viewBody.appendChild(document.createTextNode("\n"));
            }

            const a = document.createElement("a");
            a.href = link.url;
            a.target = link.target || "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = link.text || link.url;
            viewBody.appendChild(a);
        });
    }
}

function openEmail(id){

    selectedEmailId = id;

    const email = emails.find(e => String(e.id) === String(id));

    if(!email) return;

    document.getElementById("emptyState").style.display = "none";
    document.getElementById("viewerContent").style.display = "flex";

    document.getElementById("viewSubject").textContent = email.subject;
    document.getElementById("viewSender").textContent = "From: " + email.sender;
    document.getElementById("viewRecipient").textContent = "To: " + email.recipient;
    document.getElementById("viewDate").textContent = email.date;
    renderEmailBody(email);

    document.getElementById("avatar").textContent =
        email.sender.charAt(0).toUpperCase();

    const thread = document.getElementById("replyThread");

    thread.innerHTML = "";

    email.replies.forEach(reply => {

        const div = document.createElement("div");

        div.className = "reply";

        div.innerHTML = `
            ${reply.text}
            <small>${reply.date}</small>
        `;

        thread.appendChild(div);

    });

    renderEmails(
        document.getElementById("searchInput").value
    );

}

/* SEARCH */

document.getElementById("searchInput")
.addEventListener("input",(e)=>{

    renderEmails(e.target.value);

});

/* MODAL */

function openCompose(){

    document.getElementById("composeModal").style.display = "flex";

}

function closeCompose(){

    document.getElementById("composeModal").style.display = "none";

}

/* CREATE */

function createEmail(){

    const recipient =
        document.getElementById("composeRecipient").value;

    const subject =
        document.getElementById("composeSubject").value;

    const body =
        document.getElementById("composeBody").value;

    if(!recipient || !subject || !body){

        alert("Please complete all fields.");
        return;

    }

    emails.unshift({

        id:Date.now(),
        sender:"George Bataille",
        recipient,
        subject,
        body,
        date:new Date().toLocaleDateString(),
        replies:[]

    });

    saveEmails();

    renderEmails();

    closeCompose();

    document.getElementById("composeRecipient").value = "";
    document.getElementById("composeSubject").value = "";
    document.getElementById("composeBody").value = "";

}

/* REPLY */

function sendReply(){

    if(selectedEmailId === null) return;

    const text =
        document.getElementById("replyText").value;

    if(!text){

        alert("Write a reply first.");
        return;

    }

    const email =
        emails.find(e => String(e.id) === String(selectedEmailId));

    // Keep replies working even when the message was opened from a filtered search.
    if(!email) return;

    email.replies.push({

        text,
        date:new Date().toLocaleString()

    });

    document.getElementById("replyText").value = "";

    saveEmails();

    // Refresh the open message and preserve the current search filter.
    const currentFilter = document.getElementById("searchInput").value;
    openEmail(selectedEmailId);
    renderEmails(currentFilter);

}

/* DELETE */

function deleteEmail(){

    if(selectedEmailId === null) return;

    document.getElementById("deleteModal").style.display = "flex";

}

function closeDeleteModal(){

    document.getElementById("deleteModal").style.display = "none";

}

function confirmDeleteEmail(){

    const emailToDelete = emails.find(e => String(e.id) === String(selectedEmailId));

    if(emailToDelete && emailToDelete.pinned){
        closeDeleteModal();
        return;
    }

    emails = emails.filter(
        e => String(e.id) !== String(selectedEmailId)
    );

    deletedEmailCount += 1;
    localStorage.setItem(DELETE_COUNT_KEY, String(deletedEmailCount));

    if(deletedEmailCount >= 5){
        ensurePinnedEmail();
    }

    selectedEmailId = null;

    saveEmails();

    renderEmails(document.getElementById("searchInput").value);

    document.getElementById("viewerContent")
        .style.display = "none";

    document.getElementById("emptyState")
        .style.display = "flex";

    closeDeleteModal();

}

document.addEventListener("keydown",(e)=>{

    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==="e"){

        e.preventDefault();

        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(DELETE_COUNT_KEY);
        deletedEmailCount = 0;

        emails = JSON.parse(JSON.stringify(defaultEmails));

        saveEmails();

        selectedEmailId = null;

        renderEmails();

        document.getElementById("viewerContent")
            .style.display = "none";

        document.getElementById("emptyState")
            .style.display = "flex";

    }

});

/* INIT */

ensurePinnedEmail();
renderEmails();

</script>

</body>
</html>
