<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta content="noindex, nofollow" name="robots">
<title>Hotler</title>

<style>

:root{
    --bg:transparent;
    --sidebar:transparent;
    --card:#ffffff;
    --primary:#2563eb;
    --primary-light:#dbeafe;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --hover:#f1f5f9;
    --shadow:0 10px 30px rgba(15,23,42,0.08);
    --radius:18px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* APP */

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:24px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:24px;
    font-weight:700;
}

.logo-badge{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

.compose-btn{
    border:none;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:14px;
    border-radius:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:15px;
    font-weight:600;
    transition:0.2s;
}

.compose-btn:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow);
}

.nav{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:14px;
    cursor:pointer;
    color:var(--muted);
    transition:0.2s;
}

.nav-item:hover{
    background:var(--hover);
}

.nav-item.active{
    background:var(--primary-light);
    color:var(--primary);
    font-weight:600;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* EMAIL PANEL */

.email-panel{
    width:360px;
    border-right:1px solid var(--border);
    background:#f8fafc;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.panel-header{
    padding:20px;
    border-bottom:1px solid var(--border);
    background:white;
}

.search{
    position:relative;
}

.search input{
    width:100%;
    border:none;
    background:#f1f5f9;
    padding:14px 14px 14px 46px;
    border-radius:14px;
    font-size:14px;
    outline:none;
}

.search svg{
    position:absolute;
    left:14px;
    top:12px;
    color:#94a3b8;
}

/* EMAIL LIST */

.email-list{
    overflow-y:auto;
    flex:1;
    padding:14px;
}

.email-card{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    border:1px solid transparent;
    transition:0.2s;
}

.email-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
}

.email-card.active{
    border-color:#2563eb;
    background:#eff6ff;
    box-shadow:0 0 0 1px #2563eb;
}

.email-card.pinned{
    position:sticky;
    top:0;
    z-index:4;
    border:2px solid #2563eb;
    box-shadow:0 8px 20px rgba(37,99,235,0.14);
}

.email-card.pinned::before{
    content:"PINNED";
    display:inline-block;
    margin-bottom:8px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.12em;
    color:#2563eb;
}

.email-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.sender{
    font-weight:600;
}

.date{
    font-size:12px;
    color:var(--muted);
}

.subject{
    font-weight:600;
    margin-bottom:6px;
}

.preview{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
}

/* VIEWER */

.viewer{
    flex:1;
    display:flex;
    flex-direction:column;
    background:white;
}

.empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:22px;
}

.viewer-content{
    display:none;
    flex-direction:column;
    height:100%;
}

.viewer-header{
    padding:28px;
    border-bottom:1px solid var(--border);
}

.viewer-subject{
    font-size:30px;
    font-weight:700;
    margin-bottom:14px;
}

.viewer-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.author{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.viewer-body{
    flex:1;
    overflow-y:auto;
    padding:28px;
    line-height:1.8;
}

.reply-thread{
    margin-top:40px;
}

.reply-thread h3{
    margin-bottom:18px;
}

.reply{
    background:#f8fafc;
    border:1px solid var(--border);
    padding:18px;
    border-radius:16px;
    margin-bottom:14px;
}

.reply small{
    display:block;
    margin-top:10px;
    color:var(--muted);
}

/* REPLY */

.reply-box{
    border-top:1px solid var(--border);
    padding:22px;
}

.reply-box textarea{
    width:100%;
    min-height:110px;
    border:none;
    background:#f8fafc;
    border-radius:16px;
    padding:18px;
    resize:none;
    outline:none;
    font-family:inherit;
    font-size:18px;
    margin-bottom:14px;
}

.reply-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.action-btn{
    border:none;
    border-radius:14px;
    padding:12px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:16px;
    transition:0.2s;
}

.primary{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
}

.secondary{
    background:#eef2ff;
    color:#3730a3;
}

.action-btn:hover{
    transform:translateY(-1px);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.45);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:999;
}

.modal-content{
    width:100%;
    max-width:620px;
    background:white;
    border-radius:24px;
    padding:28px;
    box-shadow:var(--shadow);
}

.modal-title{
    font-size:26px;
    font-weight:700;
    margin-bottom:24px;
}

.input{
    width:100%;
    border:none;
    background:#f8fafc;
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
    outline:none;
    font-family:inherit;
    font-size:18px;
}

textarea.input{
    min-height:220px;
    resize:none;
    font-size:18px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:10px;
}


/* DELETE MODAL */

.delete-modal-icon{
    width:72px;
    height:72px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#fee2e2;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#dc2626;
}

.delete-modal-text{
    text-align:center;
    color:var(--muted);
    margin-bottom:24px;
    line-height:1.6;
}

/* MOBILE */

.mobile-top{
    display:none;
}

@media(max-width:950px){

    .sidebar{
        width:88px;
        padding:18px 12px;
    }

    .logo span,
    .nav-item span,
    .compose-btn span{
        display:none;
    }

    .compose-btn{
        padding:14px;
    }

    .email-panel{
        width:320px;
    }
}

@media(max-width:760px){

    body{
        overflow:auto;
    }

    .app{
        flex-direction:column;
        height:auto;
    }

    .sidebar{
        width:100%;
        height:auto;
        flex-direction:row;
        justify-content:space-between;
        align-items:center;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .nav{
        flex-direction:row;
        overflow-x:auto;
    }

    .main{
        flex-direction:column;
    }

    .email-panel{
        width:100%;
        height:320px;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .viewer{
        min-height:calc(100vh - 400px);
    }

    .viewer-subject{
        font-size:24px;
    }
}

#viewBody{
    white-space:pre-wrap;
}

#viewBody a{
    color:#2563eb;
    font-weight:600;
    text-decoration:none;
    overflow-wrap:anywhere;
}

#viewBody a:hover{
    text-decoration:underline;
}

</style>
</head>

{
id:6,
sender:"Georges Bataille",

subject:"We Must Throw Ourselves Entirely Into The Fight",
body:"My dear Caillois, \n\nA certain number of things have happened since your departure. Your project, in any case, has pulled me out of the rather desperate inertia in which I found myself. I have seen quite a number of people. I am certain that something can be done, that the opportunity exists today, precisely today, to intervene in a way that could become decisive. But there can no longer be any question of joking and nothing is possible except on the condition of throwing oneself body and soul into the struggle. If by chance it is possible for you, come to Flore tomorrow Sunday at 6:30. Otherwise come Monday around four o'clock to the Bibliothèque. Ask for me at the office of the Salle des imprimés. If you are still interested in the project you put into my head, it is necessary that we begin work immediately.\n\nThe current political situation demands urgency. Within a few weeks at the latest we must have a manifesto — not a vague declaration made of a few phrases, but a solid and compelling programme leaving nothing in shadow.\n\nYours affectionately,\nGeorges Bataille.",

id:18,
sender:"Georges Bataille",

date:"76 bis rue de Rennes, Paris — September 26, 1935",
subject:"Your Silence Felt Like A Defection",
body:"My dear Caillois,\n\nI was surprised not to receive any news from you. I had counted greatly on your return. I confess that I do not understand why, having missed the meeting we had arranged for the 15th, you did not think it would be extremely unpleasant for me not to receive at least a word from you. \n\nYour silence was for me equivalent to a defection. The explanation you give in your letter does not encourage me. For two months now, ever since conceiving this great project, you have spent your time wandering about and declaring yourself exhausted with fatigue. I make no reproach to you for this. But you will easily understand that under these conditions counting on you becomes for me only a vague hope, nothing more. And since you know that I have always considered an agreement with the surrealists to be a necessity sooner or later, you have placed me in a situation where hesitation appeared entirely absurd. \n\nI have already seen Breton and I am to meet him again at length the day after tomorrow. Nothing proves that we shall agree. I am not interested in any association without a preliminary accord equivalent to an organic union. On the other hand, it now seems impossible to continue posing narrow personal questions. Reservations from Breton concerning you would appear to me just as inadmissible as reservations from you concerning Breton. All the more so because despite your somewhat inconsistent attitude, it nevertheless remains true that the initiative for this project came from you. Without exception, everyone presently in Paris who is interested in this project has spoken in favour of an understanding with Breton. As for Monnerot, I remain only distantly in contact with him. I finally saw him again after finding a note from him at my apartment and arranging a meeting. He will no doubt become interested in what we are doing, but only once it already exists.\n\nAffectionately yours,\nGeorges Bataille.",

body:"My dear Caillois, \n\nTomorrow I shall send you the texts that we adopted together with my personal friends, along with Breton, Eluard, Peret, and Maurice Heine. It was Maurice Heine who demanded modifications, while Breton and I defended the text in its original form. I recall that Maurice Heine was among those you yourself had thought of calling upon rapidly, among those in whom you believed complete confidence could be placed. He immediately spoke of the principle: not to speak but to act. Without insisting that you sign, I must repeat what I said during the meeting: that I believed it necessary to submit the text to you before sending it to print. Breton answered: 'Naturally. It would be very interesting if Caillois signed,' and he said this insistently. \n\nI confess that I do so mostly as a formality, not believing that you will sign. I cannot help thinking that your attitude resembles nothing of that of a soldier in the army of the Jesuits. You do not know how to obey the necessity of a cause. You invoke superior principles concerning this necessity, principles that merely reveal an aptitude for reacting on the level of literary expression rather than on that of reality. \n\nAlthough fundamentally I am little inclined to preserve the reservations of friendship in dissensions such as the one separating us, I repeat that I regret emotionally what on your part is ultimately only an optical illusion, above all an illusion concerning the fundamental intransigence that for me forms the basis of our intervention. \n\nGeorges Bataille. \n\nIf you wish to meet me, come by tomorrow after 5:30. I shall be alone and free until 7:30.",

date:"Wednesday Morning, October 9, 1935",
subject:"The Collision Of Our Two Fanaticisms",
body:"My dear Caillois, \n\nI wish to apologize for excesses of language that leave even me surprised. I assure you that I regret them, but I would like to think that you will forget reproaches which nevertheless imply an essential confidence. \n\nI say that I am surprised because until now I had never found a way to exist in a fanatical state: I aspired to this, but before me there was only emptiness. I would like the collision of our two fanaticisms yesterday to take above all the value of an encounter. I now also hope that this misery will give us the occasion to experience to what extent essential things still derive from the god polemos. \n\nWhat we envisioned at the end of our conversation, and which resulted precisely from its unfortunate turn, I no longer doubt is the only possible path. But you must also understand to what extent both things are necessary. What you envision without an external political agitation would lack force. Besides you and me, it is possible to count immediately on Ambrosino, Kelemen, and Klossowski. In this domain one can scarcely count except on men who remain somewhat uncomfortable on the political plane. \n\nI would like you to read the text I passed to you, which has played an essential role in the relations I have maintained with people such as Ambrosino, Kelemen, and several others, and which also seems to have affected Klossowski. Do not forget either that it is absolutely necessary that you read Heiden and that in general you cannot avoid improvising a concrete knowledge of the banal political reactions of the people whom we are called upon to encounter. Remember your communist friend with whom we met at the Boule d'Or. That day you remained far from what you expected. \n\nIt would be unfortunate to continue remaining so far from reality. As for organisation, I do not think a distribution according to the following divisions impossible: interior organisation, military organisation, international organisation, sociological commission, economic commission, perhaps also a commission against war. \n\nI shall tell you what I believe possible under the name sociological commission, but naturally you must also reflect upon this from your side before tomorrow Thursday at nine o'clock. \n\nVery affectionately yours, \nGeorges Bataille.",

body:"My dear Caillois, \n\nI assume you realized that not everything was equally well prepared yesterday in the way we presented things. \n\nIt seems to me that everything was too improvised and insufficiently coordinated: we presented ourselves with a remarkable lack of figure. Naturally, do not see in this letter any harsh criticism or bad mood directed against you. On the one hand, I am largely responsible myself and on the other hand everything can easily be corrected. I was obviously disconcerted and embarrassed to hear you speak of constraint. \n\nHad you warned me beforehand, I would have told you that you were heading toward very serious difficulties, and I am not even speaking of the objections raised yesterday. \n\nFurthermore, the use of the word biologism seems dangerous to me. As far as I am concerned, it appears only partially true and demands serious reservations. It seems necessary to remedy all this rather quickly and I propose that we prepare a text signed jointly by both of us, one that could be read at the beginning of the next meeting and later serve as the preface to the bibliography — a text as precise as possible defining point by point what we think, using short and very clear formulas capable of being repeated insistently. \n\nCould you, by Thursday for example, find two or three formulas that seem expressive of what we both think. I shall search on my side as well. Needless to say that my own lecture appears to me just as vulnerable as yours to the essential criticism I make of yesterday's meeting: it was in no way capable of giving us a figure. \n\nBelieve in all my friendship, \nGeorges Bataille. \n\nPostmark: 21 November 1937. Addressed in blue pencil to Roger Caillois, professor at the Boys' Lycée, 57 Boulevard de la Gare, Beauvais, Oise.",

id:79,
sender:"Georges Bataille",
recipient:"Roger Caillois",
date:"December 8, 1937",
subject:"We Must Construct First",
body:"My dear Caillois, \n\nThe worst thing in what you tell me is certainly your state of health. I hope that you will rest and reach a condition both more practical and less unpleasant. I do not think as you do that there would have been an advantage in turning Kojève's argumentation against Hegel himself. The fact that Hegel perhaps failed to satisfy his own requirements is not sufficient to abolish those requirements for others. \n\nI myself had planned to speak in this direction and abandoned the idea at the last moment because it seemed to me that Kojève's argument excluded such a possibility. This is not to say that I am satisfied with my own response, which I must admit was too long and badly articulated. I have rewritten it in a very different form. \n\nAs for what I said at the end, it amounted essentially to saying that one must begin by constructing and only afterwards discover what the construction signifies. I am surprised only that you remind me of my original declaration concerning elective communities. I believe I had already spoken to you of this in advance and there was obviously nothing more in my declaration than a way of situating the investigation, something always done when speaking of others and which can equally be done concerning oneself, especially when putting forward data already employed by predecessors such as Espinas and Durkheim in the direction of traditional community. I add that I have absolutely no intention of retreating from what I said in the declaration that troubles you — namely that \n\nI intend henceforth to remain on the plane occupied by science, though without introducing the slightest taboo. If it is possible to remain rigorously faithful to such a principle within a lecture, discussion itself can nevertheless lead, as happened concerning Hegel and in your presence, toward revisiting the foundations and consequences of an inquiry. I do not suppose however that future lectures will produce such developments. \n\nOn the contrary, I wish to specify that for my part I intend principally to develop — with the exception of a section concerning the army — results that are personal to me, or at least elaborations not already found in books. In particular, unless you see some inconvenience in it, I intend next Saturday, following what you will say, to demonstrate an insufficiency in Rabaud's theory and attempt to found the distinction between animal societies and human societies upon fairly precise data. \n\nNaturally I agree with you that we must return regularly to Kojève's objections. But the principal objection escaped you both and was communicated to me afterwards by an attendee who had kept it to himself: namely that the laws of nature themselves exist within development, that they are therefore valid only for limited periods, that perhaps there are no invariants, and that all sciences except mathematics may exist under conditions similar to sociology. As for the arrangement of the sessions, it is obvious that we must eventually regulate them. Yet distinctions must be made according to circumstances: do you believe it was easy to respond to Kojève? It also seems to me that next time I shall require twenty minutes. Forty minutes would still remain for discussion. But unless some unforeseen event prevents us from consulting one another, I would prefer to do nothing except in agreement with you. The Monnerot question is another matter. On my part there was negligence and forgetfulness. We are no longer at a stage where one can hide too rigorously behind such explanations, but it nevertheless remains true that I had no intention of acting in such a way and that I am generally as forgetful as anyone else. \n\nHad I truly intended something, I would not have attempted two days later to repair matters and apologize. I am also prepared to recognize that I have often adopted an unpleasant attitude toward Monnerot, but if on two occasions I refrained from breaking with him entirely, it was through patience, and I have even been told that such patience resembled cowardice. I disagreed. I regularly informed Monnerot of what we were undertaking. \n\nNevertheless I was not very inclined to request a lecture from him, first because of the inadmissible manner in which he conducted himself during the Nietzsche meeting last March, and secondly because he originally told me that he possessed no particular competence and that it was for you and me to deliver the lectures. I do not believe that the meeting you propose makes much sense: I think it risks only placing Monnerot in an absurd position and I do not desire this. Read this to him if you wish. \n\nI expect you in any case Thursday the 16th at 5:30. Affectionately yours, \nGeorges Bataille. \n\nP.S. — I do not believe this letter expresses any acrimony whatsoever. Someone reading it might imagine something other than cordiality between us and as far as I am concerned such an impression would be the opposite of reality. I think only of acting in agreement with you and see nothing capable of obstructing that. \n\nThere is only one exception concerning Monnerot. I shall explain to you why what I have said regarding him may appear insane even to me, as though resulting from excessive patience. After all Monnerot generally approaches things with such irregularity that concerning oneself with regularity where he is concerned possesses something truly miserable about it.",

date:"March 2-3, 1938",
subject:"Notes On Secret Societies",
body:"My dear Bataille, \n\nHere are the promised notes on secret societies. You will probably find them too summary and schematic. \n\nBut all things considered I believe them rich and easily developable. I am more and more struck by the importance of this point of view and by the ease it provides for classifying every kind of thing. The construction owes almost everything to Dumézil. I have merely abstracted and generalized. \n\nIt is important to say so and to refer to Dumézil's works, especially The Centaurs and Brahman-Flamen, as well as to his lectures this year. I have not been able to provide precise examples to flesh out the schema because Dumézil naturally does not wish the details of his research to enter the public domain. Return these two pages to me rather quickly, would you. I would like to work on them further. \n\nBring them to Saturday's session. If I am in Paris, I shall make an appearance and comment on them myself, though the chances are one in a thousand. I would very much like news of the Collège. \n\nWould you write to me as fully as possible describing how things went last time and how they go on Saturday? \n\nYours sincerely, \nR.C. \n\nP.S. — Where do you stand with your article for the N.R.F.? I have proposed to Gallimard a collection entitled Tyrants And Tyrannies — studies on the extreme forms of power. What do you think?",
replies:[]

subject:"Editorial Notes On Caillois Letter",
body:"The letter published by Hollier in volume II of the Oeuvres Complètes is reproduced in Le Collège de Sociologie with the erroneous date '3 February 1938'. The references to Dumézil concern the latter's Indo-European mythological research, especially The Problem of the Centaurs and Flamen-Brahman. Bataille would later read and comment upon these notes publicly during the Collège session of 19 March 1938. The material became central to the emerging theoretical construction concerning secret societies, sovereignty, and sacred structures. Caillois also alludes to the future N.R.F. issue in which texts by Bataille, Leiris, and himself would appear.\n\nPublished in O.C. t. II, pp. 452-453; reproduced in Le Collège de Sociologie, pp. 276-277."

id:104,
sender:"Georges Bataille",
recipient:"Roger Caillois",
date:"March 3, 1938",
subject:"Secret Societies And Sacred Sociology",
body:"My dear Caillois, \n\nThe note you sent me corresponds, as much as I could have wished, both to what we have to say in particular, as I believe, and to the March 19 lecture on secret societies. I am going to copy your note over the next few days and send it back to you. It seems to me there would be great interest first in your developing this material further, and second in our gathering texts on the same subject into a special issue, which Acéphale could easily produce since we have nothing else at the moment. \n\nI even regret that this cannot be done immediately; and if it interested you, if you sent me a text within the next fifteen days, publication in April could be envisaged. But let me know immediately in that case. \n\nI should tell you that Saturday's meeting is devoted to the army — your letter makes me think you believed it already concerned secret societies. I am writing, with great difficulty, the article for Paulhan and expect to finish it next week. Your project for Gallimard seems to me all the better because it concerns a collection title with undeniable commercial quality. I should add that after looking more closely at what I might do, how I could present the doctrine I have developed as a whole, I realized I could not initially give it an exclusively scientific turn, precisely because I must give a very large place to the analysis of fascism. \n\nI would therefore propose for this collection, if Gallimard accepts, a book composed essentially of the two Critique sociale articles — the second made more intelligible — preceded by a long introduction, almost entirely written, on the present development of fascism, its meaning and its consequences. \n\nThe title I had thought of, The Tragic Destiny, which alludes to the opposition between the symbols of the crucified man, the slain king, and the lictor's axe, would not suit such a collection, but the subtitle I had planned, Essay In Sacred Sociology Of Fascist Europe, perhaps allows you to mention it. \n\nThere is no need, if you judge it preferable, to insist upon the word sacred. I am postponing until later a short and very systematic exposition of the same doctrine. \n\nAffectionately yours, \nGeorges Bataille\n\nPostmark: 3 III 1938."
},

subject:"Editorial Notes On Secret Societies And Sacred Sociology",
body:"The point concerning Saturday's meeting is written in the margin by Bataille. The letter is undated. Postmark: 3 III 1938. Addressed to Vitry-sur-Seine. On the envelope, in Bataille's hand: 'Please forward.' The reference to March 19 was inserted later between the lines. Bataille's manuscript bears in red pencil the title 'Secret Society', whereas Caillois had planned the title 'Confraternities, Orders, Secret Societies, Churches' for the lecture. Bataille later emphasized that the secret society was linked to a sacred founded upon the eruptive violation of the rules of life, a sacred that expends itself. He also stressed collective ecstasy and death. The projected special issue of Acéphale on eroticism never appeared, despite prior announcements. Bataille's article for Paulhan would eventually appear in the July 1938 issue of the Nouvelle Revue Française within the collective section 'Pour un Collège de Sociologie'. The proposed Gallimard collection 'Tyrants and Tyrannies' never materialized, though it was intended to include works on Cheu Hoang-Ti and Heliogabalus. Bataille's references to the Critique sociale articles concern 'The Problem Of The State' and 'The Psychological Structure Of Fascism', texts he considered preliminary and methodologically incomplete. The projected book The Tragic Destiny would have connected the crucified figure, the murdered king, and the lictor's axe into a theory of sacred sovereignty and fascist power. Bataille never completed the short and systematic exposition of this doctrine he mentions at the end of the letter.\n\nTimestamp: Editorial commentary attached to letter of 3 III 1938. O.C. t. II, pp. 349-361, 436, 452-453; Le Collège de Sociologie, pp. 268-290.",

subject:"Paulhan, The N.R.F., And The Article On Sacred Sociology",
body:"My dear Caillois, \n\nI received a note from Paulhan. Despite the inconveniences, it seems to me that July would be better than October, though this is only of secondary importance. You will see Paulhan before I do and you need only decide without taking into account what I tell you if some serious reason seems to favor October. \n\nIn the end October is better for us, but it is necessary to evaluate the chances of change before then — including the chances of general changes, such as war. Concerning the offprint, Paulhan spoke to me about it himself the first time: he was supposed to ask Hirsch, I believe. If it should involve expenses or the surrender of author's rights, it still seems to me worthwhile. I intend to try to revise my article. I would be glad if you could read it beforehand and tell me what you think. \n\nI will come Friday at 5:30 to Flore. If you see Paulhan before then, would you ask him for my manuscript. I am writing to warn him. Colette unfortunately is not any better: at the moment she is suffering from neuritis. \n\nAffectionately yours, \nGeorges Bataille. \n\nFinally impossible to come Friday. Could you instead come to my place Wednesday evening at 9 o'clock, June 25. I am asking Kojève, Wahl, Benval to come in order to see what is possible for continuing.\n\nLetter on Bibliothèque Nationale stationery. Circa Tuesday 17 May 1938."

body:"Bataille writes to Caillois after a recent Collège de Sociologie session attended by a large audience, including Julien Benda. He reports that nothing alarming occurred and turns immediately to organizing the second trimester program. Proposed lectures include Guastalla on 10 January, Bataille himself on Hitler and the Teutonic Order on 25 January, Levitsky in February, and another Bataille lecture on Mardi Gras and its decline. Bataille explains that his lecture on Hitler would begin from occultist oppositions between the Teutonic Order and the Temple while insisting on the real significance of the Nazi Ordensburgen — elite schools for future Führers organized in a quasi-sacred military spirit. These institutions, he argues, require an intellectual and symbolic response from those refusing fascist domination. He further develops the idea that the decadence of Mardi Gras corresponds to the homogenization of time, whereas war represents a catastrophic rupture increasingly difficult to attain within homogeneous modern temporality. Bataille also discusses possible future interventions by Paulhan, Klossowski, Leiris, Duthuit, and Granet, and mentions a projected book gathering lectures connected to the September crisis and contemporary political transformations.\n\nTimestamp: Cachet de la poste : 18 XII 1938. Adresse : Monsieur Roger Caillois / 2 rue Parmentier / Vitry / (Seine).\nLocation: 59 bis rue de Mareil",
},

{
id:117,
sender:"Georges Bataille",
recipient:"Roger Caillois",
date:"Saturday, 17 December 1938",
subject:"Second Trimester Program Of The Collège De Sociologie",
body:"Dear Caillois,\n\nI am waiting for news from you and hope that you have encountered nothing serious. I must bring you up to date on where we stand; nothing but normality the other day, a great many people and nothing, I suppose, that put anyone off (Julien Benda, from what I am told, entirely pleased, and I desperately trying not to agree with him...).\n\nIn any case I am not writing to you for that reason, but in order to arrive at the printing of the second trimester.\n\nI propose the following:\n\n10 January — Guastalla.\n\n25 January — Myself, on Hitler and the Teutonic Order. It is the continuation of what I said the other day. The idea is to begin from the opposition constructed by people in the occultist vein between the Teutonic Order and the Temple, to admit that Hitler’s affiliation with the Teutonic Order is probably ‘mythical,’ but that the institution of the Ordensburgen — schools for Führers built and instituted in a spirit at least akin to that of the military orders — is not mythical, and that the Ordensburgen demand a response from those who do not wish to submit to the domination of a power they do not recognize, etc.\n\n7 February — Levitsky (he cannot begin earlier).\n\n21 February — It is Mardi Gras. I propose myself, on that occasion, to give a lecture on Mardi Gras and its decadence.\n\n7 March — Perhaps Paulhan: he must give me a definite answer next Thursday; in any case he could not do 21 March, because of the publication of the N.R.F., which gives him too much work at that date (nor could he do 7 February).\n\n21 March — Levitsky, the second lecture.\n\nWould you either telephone me so that we may arrange to meet, preferably early in the morning at Saint-Germain 13-23 — I have just been ill and will not be at the library Monday nor perhaps Tuesday — or else write to me at 59 bis rue de Mareil.\n\nI proposed to Paulhan that we rapidly make a book using the two or three lectures touching more or less directly on the events of September: he was to speak of it to Gallimard.\n\nThe lecture on Mardi Gras would in principle belong to the same series (the decadence of Mardi Gras corresponding to the homogenization of time, war representing a level all the more difficult to attain insofar as time has become homogeneous).\n\nThere would remain six lectures to foresee for the third trimester: there would then be Klossowski, Leiris, Duthuit, perhaps even Granet.\n\nSince Paulhan does not seem pressed, nor Levitsky either, it is not excluded that things might be arranged in the following way: January, Guastalla and myself; February, Klossowski and myself; March, Levitsky twice. Paulhan, on the contrary, does not seem likely to be annoyed by a delay.\n\nGive me quickly a precise response on all this.\n\nIn any case let me know as soon as possible Guastalla’s address, since I was unable to see him last Tuesday. It is very important (at worst I could begin myself on 10 January, but...). In any case I expressly intend to invite Kojève to come that day and to speak at considerable length.\n\nIt is not impossible to give a great deal of importance, of consequence, to a lecture of this sort on the miseries of literature.\n\nSee you soon.\n\nGeorges Bataille\n\nI am reading this letter to Leiris, who thinks that two lectures in succession between the two by Levitsky is too much. The second solution would perhaps be the better one, or something close to it (Paulhan postponed to the third trimester).\n\nCachet de la poste : 18.XII.1938. Adresse : Monsieur Roger Caillois / 2 rue Parmentier / Vitry / (Seine)."
},

subject:"Editorial Notes — Letter 21",
body:"Letter written in grey pencil. ‘Saturday 17’ overwritten on ‘Thursday 15’.\n\nThe letter follows the Collège de Sociologie session of Tuesday 13 December 1938 during which Bataille delivered ‘La structure des démocraties.’ Bertrand d’Astorg later described the session as crowded and intellectually tense.\n\nJulien Benda intervened in the discussion and reportedly expressed satisfaction, while Bataille attempted ‘desperately not to agree with him.’\n\nThe principal concern of the letter is the projected second trimester schedule of the Collège de Sociologie for January–March 1939.\n\nThe projected lectures included:\n— René Guastalla: ‘Naissance de la littérature.’\n— Georges Bataille: ‘Hitler et l’ordre teutonique.’\n— Alexandre Levitsky: ‘Le chamanisme.’\n— Pierre Klossowski: ‘Le marquis de Sade et la révolution.’\n— Georges Bataille: ‘Commémoration du Mardi gras.’\n\nBataille sketches the argument for his lecture on Hitler and the Teutonic Order: beginning from occultist mythologies linking Nazism to medieval military orders while focusing concretely on the Nazi Ordensburgen and their symbolic-political function.\n\nThe Mardi Gras lecture was intended as an analysis of the decadence of festival under modern homogeneous time.\n\nBataille also discusses with Caillois and Paulhan a possible Gallimard volume assembling lectures connected to the September 1938 crisis and the political-sacral mutations of Europe.\n\nMentioned future participants include Klossowski, Leiris, Duthuit, Levitsky, Guastalla, Paulhan, Kojève and possibly Marcel Granet.\n\nThe final postscript records Michel Leiris’ opinion that placing two lectures between Levitsky’s two sessions would overload the structure of the trimester.\n\nCachet de la poste : 18.XII.1938.\nAdresse : Monsieur Roger Caillois / 2 rue Parmentier / Vitry / (Seine)."
},

subject:"On Your Article, Political Competence, And The Collège",
body:"My dear Caillois,\n\nThere are excellent developments in your article, and I should add immediately that I am not at all worried by what you said about communism (I certainly would not say the same things as you and, as I already expressed to you, I think your attitude in this respect belongs to what you call your ‘total political incompetence’ — though the few sentences in your conclusion are not lacking in prudence).\n\nWhat I dislike in the article is its extreme unevenness, the cracks running through it: in this respect it seems clearly inferior to what you usually write.\n\nBut above all, I am very surprised by the defensive tone you adopt, which contrasts with what you seem naturally to be. I still cannot imagine that the fly-legs scribblings of Calamaris could have shaken you to such a point.\n\nAnd how did you finally come to write such an astonishingly humble preface? I no longer understand. Your ‘total political incompetence’!\n\nI have already used the expression against you myself, but it is understood that this was a joke.\n\nVery seriously, I do not recognize your right to speak this way. You may sometimes misjudge things, no doubt, but what would we signify and why would we speak at all if we did not possess, at bottom, a competence more real than that of politicians.\n\nSuch a preface does not excuse you: it accentuates what is deficient in the article.\n\nThe worst is that you end up extending the incompetence of your personal case to the sociologist in general, which implicates the Collège de Sociologie itself: there is something there about which it would have been better had we reached an agreement beforehand.\n\nIf there is still time, could you not envisage, on this last point, a formula that engages only yourself?\n\nI confess moreover that the pure and simple suppression — indeed the suppression of the entire preface — would seem to me likely to make the article less weak.\n\nBelieve in all my friendship,\n\nGeorges Bataille\n\nLeiris agrees with the sentence: ‘these matters concern politicians and not the sociologist.’\n\nEditorial notes:\n\nBataille reacts critically to an article by Roger Caillois concerning communism and political responsibility.\n\nWhile praising several passages, he criticizes what he perceives as the article’s structural weakness, defensive tone, and excessive humility.\n\nThe principal disagreement concerns Caillois’ declaration of ‘total political incompetence,’ which Bataille regards as strategically and theoretically dangerous.\n\nBataille objects in particular to the extension of personal political uncertainty into a generalized sociological incapacity.\n\nFor Bataille, the sociologist possesses a competence more fundamental than that of professional politicians, and such disclaimers compromise not only Caillois personally but the intellectual legitimacy of the Collège de Sociologie itself.\n\nThe mocking expression ‘the fly-leg scribblings of Calamaris’ apparently refers to hostile annotations or criticism that, in Bataille’s view, should not have shaken Caillois’ confidence.\n\nPostmark: 25 January 1939, 15:30.\nAddressed to: Monsieur Roger Caillois / 2 rue Parmentier / Vitry / (Seine)."
},

body:"‘Calamaris’ refers ironically to Nicolas Calas (Nicos Calamaris), Greek surrealist writer and former member of the Marat group within Contre-Attaque.\n\nLiving in Paris between 1934 and 1939, Calas collaborated with the surrealist movement and published Foyers d’incendie in 1938.\n\nIn the surrealist bulletin Clé, Calas attacked the Collège de Sociologie, accusing Bataille, Caillois and Leiris of proposing a vague ‘center of energy’ without explaining either its creation or its practical use.\n\nHe mocked the group’s rhetoric concerning ‘absolute lies of political forms’ and suggested that the declarations of the Collège resembled authoritarian slogans.\n\nBataille’s expression ‘the fly-leg scribblings of Calamaris’ dismisses these criticisms as petty annotations unworthy of seriously unsettling Caillois."

recipient:"Roger Caillois",
date:"17 March 1939",
subject:"The New Defenestration Of Prague",
body:"My dear Caillois,\n\nFrom various sources I learn that people were bored to the extreme last Tuesday. Things must be taken as they are. This changes nothing for me regarding the value of Lewitsky’s lecture, but...\n\nDo you see any inconvenience in sending people the following note:\n\n‘Because of current events, Lewitsky’s lecture on Shamanism opening the meeting of 21 March 1939 will be followed by a lecture by Bataille on ...’\n\nI would renounce making a conclusion spoken in the name of the Collège, which is always complicated.\n\nI would simply make a short lecture in my own name entitled: ‘The New Defenestration of Prague.’\n\nI would like to return to the principles of the Second Declaration — abandoned — which represented fear as the only sacred force remaining within democracies.\n\nTo show that without hope there is only nonsense and depression.\n\nThen to define the Collège de Sociologie as an introduction to a new practice. Therefore not only teaching, but already almost education.\n\nFirst of all, to make people understand clearly that what they presently are is nothing anymore: in Prague they have just been defenestrated. Our role is to force our contemporaries to understand that they are a nullity.\n\nI would then put forward two political principles of sacred sociology.\n\nI. That if everything which feels the need to serve a sacred cause is rejected toward the extremes (right or left), society decays.\n\nIn certain cases, it is necessary for the life of society that the forces thus dispersed be concentrated.\n\nIn any case, according to me, this is what is necessary and what only people like us are capable of doing.\n\nII. That the development of economic institutions engenders slavery or moves toward slavery; that it is useless to cooperate with a development produced by the necessity of things; that it would be madness to oppose it directly; that one must create an organization incapable of being enslaved, an irreducible nucleus under any eventuality, around which existence in its integrity could be recomposed.\n\nI would finish by saying that there is no longer any place in the world for inorganic crowds; that place must be given to what alone possesses the power to organize life — namely the sacred, that which enters into its orbit, that which grows organically like a storm concentration.\n\nWe can speak again about all this Tuesday at dinner (still 7 o’clock, Pré aux Clercs).\n\nIf you do not send me a pneumatic reply immediately to the library or, preferably, telephone me tomorrow before 2:30, we will send the little note.\n\n(If we do not do this, I think there will be VERY FEW PEOPLE next Tuesday and, believe me, I have not yet been wrong about such things.)\n\nBelieve in all my friendship,\n\nGeorges Bataille\n\nPneumatic letter.\nPostmark (Rue Sainte-Anne): 17 March 1939, 17:15.\nAddressed to Vitry-sur-Seine."
},

subject:"Notes on Lewitsky, Prague, and the Second Declaration",
body:"Jean Guérin (Paulhan) announces in the N.R.F. Bulletin: 'Tuesday 7 and 21 March: Shamanism, by A. Levitsky.' Roger Caillois would later publish the posthumous text of these two lectures in January 1957 in Diogène under the title 'Myths and Rites of Shamanism.'\n\nCaillois later recalled:\n\n'Levitsky gave two lectures on shamanism. The issue interested me enormously because there was a complete antinomy between magic and religion. Magic is a theurgic act that forces supernatural powers to submit, whereas religion is essentially submission to God. At that time I felt very Luciferian; I considered Lucifer the effective rebel. Thus shamanism mattered to me as a synthesis between religious powers and infernal powers. Bataille, for his part, was in roughly the same disposition. The difference was that Bataille truly wanted to become a shaman.'\n\nOn Anatole Lewitsky (1901–1942), Caillois and Bataille, see Hollier, Le Collège, pp. 421–446.\n\nThe abrupt 'But...' in Bataille’s letter refers to current events:\n\n1. During the night of 14–15 March 1939, German troops entered Prague.\n2. Monnerot’s Enquiry on 'directors of conscience' had just appeared in Volontés.\n\nThe 'Second Declaration — abandoned' refers to a planned but unpublished declaration of the Collège following the first declaration on the international crisis dated 7 October 1938.\n\nIn that first declaration, Caillois had already emphasized fear as a sacred political force within democracies:\n\n'A people that refuses to admit war among the possibilities of its politics necessarily adopts an attitude of fear and consciousness of inferiority before a nation that founds its politics upon it.'\n\nPaulhan added in the N.R.F. Bulletin after Munich:\n\n'Peace has been saved. Peace in what is most flat and most perishable within it.'\n\nBataille’s formula defining the Collège as 'not only teaching, but already almost education' echoes the original founding note of March 1937, where the Collège was imagined not merely as a circle of studies but as a possible nucleus of collective energy.\n\nNeither the circular notice ('papier') announced in the letter nor the lecture entitled 'The New Defenestration of Prague' has been found."
},

date:"22 March 1939",
subject:"Third Trimester Program, Granet, and the Direction of the Collège",
body:"My dear Caillois,\n\nWe must arrange the distribution of the third trimester program by April 1st, since a text has to be delivered to the printer by then. Our long conversation yesterday prevented us from speaking about immediate matters. Here is how things currently stand.\n\nEverything is settled for:\n\n18 April — Hans Mayer.\n2 May — yourself.\n16 May — Paulhan.\n6 June — myself.\n\nThat leaves 20 June and 4 July.\n\nFirst there is Duthuit. But the question of Granet remains unresolved. I spoke about it with Duthuit, who thinks one of us should go see him — preferably you, since you alone possess credentials likely to reassure Granet.\n\nHere is what I propose.\n\nYou should go see Granet as soon as possible and offer him either 6 June or 20 June — though 20 June would obviously be preferable for me. If he accepts, Duthuit should postpone his lecture until October. Otherwise Duthuit will speak on 20 June.\n\nAs for the final meeting, here is what I am considering.\n\nIt should be devoted to the Collège de Sociologie itself — its definition, its aims, its methods.\n\nFor this purpose Leiris, you, and I would speak successively — naturally allowing Leiris more time if necessary, since he has not yet spoken, but in principle half an hour each.\n\nOf course, this would require serious coordination among us. Afterwards our lectures could perhaps be published by Sur.\n\nI shall go Thursday to the N.R.F. at 6:30 to see Paulhan. If you telephone me or send me a note I can easily come to the little café at the corner of rue de Beaune at 5:30. That would be useful. Otherwise: Wednesday the 28th, 5:30, Balzard.\n\nWhat I told you yesterday concerning intellectual probity associated with mystical experience — this is a deliberate position. I do not think that you yourself will be able to avoid such a position forever.\n\nRigour will inevitably consist, sooner or later, in choosing.\n\nI confess that I often feel impatient when I think about the immense intellectual laxity that reigns everywhere, preventing essential problems from even being posed within people's minds.\n\nNietzsche, for example, managed to speak and clarify a great many questions, yet there is no trace of this within contemporary minds.\n\nWhat has been acquired disappears as new acquisitions accumulate in ever-growing obscurity. Everything contributes to the absence of clarity, which in turn authorizes the gross simplifications we are fighting against.\n\nWe ourselves fight partly within obscurity.\n\nIsn't that somewhat anguishing?\n\nAffectionately,\nGeorges Bataille\n\nTimestamp: Postmark: 22 March 1939, 15:45. Addressed to Vitry-sur-Seine.\nLocation: Saint-Germain-en-Laye, 59 bis rue de Mareil",
},

{
id:133,
sender:"Zeitgeist RSS Feed",
recipient:"Self / Collège de Sociologie File",
date:"March–April 1939",
subject:"Editorial Notes on the Third Trimester of the Collège de Sociologie",
body:"See the program of the Collège de Sociologie for the '1938–1939 academic year — Third Trimester.'\n\nHans Mayer was announced for 18 April. In a later letter to Denis Hollier, Mayer wrote:\n\n'What troubles me most in this memory is your date of 18 April. I rather remember that my lecture had expressly been planned as the final meeting before the summer holidays (...) though this may very well be confusion on my part.'\n\nRoger Caillois was scheduled for 2 May with a lecture entitled 'Festival' ('La fête'). This lecture would later become one of the major surviving texts of the Collège.\n\nPaulhan’s participation had gradually taken shape over several months. In October 1938 Caillois proposed that he speak at the Collège. Paulhan answered that he would gladly do so, suggesting the title 'On Sacred Language.' By February 1939 he confirmed that he wished to give the lecture in May.\n\nThe lecture, later published under the title 'D’un langage sacré,' does not appear in Paulhan’s collected works but survives in the Cahiers Jean Paulhan and in a Spanish translation published in Sur in February 1940.\n\nDuthuit’s lecture also appears to have genuinely taken place, despite the lack of surviving text. Hollier remained uncertain, but both Michel Leiris and Georges Bataille later explicitly referred to Duthuit as having spoken at the Collège. In a 1943 letter to André Breton, Duthuit himself recalled that participants successively presented ideas on shamanism, coronation ceremonies, and related themes.\n\nThe 'question of Granet' mentioned by Bataille seems ultimately to have ended in refusal. Marcel Granet never appears in the final program.\n\nThe projected final session devoted to the Collège itself reveals that, by spring 1939, its members were already attempting to define retrospectively what the institution had become: its methods, aims, and possible continuation.\n\nAlthough the Collège effectively dissolved with the approach of war, its members still believed in March 1939 that activities might resume in autumn. Leiris even suggested organizing a congress for the rentrée.\n\nBataille’s remark concerning 'intellectual probity associated with mystical experience' directly anticipates themes developed in the final issue of Acéphale ('The Practice of Joy Before Death,' June 1939), where mystical experience and intellectual rigor are explicitly linked.\n\nHis complaint about Nietzsche is equally significant:\n\n'Nietzsche managed to clarify a great many questions, yet there is no trace of this within contemporary minds.'\n\nThis frustration with the disappearance of intellectual acquisitions into increasing obscurity becomes central to Bataille’s late-1930s reflections on fascism, sacred sociology, and collective experience.\n\nThe final lines of the letter suggest a latent tension with Caillois himself. In the fifth and final issue of Acéphale, Bataille violently attacks those who merely speak about fulfillment and sacred experience without actually living them. It is possible that Caillois is partially targeted by this criticism."
},

body:"COLLÈGE DE SOCIOLOGIE\nACADEMIC YEAR 1938–1939 — THIRD TRIMESTER\n\nTuesday, 18 April 1939\nTHE RITES OF POLITICAL ASSOCIATIONS IN ROMANTIC GERMANY,\nby Hans Mayer\n\nTuesday, 2 May 1939\nTHEORY OF FESTIVAL,\nby Roger Caillois\n\nTuesday, 16 May 1939\nSACRED LANGUAGE,\nby Jean Paulhan\n\nTuesday, 6 June 1939\nJOY BEFORE DEATH,\nby Georges Bataille\n\nTuesday, 20 June 1939\nTHE MYTH OF THE ENGLISH MONARCHY,\nby Georges Duthuit\n\nTuesday, 4 July 1939\nTHE COLLÈGE DE SOCIOLOGIE,\nby Georges Bataille, Roger Caillois, and Michel Leiris\n\nMeetings take place in the Salle des Galeries du Livre,\n15 rue Gay-Lussac (5th arrondissement), at 9:00 PM.\n\nAdmission: 4 francs.\nQuarterly subscription: 15 francs.\n\n[Plate II: Second program of the Collège de Sociologie — 'Third Trimester' of activity]\n\nEditorial Notes:\n\nBataille later dated 'Nietzsche’s Madness' (published in the fifth and final issue of Acéphale, June 1939) to '3 January 1939.' In his later correspondence with Caillois he would continue insisting on the necessity of claiming Nietzsche as an active force rather than a merely literary reference.\n\nThe closing collective session scheduled for 4 July 1939 is particularly significant: the Collège turns reflexively upon itself, attempting to define its own methods, aims, and meaning shortly before the outbreak of war.\n\nThe proximity between Bataille and Caillois during this period is underscored by the fact that the preface to Caillois’s L’Homme et le sacré is dated 31 March 1939 and explicitly expresses gratitude toward Bataille, speaking of an intellectual 'osmosis' between them concerning the problem of the sacred."

subject:"Joy Before Death — Outline of Tonight’s Lecture",
body:"My dear friend,\n\nForgive my delay.\n\nMy lecture will begin from the principle that society gravitates around nuclei formed by bonds of the heart — something I shall present as the very principle of the Collège’s activity.\n\nThen, speaking in my own name, I shall attempt to show that these nuclei are formed by 'men of death,' men who give meaning to death.\n\nDescribing the various attitudes toward death that have been imposed upon humanity, I shall argue that joy alone belongs to lucid man.\n\nFinally, I shall try to establish a relation between the different forms of the accumulation–expenditure complex and attitudes toward death:\n\n- economy of salvation = economy of accumulation;\n- 'joy before death' linked to a conscious will toward expenditure, consequently producing a struggle between the forces of expenditure and the forces of accumulation.\n\nOverall, I shall attempt to make clear that the problem of death is the essential problem for mankind.\n\nSee you this evening.\nAffectionately yours,\nGeorges Bataille\n\nTimestamp: Pneumatic post. Postmark: 6 June 1939. Addressed to Vitry-sur-Seine.",

date:"June–July 1939",
subject:"Editorial Notes on 'Joy Before Death' and the Crisis of the Collège",
body:"'Joy Before Death' was delivered at the Collège de Sociologie on Tuesday 6 June 1939. Georges Duthuit later referred explicitly to this lecture in his 1943 letter to André Breton.\n\nThe lecture also corresponds directly to the text published in the fifth and final issue of Acéphale (Folie, guerre et mort, 1939): 'The Practice of Joy Before Death.'\n\nThe formula had already appeared earlier in Bataille’s notes:\n\n'Joy before death against every immortality.'\n\nThe argument outlined in Bataille’s pneumatic letter survives only in fragmentary manuscript form. These surviving fragments revolve around several central oppositions:\n\n- accumulation versus expenditure;\n- economies of salvation versus sacrificial economies;\n- fear of death versus lucid joy before death;\n- social conservation versus sovereign expenditure.\n\nThe lecture marks a decisive turning point inside the Collège de Sociologie.\n\nOn 4 July 1939, Bataille openly acknowledged the emerging rupture:\n\n'The importance I grant to mysticism, drama, madness, and death appears to Caillois difficult to reconcile with the principles from which we began.'\n\nHe adds that Paulhan and Jean Wahl expressed similar reservations.\n\nDuthuit would later summarize the tension with remarkable precision:\n\n'Bataille, unlike our enemies, believed that everyone must practice upon himself the experiences leading simultaneously toward joy and death, and not upon others.'\n\nAt this point the Collège begins shifting from a sociology of the sacred toward what Bataille himself calls a 'secret society.'\n\nPierre Waldberg later judged this phase harshly:\n\n'Without doubt one must disqualify the entire part of our activity whose theme was \"joy before death.\" More than anywhere else, we gravely failed both humor and dignity there.'\n\nSeventeen days after this lecture, on 23 June 1939, Roger Caillois departed for Argentina to give lectures on mythology. Bataille still believed he would return in September.\n\nHe did not return to France until August 1945.\n\nThis departure effectively marks the beginning of the dissolution of the Collège de Sociologie."
},

{
id:137,
sender:"Georges Bataille",
recipient:"Roger Caillois",
date:"20 July 1939",
subject:"On the crisis of the Collège, mysticism, sacrifice, and spiritual power",
body:"My dear Caillois,\n\nYou placed me in a very difficult situation. Either your message was read publicly and I had to explain the extent of my disagreement and criticism — without your being there to answer — or else I had to take the initiative not to read it, contrary to what had been agreed.\n\nThe situation in fact became considerably worse at the last moment: Leiris, giving up speaking the day before the meeting, handed me a letter expressing the full extent of his disagreement with us.\n\nI read Leiris’s letter after first having an oral explanation with him. That explanation allowed us to say that an essential agreement still remained. Since then everything has become much clearer on that side and all misunderstandings seem dissipated. It was, exactly, a question of methodology, and on this point many things will undoubtedly have to be clarified.\n\nAs for your own message, I think everything will remain imprecise until there has been between us a similar oral explanation.\n\nYour text was not read.\n\nI explained that profound difficulties existed between you and me; that I would not directly attack the terms which raised those difficulties; and that I would speak only about the underlying issue itself.\n\nYou proposed as the basis of an 'official doctrine':\n\n1. your theory of composite beings;\n2. the opposition between the sacred and the profane in relation to self-giving for the benefit of a larger being.\n\nI developed this theory of beings in the direction of the problematic of self-sacrifice.\n\nI tried to show that from this there necessarily emerge needs for drama — and under conditions such that it seems impossible to settle the question before grasping its entire significance.\n\nI did not, moreover, speak exactly of drama, but rather of expenditure, loss, sacrificial madness.\n\nNaturally I did not formulate any criticism of your position. I merely defended myself after explaining that 'the place I give to mysticism, drama, madness and death' appeared to you 'difficult to reconcile with the principles from which we begin.' I added that you were not alone in feeling this incompatibility with unease; that Paulhan and Wahl at least shared it.\n\nI do not think you could seriously contest that the question I raised that day possesses meaning.\n\nTo tell the truth, if you truly wished to see what I mean, you could perceive it quite easily. My insistence on claiming Nietzsche as my reference alone indicates the direction I am moving toward.\n\nI seek, as much as anyone, a domination over what is monstrous — but only on the condition that what is dominated is not some foreign reality, but precisely what is recognized as oneself and liberated in festivals.\n\nI am obviously trying to make possible certain states of consciousness belonging to the order of festival, and it is true that this is something important for me.\n\nGiven how easily discernible this position is, I cannot understand why you feel obliged to oppose me so seriously. I express myself clearly enough for you to grasp these intentions — unless perhaps you grasp more readily whatever seems to justify hostility toward me.\n\nThis answers the portion of your 'examination of conscience' concerning cheap cerebral agitation.\n\nAs for your insistence on the necessity of reserve, your message remains so imprecise and gives so little impression of a practical method that it is very difficult for me to discuss it.\n\nI suppose you regret having written 'The Winter Wind.' And naturally I do not doubt the anxiety provoked in you by my 'apocalyptic' accents.\n\nIt seems to me that the allusive procedure you employed has many disadvantages.\n\nStripped of what — you will agree — was designed to astonish me and lacks the merit of clarity; clarified methodologically; reduced to more precise and perhaps less seductive affirmations; your text should, it seems to me, remain attached to the statutes. It is customary for statutes to possess this sort of introduction.\n\nI am in fact in agreement with the movement you express.\n\nMy deepest reservation concerns the frenzy with which you insist on calling yourself an 'intellectual.' You know that I stand for totality, and at the time you allowed everything I wrote on this subject in the N.R.F. to pass without protest.\n\nToday you speak of the mysticism in my article. By this you mean that it irritates you.\n\nIn any case you will recognize that it would be inconsistent on my part to see in the Collège de Sociologie intentions excluding the possibility of thinking what was expressed in that article.\n\nI willingly recognize myself as an intellectual, but I refuse to add phrases suggesting that an intellectual who voluntarily limits himself could still be 'upright' and 'honest.'\n\nWhat Hegel called 'geistige Tierreich (und) der Betrug' — geistige must here be translated as intellectual — seems no less unbreathable to me after your 'examination of conscience' than before.\n\nThere are in the human spirit problems so heavy that no one can resolve them in a few words.\n\nWould you like us to add something like this to your propositions?\n\nThat the Collège de Sociologie reserves for itself the right to define problems without resolving them quickly, because many grave problems cannot be solved through abstract ideas alone, but only through the decisions resulting from the unpredictable course of events.\n\nI am not especially attached to the addition itself, but to the principle.\n\nThis principle moreover possesses, I think, a critical value against the very form you gave to the essential point of the statutes.\n\nYou want the Collège de Sociologie to claim spiritual power in the long term.\n\nIt seems to me that an organization ignorant of the development the 'course of things' will impose upon it cannot possess such a pretension.\n\nThis organization can only claim to pose the question of spiritual power.\n\nIt possesses no answer beyond the affirmation that spiritual power is necessary.\n\nI even think we would diverge as soon as the question arose concerning the direction in which this power should be sought.\n\nPerhaps you believe in the authority of those possessing knowledge and defining orthodoxy.\n\nI do not entirely exclude myself from that hope.\n\nBut I do not think we can seriously avoid or surpass the points you yourself define:\n\nthat society is no less real nor less rich than the individual person;\nthat this being demanding self-sacrifice must be sacred;\nthat it must possess the forces, virtues, and seductions which demand and provoke sacrifice.\n\nBut this has a consequence:\n\nspiritual power cannot renounce defining itself as a being similar to those of which it says they are no less real nor less rich than the individual person.\n\nInsofar as it is such a being, it must possess the virtue of provoking sacrifice.\n\nIt must therefore pretend to the sacred.\n\nThe principle you define of a closed preliminary 'council' before public meetings seems to me the only thing truly corresponding to the necessity of discussing among ourselves, as soon as possible, this entire set of questions resulting from our exchange of letters.\n\nIf you bring no less goodwill than I toward finding the immediate solutions allowing us to continue, then there will in fact be no difficulty.\n\nThe misfortune lies only in the fact that the Collège, proposing for itself — until entirely new circumstances arise — an intellectual task, can scarcely avoid confusing the immediate with the distant.\n\nIt belongs to you, moreover — I could not do it — to define what you call the immediate task and what must remain the object of 'occultation.'\n\nIf only you propose something viable, you will encounter opposition neither from me nor from those truly interested in our activity.\n\nI have in fact just received a letter entirely in your direction on this matter.\n\nThe Collège can now possess meaning only if it knows how to close itself back upon itself and give itself a solid constitution. Numbers are without interest.\n\nYou saw me in June wavering and hesitant, unable to see clearly what could be done after October.\n\nToday I believe that Leiris’s proposal alone allows us to escape the impasse.\n\nI therefore renounce what I myself had proposed to you earlier and which perhaps made you excessively uneasy.\n\nWhat I now personally propose may no longer provoke your hostility and will perhaps show you all the possibilities of agreement still existing between us.\n\nI would like to give a genuine course, reconstructing into a system what I once said in Critique sociale, this time tightening the argument, ordering, clarifying, and naturally developing it.\n\nThis would be for a small number of people agreeing in advance to attend fairly regularly.\n\nAs for the review, I now await your reviews as quickly as possible.\n\nWe absolutely must publish on 1 October.\n\nI therefore have to send the final texts to the printer before 25 August.\n\nPlease make the necessary effort so that everything will be ready in time.\n\nIf you can find the latest issue of the Revue internationale de sociologie, it contains an article on Montesquieu as sociologist. I mention it because I feel you would be pleased to seize the opportunity of reviewing it in order to express what you think of Montesquieu.\n\nWe must abandon the title Religio, not only because it lacked all seductive power, but because it is already taken.\n\nThe only names not appearing impossible are NEMI, DIANUS, and OURANOS.\n\nThe last of these is by far the one most appreciated among the few people to whom I have mentioned it.\n\nFor my own part I strongly favor it.\n\nThe first two are too precious, too rare.\n\nThe long delay of this long letter — begun on 6 July — comes from the little time I have had, combined with extreme fatigue.\n\nUnfortunately I have had no occasion to have the texts you sent typed.\n\nI am very much in agreement overall with your conclusions on the Sacred.\n\nIt seems to me only possible to go further.\n\nI hope we will attempt an explanation on this subject within the framework of the 'council,' but only among a few people.\n\nYour text and my lecture of 4 July, confronted with certain notes by Leiris, could, I believe, furnish the basis for a discussion that would truly tighten the issues.\n\nI hope for a rapid response from you, even a very short one, and above all the reviews.\n\nCordially yours,\n\nGeorges Bataille"
},

{
id:139,
sender:"Zeitgeist RSS Feed",
recipient:"Georges Bataille",
date:"July 1939 onward",
subject:"Leiris’s withdrawal letter and the methodological crisis",
body:"Leiris withdrew from speaking the day before the final July session of the Collège and transmitted a letter expressing the extent of his disagreement.\n\nTwo typed versions of this letter survive. One appears harsher and more direct; another was softened, perhaps in anticipation of publication.\n\nThe disagreement is said to concern methodology, but everything indicates that it already concerns the existential consequences of sacred sociology itself.\n\nLeiris fears:\n\n- the transformation of the Collège into a literary chapel;\n- mystical inflation;\n- theatrical posturing;\n- the degeneration of sacred inquiry into aestheticism.\n\nYet these fears themselves already belong to the sacred domain.\n\nNobody fears mere theory in this way.\n\nThe real divergence concerns the acceptable degree of existential implication.\n\nCaillois seeks:\n\n- reserve;\n- discipline;\n- hierarchy;\n- distance;\n- definition before participation.\n\nI increasingly seek:\n\n- expenditure before guarantee;\n- risk before doctrine;\n- participation before legitimacy.\n\nThe only rigorous sociology of the sacred may ultimately become dangerous for the sociologist himself.\n\nWhich means:\n\neither the Collège remains commentary,\nor it becomes something else entirely."
},

{
