<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta content="noindex, nofollow" name="robots">
<meta name="theme-color" content="#000">
<title>Instructions for the "Encounter" in the Forest</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
  }

  body {
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .page {
    width: 100%;
    margin: 0;
    padding: 0;
  }

  .document {
    display: block;
    width: 100%;
    height: auto;
    max-width: none;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <main class="page">
    <img
      class="document"
      src="encounters.webp"
      alt='Instructions for the "Encounter" in the Forest'
      draggable="false"
    >
  </main>
</body>
</html>
