<html lang="en">

<meta charset="UTF-8">

<style>

:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --border:#e5eaf0;
  --text:#18222d;
  --muted:#667281;
  --cyan:#12cfff;
  --cyan2:#0ea5e9;
  --shadow:0 10px 35px rgba(0,0,0,.06);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:transparent;
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.topbar{
  max-width:1400px;
  margin:auto;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
}

.top-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.timer{
  font-size:.85rem;
  color:var(--muted);
  font-weight:600;
}

.logo{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:1.35rem;
  font-weight:800;
}

.logo-badge{
  width:44px;
  height:44px;
  border-radius:16px;
  background: #ffc0cb;
  display:flex;
  align-items:center;
  justify-content:center;
}

.balance{
  background:white;
  border:1px solid var(--border);
  padding:12px 18px;
  border-radius:16px;
  box-shadow:var(--shadow);
  font-weight:700;
}

.layout{
  max-width:1400px;
  margin:auto;
  padding:24px;
  display:grid;
  grid-template-columns:250px 1fr;
  gap:24px;
}

.sidebar{
  background:white;
  border:1px solid var(--border);
  border-radius:28px;
  padding:18px;
  height:fit-content;
  box-shadow:var(--shadow);
  position:sticky;
  top:95px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.menu-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  border-radius:18px;
  transition:.2s;
  cursor:pointer;
  color:#334155;
}

.menu-item:hover{
  background:#f4fbfe;
}

.menu-item.active{
  background:#ecfaff;
  color:#0891b2;
  font-weight:700;
}

.menu-item svg{
  width:22px;
  height:22px;
}

.feed{
  display:flex;
  flex-direction:column;
  gap:28px;
}

.card{
  background:white;
  border-radius:30px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.card-top{
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.creator{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#eef2f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  line-height:1;
  flex:none;
}

.creator h3{
  font-size:1rem;
}

.creator p{
  margin-top:4px;
  color:var(--muted);
  font-size:.92rem;
}

.media-area{
  position:relative;
  overflow:hidden;
  background:black;
}

.media-area video,
.media-area img,
.media-area iframe,
.media-area .text-media{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  border:0;
}

.media-area video,
.media-area img,
.media-area iframe{
  object-fit:cover;
}

.text-media{
  padding:40px;
  background:#111827;
  color:white;
  font-family:Georgia,serif;
  font-size:clamp(1rem,2vw,1.5rem);
  line-height:1.7;
  white-space:pre-wrap;
  overflow:auto;
}

.blurred{
  filter:blur(18px) brightness(.75);
  transform:scale(1.05);
}

.lock-layer{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(7px);
}

.lock-box{
  background:rgba(255,255,255,.95);
  width:min(340px,90%);
  border-radius:28px;
  padding:28px;
  text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}

.lock-box svg{
  width:44px;
  height:44px;
}

.lock-box h2{
  margin-top:14px;
  font-size:1.2rem;
}

.lock-box p{
  color:var(--muted);
  line-height:1.6;
  margin-top:8px;
}

.unlock-btn{
  margin-top:20px;
  width:100%;
  border:none;
  padding:15px;
  border-radius:18px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  color:white;
  font-weight:700;
  font-size:1rem;
  cursor:pointer;
  transition:.2s;
}

.unlock-btn:hover{
  transform:translateY(-2px);
}

.content{
  padding:22px;
}

.description{
  color:#4b5563;
  line-height:1.7;
  margin-bottom:22px;
}

.reactions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:26px;
}

.reaction{
  border:1px solid var(--border);
  background:white;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
  transition:.2s;
  display:flex;
  align-items:center;
  gap:8px;
  width:82px;
  min-width:82px;
  box-sizing:border-box;
  justify-content:flex-start;
  white-space:nowrap;
}

.reaction span{
  display:inline-block;
  width:4ch;
  min-width:4ch;
  flex:0 0 4ch;
  text-align:left;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.reaction:hover{
  background:#f4fbfe;
}
.reaction.clicked{
  animation:reactionPop .22s ease-out;
}
@keyframes reactionPop{
  0%{transform:scale(1)}
  45%{transform:scale(1.16)}
  100%{transform:scale(1)}
}
.reaction-toast{
  position:fixed;
  z-index:99999;
  background:#111827;
  color:#fff;
  padding:7px 11px;
  border-radius:999px;
  font-size:12px;
  line-height:1;
  pointer-events:none;
  opacity:0;
  transform:translate(-50%, 5px);
  transition:opacity .15s ease, transform .15s ease;
  white-space:nowrap;
}
.reaction-toast.show{
  opacity:1;
  transform:translate(-50%, 0);
}


.comments{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:18px;
  max-height:270px;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  overscroll-behavior:contain;
  padding-right:2px;
}

.comments::-webkit-scrollbar{
  display:none;
}

.comment{
  background:#f8fafc;
  padding:15px;
  border-radius:18px;
}


.comment strong{
  display:block;
  margin-bottom:2px;
}

.comment small{
  display:block;
  color:var(--muted);
  margin-bottom:7px;
  font-size:.82rem;
}

.comment p{
  color:#4b5563;
  line-height:1.5;
}

.comment-form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.comment-form input,
.comment-form textarea{
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  font-size:1rem;
  outline:none;
  background:white;
}

.comment-form textarea{
  min-height:90px;
  resize:vertical;
}

.post-btn{
  border:none;
  background:#111827;
  color:white;
  padding:15px;
  border-radius:16px;
  font-weight:700;
  cursor:pointer;
}

@media(max-width:980px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{

    top:0;

@media(max-width:700px){

  .layout{

  .topbar{

  .top-center{
    position:relative;
    left:auto;
    transform:none;
    margin:auto;
    width:100%;
    flex-basis:100%;
    gap:4px;
  }

  .lock-box h2{
    font-size:.95rem;
  }

  .lock-box p{
    font-size:.85rem;
  }

/* Not enough credits overlay */
.credits-modal{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(15,23,42,.38);

.credits-modal.show{
  display:flex;
  animation:creditsFadeIn .18s ease-out;

.credits-modal-box{
  width:min(390px,100%);
  background:#fff;
  border:1px solid var(--border);
  border-radius:28px;
  padding:30px;
  text-align:center;
  box-shadow:0 24px 80px rgba(15,23,42,.22);

  height:64px;

  background:#fff0f3;

  justify-content:center;
  font-size:34px;

  font-size:1.25rem;

.credits-modal-box p{

  line-height:1.6;
  margin:9px 0 20px;

.credits-modal-box strong{

.credits-modal-btn{
  width:100%;
  border:0;
  padding:14px 18px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  color:#fff;
  font-weight:700;
  font-size:1rem;
  cursor:pointer;
  transition:.2s;
}

.credits-modal-btn:hover{
  transform:translateY(-2px);
}

@keyframes creditsFadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes creditsPop{
  from{opacity:0;transform:translateY(8px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.logo-title{
  display:flex;
  flex-direction:column;
  line-height:1;
}

.logo-title h1{
  margin:0;
  font-size:1.35rem;
  font-weight:800;

.logo-title small{
  margin-top:4px;
  font-size:.64rem;
  line-height:1;
  font-weight:500;
  color:var(--muted);
  letter-spacing:.02em;
}
</style>
</head>

parseInt(localStorage.getItem("vault_credits"))
|| STARTING_CREDITS;

let refillTimestamp =
parseInt(localStorage.getItem("vault_refill_time"));

if(!refillTimestamp){

  refillTimestamp = Date.now() + REFILL_TIME;

  localStorage.setItem(
    "vault_refill_time",
    refillTimestamp
  );

}

const savedUnlocked =
JSON.parse(localStorage.getItem("vault_unlocked")) || [];

posts.forEach(post=>{
  if(savedUnlocked.includes(post.id)){
    post.unlocked = true;
  }
});

/* RANDOMIZE FEED ORDER — locked events first, unlocked events after */
function shufflePosts(list){
  for(let i=list.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [list[i],list[j]]=[list[j],list[i]];
  }
  return list;
}

const lockedPosts = shufflePosts(posts.filter(post => !post.unlocked));
const unlockedPosts = shufflePosts(posts.filter(post => post.unlocked));

posts.length = 0;
posts.push(...lockedPosts, ...unlockedPosts);

const COMMENT_ROTATION_SIZE = 50;
const COMMENTS_VISIBLE_STEP = 10;
const commentRotations = {};

function getStoredComments(){
  return JSON.parse(
    localStorage.getItem("onlyfanatics_comments_v2")
  ) || {};
}

function saveStoredComments(data){
  localStorage.setItem(
    "onlyfanatics_comments_v2",
    JSON.stringify(data)
  );
}

function shuffleCopy(array){
  const copy = [...array];
  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}

function getCommentRotation(postId){
  if(!commentRotations[postId]){
    commentRotations[postId] = shuffleCopy(COMMENT_POOL)
      .slice(0, COMMENT_ROTATION_SIZE);
  }
  return commentRotations[postId];
}

const commentObservers = {};
const commentVisibleCounts = {};

function renderGeneratedComments(postId, container, visibleCount){
  const stored = getStoredComments()[postId] || [];
  const generated = getCommentRotation(postId);

  const all = [
    ...stored.map(c => ({handle:"user", name:c.name, text:c.text})),
    ...generated
  ];

  const nextCount = Math.min(visibleCount, all.length);
  commentVisibleCounts[postId] = nextCount;

  container.innerHTML = all.slice(0, nextCount).map(c => `
    <div class="comment">
      <strong>@${escapeHTML(c.handle)}</strong>
      <small>${escapeHTML(c.name)}</small>
      <p>${escapeHTML(c.text)}</p>
    </div>
  `).join("");

  const sentinel = document.createElement("div");
  sentinel.className = "comments-lazy-sentinel";
  sentinel.setAttribute("aria-hidden", "true");
  sentinel.style.height = "1px";
  sentinel.style.width = "100%";
  sentinel.style.pointerEvents = "none";
  container.appendChild(sentinel);

  if(commentObservers[postId]){
    commentObservers[postId].disconnect();
  }

  if(nextCount < all.length && "IntersectionObserver" in window){
    commentObservers[postId] = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if(!entry.isIntersecting) return;

        observer.disconnect();
        const current = commentVisibleCounts[postId] || COMMENTS_VISIBLE_STEP;
        renderGeneratedComments(
          postId,
          container,
          Math.min(current + COMMENTS_VISIBLE_STEP, all.length)
        );
      });
    }, {
      root:container,
      rootMargin:"0px 0px 500px 0px",
      threshold:0
    });

    commentObservers[postId].observe(sentinel);
  } else if(nextCount < all.length){
    // Fallback: keep a modest initial render, then load the rest without a button.
    renderGeneratedComments(
      postId,
      container,
      Math.min(nextCount + COMMENTS_VISIBLE_STEP, all.length)
    );
  }
}



function renderFeed(){

  const feed = document.getElementById("feed");

  feed.innerHTML = "";

  Object.values(commentObservers).forEach(observer => observer.disconnect());
  Object.keys(commentObservers).forEach(key => delete commentObservers[key]);
  Object.keys(commentVisibleCounts).forEach(key => delete commentVisibleCounts[key]);

  posts.forEach(post=>{

const media =
  post.type === "video"
  ?
  `
  <video
    ${post.unlocked ? "controls" : ""}
    autoplay
    muted
    loop
    playsinline
    preload="none"
    data-lazy-src="${post.src}"
    class="${post.unlocked ? "" : "blurred"}"
  ></video>
  `
  :
  post.type === "image"
  ?
  `
  <img
    data-lazy-src="${post.src}"
    class="${post.unlocked ? "" : "blurred"}"
    alt="${post.creator}"
    loading="lazy"
  >
  `
  :
  post.type === "iframe"
  ?
  `
  <iframe
    data-lazy-src="${post.src}"
    class="${post.unlocked ? "" : "blurred"}"
    allow="autoplay; fullscreen"
    allowfullscreen
    loading="lazy"
  ></iframe>
  `
  :
  `
  <div class="text-media ${post.unlocked ? "" : "blurred"}">
    ${escapeHTML(post.src)}
  </div>
  `;

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="card-top">

        <div class="creator">

          <div class="avatar">${post.avatar || "👤"}</div>

          <div>
            <h3>${post.creator}</h3>
            <p>${post.date}</p>
          </div>

        </div>

      </div>

<div class="media-area">

  ${media}

  ${
    !post.unlocked
          ?
          `
          <div class="lock-layer">

            <div class="lock-box">

              <svg viewBox="0 0 24 24" fill="none">
                <path
                d="M7 11V8C7 5.2 9.2 3 12 3C14.8 3 17 5.2 17 8V11"
                stroke="#0ea5e9"
                stroke-width="2"/>

                <rect
                x="5"
                y="11"
                width="14"
                height="10"
                rx="3"
                fill="#0ea5e9"/>
              </svg>

              <h2>Unlock Exclusive Content</h2>

              <p>
                Unlock this content for
                <strong>${post.price} credits</strong>
              </p>

              <button
              class="unlock-btn"
              onclick="unlockPost(${post.id})">

                Unlock Now

              </button>

            </div>

          </div>
          `
          :
          ""
        }

      </div>

      <div class="content">

        <div class="description">
          ${post.description}
        </div>

        <div class="reactions">

          <button class="reaction" onclick="react(this)">
            ❤️ <span>12</span>
          </button>

          <button class="reaction" onclick="react(this)">
            🔥 <span>7</span>
          </button>

          <button class="reaction" onclick="react(this)">
            😮 <span>5</span>
          </button>

          <button class="reaction" onclick="react(this)">
            😍 <span>3</span>
          </button>

        </div>

        <div class="comments" id="comments-${post.id}"></div>

        <div class="comment-form">

          <input
          type="text"
          id="name-${post.id}"
          placeholder="Your name">

          <textarea
          id="text-${post.id}"
          placeholder="Write a comment..."></textarea>

          <button
          class="post-btn"
          onclick="addComment(${post.id})">

            Post Comment

          </button>

        </div>

      </div>

    `;

    feed.appendChild(card);

    const commentsContainer = card.querySelector(`#comments-${post.id}`);
    renderGeneratedComments(post.id, commentsContainer, COMMENTS_VISIBLE_STEP);

  });

  initLazyMedia();
}

let lazyMediaObserver;

function initLazyMedia(){
  if(lazyMediaObserver){
    lazyMediaObserver.disconnect();
  }

  const lazyElements = document.querySelectorAll("[data-lazy-src]");

  if(!("IntersectionObserver" in window)){
    lazyElements.forEach(el => loadLazyMedia(el));
    return;
  }

  lazyMediaObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const el = entry.target;

      if(entry.isIntersecting){
        loadLazyMedia(el);

        if(el.tagName === "VIDEO"){
          el.play().catch(()=>{});
        }
      }else if(el.tagName === "VIDEO"){
        el.pause();
      }
    });
  }, {
    root:null,
    rootMargin:"0px",
    threshold:0.01
  });

  lazyElements.forEach(el => lazyMediaObserver.observe(el));
}

function loadLazyMedia(el){
  const src = el.dataset.lazySrc;
  if(!src) return;

  if(el.tagName === "VIDEO"){
    el.src = src;
    el.load();
  }else{
    el.src = src;
  }

  delete el.dataset.lazySrc;
}

function showCreditsModal(price){
  const modal = document.getElementById("creditsModal");
  const message = document.getElementById("creditsModalMessage");

  message.innerHTML = `You have <strong>${credits} credits</strong>, but this fragment costs <strong>${price} credits</strong>.`;
  modal.classList.add("show");

  setTimeout(() => {
    const button = modal.querySelector(".credits-modal-btn");
    if(button) button.focus();
  }, 0);
}

function closeCreditsModal(){
  document.getElementById("creditsModal").classList.remove("show");
}

document.getElementById("creditsModal").addEventListener("click", closeCreditsModal);
document.addEventListener("keydown", event => {
  if(event.key === "Escape") closeCreditsModal();
});

function unlockPost(id){

  const post = posts.find(p=>p.id===id);

  if(post.unlocked) return;

  if(credits < post.price){
    showCreditsModal(post.price);
    return;
  }

  credits -= post.price;

  post.unlocked = true;

  localStorage.setItem(
    "vault_unlocked",
    JSON.stringify(
      posts
        .filter(p=>p.unlocked)
        .map(p=>p.id)
    )
  );

  localStorage.setItem(
    "vault_credits",
    credits
  );

  updateCredits();
  renderFeed();

}

function updateCredits(){
  document.getElementById("credits").innerText = credits;
}

function updateTimer(){

  const now = Date.now();

  let remaining = refillTimestamp - now;

  if(remaining <= 0){

    credits = STARTING_CREDITS;

    localStorage.setItem(
      "vault_credits",
      credits
    );

    refillTimestamp =
    Date.now() + REFILL_TIME;

    localStorage.setItem(
      "vault_refill_time",
      refillTimestamp
    );

    remaining = REFILL_TIME;

    updateCredits();

  }

  const minutes =
  Math.floor(remaining / 1000 / 60);

  const seconds =
  Math.floor((remaining / 1000) % 60);

  document.getElementById("timer").innerText =
    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}

setInterval(updateTimer,1000);

function initializeReactionCounters(){
      document.querySelectorAll(".reaction").forEach(btn => {
        const span = btn.querySelector("span");

        // Independent starting values and independent timing for every reaction.
        const count = Math.floor(Math.random() * 450) + 20;
        const growth = Math.floor(Math.random() * 4) + 1;
        const pause = Math.floor(Math.random() * 2200) + 900;

        btn.dataset.count = count;
        btn.dataset.growth = growth;
        btn.dataset.pause = pause;
        btn.dataset.nextTick = Date.now() + pause;
        span.innerText = count;
      });
    }

    function updateReactionCounters(){
      const now = Date.now();

      document.querySelectorAll(".reaction").forEach(btn => {
        const nextTick = parseInt(btn.dataset.nextTick || "0", 10);

        // Stay still during the pause, then jump by this reaction's own amount.
        if(now >= nextTick){
          let count = parseInt(btn.dataset.count || "0", 10);
          const growth = parseInt(btn.dataset.growth || "1", 10);
          const pause = parseInt(btn.dataset.pause || "1800", 10);

          count += growth;
          btn.dataset.count = count;
          btn.querySelector("span").innerText = count;

          // Randomize the next pause so the reactions never move in sync.
          btn.dataset.nextTick = now + Math.floor(pause * (0.7 + Math.random() * 0.8));
        }
      });
    }

    function react(btn){
      let count = parseInt(btn.dataset.count || btn.querySelector("span").innerText, 10);
      count += 1;
      btn.dataset.count = count;
      btn.querySelector("span").innerText = count;

      // Immediate visual feedback without changing the layout.
      btn.classList.remove("clicked");
      void btn.offsetWidth;
      btn.classList.add("clicked");

      const emoji = btn.childNodes[0]?.textContent?.trim() || "❤️";
      showReactionFeedback(emoji, btn);
    }

    let reactionToastTimer;

    function showReactionFeedback(emoji, btn){
      const toast = document.getElementById("reactionToast");
      if(!toast || !btn) return;

      toast.textContent = emoji + " +1";
      const rect = btn.getBoundingClientRect();

      toast.style.left = (rect.left + rect.width / 2) + "px";
      toast.style.top = Math.max(8, rect.top - 34) + "px";

      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");

      clearTimeout(reactionToastTimer);
      reactionToastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 700);
    }

    // Check frequently, but each counter has its own longer pause.
    setInterval(updateReactionCounters, 250);

    function addComment(id){

  const name =
  document.getElementById(`name-${id}`).value || "Anonymous";

  const text =
  document.getElementById(`text-${id}`).value;

  if(!text.trim()) return;

  const comments =
  getStoredComments();

  if(!comments[id]){
    comments[id] = [];
  }

  comments[id].unshift({
    name,
    text
  });

  saveStoredComments(comments);

  renderFeed();

}

function escapeHTML(str){

  return str
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

}

document.addEventListener("keydown", (e) => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "e"){
    e.preventDefault();
    localStorage.removeItem("vault_unlocked");
    localStorage.removeItem("vault_credits");
    localStorage.removeItem("vault_refill_time");
    localStorage.removeItem("onlyfanatics_comments_v2");
    location.reload();
  }
});

renderFeed();
initializeReactionCounters();
updateCredits();
updateTimer();

</script>

<div id="reactionToast" class="reaction-toast" aria-live="polite"></div>
</body>
