<!DOCTYPE html>
<html lang="en">
<head>
<meta content="noindex, nofollow" name="robots">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>TRUTHahn 🐔 Social</title>

<style>

/* =========================================================
   LIEAHN SOCIAL
   ========================================================= */

:root{

    --purple:#5448EE;
    --green:#2FEECC;
    --blue:#35CCF0;
    --coral:#FF4775;
    --black:#08051B;
    --white:#FFFFFF;

    --soft:#F6F6FA;
    --line:#E4E3EA;
    --muted:#777582;

}


/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:var(--soft);
    color:var(--black);

}

body{
    overflow-y:auto;
}

button,
textarea,
input{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   APP
   ========================================================= */

.app{
    min-height:100vh;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{

    position:sticky;
    top:0;

    z-index:100;

    height:62px;

    display:flex;
    align-items:center;

    background:var(--white);

    border-bottom:1px solid var(--line);

}

.topbar-inner{

    width:min(1100px,100%);

    margin:auto;

    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

}

.brand{

    display:flex;
    align-items:center;

    gap:8px;

    color:var(--purple);

    font-weight:900;

    font-size:20px;

    letter-spacing:-.7px;

}

.brand-chicken{
    font-size:23px;
}

.topnav{

    display:flex;
    align-items:center;

    gap:4px;

}

.nav-item{

    height:62px;

    display:flex;
    align-items:center;

    padding:0 14px;

    border:0;

    background:transparent;

    color:var(--muted);

    font-size:13px;

    font-weight:700;

}

.nav-item.active{

    color:var(--purple);

    box-shadow:
        inset 0 -3px 0 var(--purple);

}

.nav-item:hover{
    color:var(--purple);
}

.rooster-score{

    display:flex;
    align-items:center;

    gap:6px;

    color:var(--black);

    font-size:11px;

    font-weight:800;

}

.rooster-score strong{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:27px;
    height:25px;

    padding:0 7px;

    background:var(--green);

    color:var(--black);

    border-radius:14px;

}


/* =========================================================
   PAGE
   ========================================================= */

.page{

    width:min(1100px,100%);

    margin:0 auto;

    display:grid;

    grid-template-columns:
        minmax(0,680px)
        280px;

    gap:28px;

    padding:28px 20px 100px;

}


/* =========================================================
   FEED
   ========================================================= */

.feed{

    min-width:0;

    display:flex;

    flex-direction:column;

}


/* =========================================================
   COMPOSER
   ========================================================= */

.composer{

    background:var(--white);

    border:1px solid var(--line);

    border-radius:14px;

    padding:18px;

    margin-bottom:15px;

}

.composer-top{

    display:flex;

    gap:12px;

}

.composer-avatar{

    flex:0 0 auto;

    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--purple);

    color:white;

    font-size:22px;

}

.composer textarea{

    flex:1;

    min-width:0;

    min-height:70px;

    resize:none;

    border:0;

    outline:0;

    padding:5px 0;

    background:transparent;

    color:var(--black);

    font-size:15px;

    line-height:1.45;

}

.composer textarea::placeholder{
    color:#9997A4;
}

.composer-bottom{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:14px;

    margin-top:10px;

}

.counter{

    color:var(--muted);

    font-size:11px;

}

.truth-button{

    border:0;

    border-radius:20px;

    padding:9px 20px;

    background:var(--purple);

    color:var(--white);

    font-size:12px;

    font-weight:800;

}

.truth-button:hover{

    background:#4539D8;

}


/* =========================================================
   LIE CARD
   ========================================================= */

.truth{

    background:var(--white);

    border:1px solid var(--line);

    padding:18px;

    transition:
        background .15s,
        box-shadow .15s;

}

.truth:first-child{
    border-radius:14px 14px 0 0;
}

.truth:last-child{
    border-radius:0 0 14px 14px;
}

.truth + .truth{
    border-top:0;
}

.truth:hover{
    background:#FEFEFF;
}


/* =========================================================
   USER ROW
   ========================================================= */

.truth-head{

    display:flex;

    justify-content:space-between;

    gap:10px;

}

.user{

    display:flex;

    gap:11px;

    min-width:0;

}

.avatar{

    flex:0 0 auto;

    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--green);

    color:var(--black);

    font-size:22px;

}

.user-info{
    min-width:0;
}

.name-line{

    display:flex;
    align-items:center;

    gap:5px;

    min-width:0;

}

.username{

    font-size:14px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.verified{

    width:15px;
    height:15px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--purple);

    color:white;

    font-size:9px;

    font-weight:900;

}

.handle{

    color:var(--muted);

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.time{

    flex:0 0 auto;

    color:var(--muted);

    font-size:11px;

}


/* =========================================================
   POST
   ========================================================= */

.truth-content{

    margin-left:55px;

}

.truth-text{

    margin:

        7px 0 14px;

    font-size:15px;

    line-height:1.48;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

}

.truth-text .mention{
    color:var(--purple);
}


/* =========================================================
   GAME STATUS
   ========================================================= */

.truth-status{

    display:flex;

    align-items:center;

    gap:7px;

    margin-bottom:11px;

    color:var(--muted);

    font-size:10px;

    font-weight:700;

}

.heat-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

}

.heat-dot.hot{
    background:var(--coral);
}

.heat-dot.crazy{
    background:var(--purple);
}


/* =========================================================
   ACTION ROW
   ========================================================= */

.actions{

    display:flex;

    align-items:center;

    justify-content:space-between;

    max-width:520px;

    margin-top:5px;

}

.action{

    display:flex;

    align-items:center;

    gap:6px;

    border:0;

    background:transparent;

    color:var(--muted);

    padding:7px 9px;

    border-radius:18px;

    font-size:11px;

    font-weight:700;

}

.action:hover{
    background:#F0EFF7;
}

.action.like:hover,
.action.like.active{
    color:var(--coral);
}

.action.dislike:hover,
.action.dislike.active{
    color:var(--blue);
}

.action.comment:hover{
    color:var(--purple);
}

.action.retruth:hover,
.action.retruth.active{
    color:#16A78C;
}

.action.quote:hover{
    color:var(--purple);
}

.action-icon{

    font-size:16px;

    line-height:1;

}


/* =========================================================
   REPLY THREAD
   ========================================================= */

.comments{

    display:none;

    margin-top:15px;

    border-top:1px solid var(--line);

    padding-top:12px;

}

.comments.open{
    display:block;
}

.comment{

    display:flex;

    gap:9px;

    padding:10px 0;

}

.comment-avatar{

    width:32px;
    height:32px;

    flex:0 0 auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--blue);

    font-size:16px;

}

.comment-body{

    min-width:0;

    flex:1;

}

.comment-meta{

    display:flex;

    align-items:center;

    gap:5px;

}

.comment-author{

    font-size:12px;

    font-weight:800;

}

.comment-handle{

    color:var(--muted);

    font-size:10px;

}

.bot{

    color:var(--purple);

    font-size:8px;

    font-weight:900;

    text-transform:uppercase;

}

.comment-text{

    margin-top:3px;

    font-size:16px;

    line-height:1.45;

}

.comment-actions{

    display:flex;

    gap:10px;

    margin-top:5px;

}

.comment-actions button{

    border:0;

    background:transparent;

    color:var(--muted);

    padding:5px 8px;

    font-size:14px;

    line-height:1;

    border-radius:14px;

    cursor:pointer;

    transition:
        background .15s,
        color .15s,
        transform .1s;

}

.comment-actions button:hover{

    background:#F0EFF7;

    transform:scale(1.08);

}

.comment-actions button[data-action="comment-like"]:hover{

    color:var(--coral);

}

.comment-actions button[data-action="comment-dislike"]:hover{

    color:var(--blue);

}


/* =========================================================
   COMMENT INPUT
   ========================================================= */

.comment-box{

    display:flex;

    align-items:center;

    gap:9px;

    margin-top:8px;

}

.comment-box input{

    flex:1;

    min-width:0;

    border:1px solid var(--line);

    border-radius:18px;

    padding:8px 13px;

    outline:0;

    font-size:11px;

    background:var(--soft);

}

.comment-box input:focus{

    border-color:var(--purple);

    background:var(--white);

}

.comment-box button{

    border:0;

    border-radius:17px;

    background:var(--purple);

    color:white;

    padding:8px 14px;

    font-size:10px;

    font-weight:800;

}


/* =========================================================
   QuoteLie
   ========================================================= */

.quote-card{

    margin:8px 0 13px;

    border:1px solid var(--line);

    border-radius:10px;

    padding:12px;

    background:#FAFAFC;

}

.quote-card .quote-user{

    font-size:10px;

    font-weight:800;

}

.quote-card .quote-text{

    margin-top:5px;

    font-size:11px;

    line-height:1.4;

}


/* =========================================================
   RIGHT SIDEBAR
   ========================================================= */

.sidebar{

    position:sticky;

    top:88px;

    align-self:start;

}

.sidebar-box{

    background:var(--white);

    border:1px solid var(--line);

    border-radius:14px;

    margin-bottom:15px;

    overflow:hidden;

}

.sidebar-title{

    padding:14px 15px;

    border-bottom:1px solid var(--line);

    font-size:13px;

    font-weight:900;

}

.sidebar-body{

    padding:15px;

}

.game-meter{

    margin-bottom:13px;

}

.game-meter-top{

    display:flex;

    justify-content:space-between;

    font-size:10px;

    font-weight:800;

}

.meter{

    height:7px;

    margin-top:6px;

    background:#EEE;

    border-radius:10px;

    overflow:hidden;

}

.meter-fill{

    height:100%;

    background:var(--purple);

    border-radius:10px;

    transition:width .4s;

}

.flock{

    display:flex;

    flex-direction:column;

    gap:11px;

}

.flock-user{

    display:flex;

    align-items:center;

    gap:9px;

}

.flock-avatar{

    width:31px;
    height:31px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--green);

    font-size:16px;

}

.flock-name{

    font-size:11px;

    font-weight:800;

}

.flock-status{

    color:var(--muted);

    font-size:9px;

}


/* =========================================================
   RESET
   ========================================================= */

.reset{

    color:var(--muted);

    font-size:9px;

    line-height:1.5;

}

.reset strong{
    color:var(--black);
}


/* =========================================================
   TOAST
   ========================================================= */

#toast{

    position:fixed;

    left:50%;
    bottom:24px;

    transform:
        translate(-50%,120px);

    z-index:300;

    padding:10px 17px;

    border-radius:22px;

    background:var(--black);

    color:white;

    font-size:11px;

    font-weight:800;

    transition:transform .25s;

    box-shadow:
        0 8px 25px rgba(8,5,27,.18);

}

#toast.show{

    transform:
        translate(-50%,0);

}


/* =========================================================
   RESET FLASH
   ========================================================= */

#resetFlash{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--purple);

    color:white;

    font-size:48px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:opacity .12s;

}

#resetFlash.show{
    opacity:1;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:850px){

    .page{

        display:block;

        width:min(680px,100%);

        padding-left:10px;
        padding-right:10px;

    }

    .sidebar{
        display:none;
    }

}

@media(max-width:600px){

    .topbar-inner{
        padding:0 12px;
    }

    .topnav{
        display:none;
    }

    .rooster-score{
        display:none;
    }

    .page{
        padding-top:10px;
    }

    .composer{
        border-radius:10px;
    }

    .truth{
        padding:14px;
    }

    .truth-content{
        margin-left:0;
    }

    .truth-text{
        font-size:14px;
    }

    .actions{
        max-width:100%;
    }

    .action{
        padding-left:5px;
        padding-right:5px;
    }

    .action span.label{
        display:none;
    }

}


.action.comment{
    padding-left:11px;
    padding-right:11px;
    border-radius:18px;
}

.action.comment:hover{
    background:#F0EFF7;
    color:var(--purple);
}

/* =========================================================
   QUOTELIE MODAL
   ========================================================= */

.quote-modal{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.quote-modal.open{

    display:flex;

}

.quote-modal-backdrop{

    position:absolute;

    inset:0;

    background:rgba(8,5,27,.55);

    backdrop-filter:blur(5px);

}

.quote-modal-box{

    position:relative;

    z-index:1;

    width:min(500px,100%);

    background:var(--white);

    border:1px solid var(--line);

    border-radius:16px;

    box-shadow:
        0 25px 80px rgba(8,5,27,.25);

    padding:18px;

}

.quote-modal-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    font-size:16px;

    font-weight:900;

    color:var(--black);

    margin-bottom:14px;

}

.quote-modal-close{

    width:32px;
    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:transparent;

    color:var(--muted);

    font-size:24px;

    line-height:1;

}

.quote-modal-close:hover{

    background:#F0EFF7;

    color:var(--black);

}

.quote-modal-original{

    border-left:3px solid var(--purple);

    background:#F8F7FC;

    border-radius:8px;

    padding:11px 13px;

    margin-bottom:14px;

}

.quote-modal-user{

    font-size:11px;

    font-weight:800;

    color:var(--purple);

}

.quote-modal-text{

    margin-top:5px;

    font-size:13px;

    line-height:1.45;

    color:var(--black);

    white-space:pre-wrap;

    overflow-wrap:anywhere;

}

#quoteModalInput{

    width:100%;

    min-height:100px;

    resize:vertical;

    border:1px solid var(--line);

    border-radius:10px;

    outline:0;

    padding:12px;

    background:var(--soft);

    color:var(--black);

    font-size:14px;

    line-height:1.45;

}

#quoteModalInput:focus{

    border-color:var(--purple);

    background:var(--white);

}

.quote-modal-bottom{

    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:9px;

    margin-top:12px;

}

#quoteModalCounter{

    margin-right:auto;

    color:var(--muted);

    font-size:10px;

}

.quote-modal-cancel{

    border:0;

    border-radius:18px;

    padding:8px 14px;

    background:#EEEFF4;

    color:var(--black);

    font-size:11px;

    font-weight:800;

}

.quote-modal-cancel:hover{

    background:#E3E2EA;

}

.quote-modal-submit{

    border:0;

    border-radius:18px;

    padding:9px 17px;

    background:var(--purple);

    color:white;

    font-size:11px;

    font-weight:800;

}

.quote-modal-submit:hover{

    background:#4539D8;

}

/* =========================================================
   REPLY MODAL
   ========================================================= */

.reply-modal{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.reply-modal.open{

    display:flex;

}

.reply-modal-backdrop{

    position:absolute;

    background:rgba(8,5,27,.55);

}

.reply-modal-box{

    width:min(500px,100%);

    background:var(--white);

    box-shadow:
        0 25px 80px rgba(8,5,27,.25);

    padding:18px;

}

.reply-modal-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    font-size:16px;

    font-weight:900;

    color:var(--black);

    margin-bottom:14px;

}

.reply-modal-close{

    width:32px;
    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:transparent;

    color:var(--muted);

    font-size:24px;

    line-height:1;

}

.reply-modal-close:hover{

    background:#F0EFF7;

    color:var(--black);

}

.reply-modal-original{

    border-left:3px solid var(--purple);

    background:#F8F7FC;

    border-radius:8px;

    padding:11px 13px;

    margin-bottom:14px;

}

.reply-modal-user{

    font-size:11px;

    font-weight:800;

    color:var(--purple);

}

.reply-modal-text{

    margin-top:5px;

    font-size:13px;

    line-height:1.45;

    color:var(--black);

    white-space:pre-wrap;

    overflow-wrap:anywhere;

}

#replyModalInput{

    width:100%;

    min-height:100px;

    resize:vertical;

    border:1px solid var(--line);

    border-radius:10px;

    outline:0;

    padding:12px;

    background:var(--soft);

    color:var(--black);

    font-size:14px;

    line-height:1.45;

}

#replyModalInput:focus{

    border-color:var(--purple);

    background:var(--white);

}

.reply-modal-bottom{

    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:9px;

    margin-top:12px;

}

#replyModalCounter{

    margin-right:auto;

    color:var(--muted);

    font-size:10px;

}

.reply-modal-cancel{

    border:0;

    border-radius:18px;

    padding:8px 14px;

    background:#EEEFF4;

    color:var(--black);

    font-size:11px;

    font-weight:800;

}

.reply-modal-cancel:hover{

    background:#E3E2EA;

}

.reply-modal-submit{

    border:0;

    border-radius:18px;

    padding:9px 17px;

    background:var(--purple);

    color:white;

    font-size:11px;

    font-weight:800;

}

.reply-modal-submit:hover{

    background:#4539D8;

}

@media(max-width:600px){

    .reply-modal{

        padding:12px;

    }

    .reply-modal-box{

        border-radius:14px;

        padding:15px;

    }

}

@media(max-width:600px){

    .quote-modal{

        padding:12px;

    }

    .quote-modal-box{

        border-radius:14px;

        padding:15px;

    }

}

.comment.reply{

    margin-top:6px;

    padding-left:18px;

    border-left:2px solid var(--line);

}

.comment-replies{

    margin-top:3px;

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     TOP BAR
     ===================================================== -->

<header class="topbar">

    <div class="topbar-inner">


        <div class="brand">

            <span class="brand-chicken">🐔</span>

            TRUTHahn

        </div>


        <nav class="topnav">

            <button class="nav-item active" style="cursor:default;">
                Home
            </button>

            <button class="nav-item" style="cursor:default;">

const COMMENT_POOL_KEY = "truthahn-comment-pool-v2";
function shuffledCommentIndexes(){const a=COMMENT_POOL.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getCommentPoolState(){try{const x=JSON.parse(localStorage.getItem(COMMENT_POOL_KEY));if(x&&Array.isArray(x.remaining))return x;}catch(e){}const x={remaining:shuffledCommentIndexes()};localStorage.setItem(COMMENT_POOL_KEY,JSON.stringify(x));return x;}
function nextPoolComment(){const st=getCommentPoolState();if(!st.remaining.length)st.remaining=shuffledCommentIndexes();const src=COMMENT_POOL[st.remaining.pop()];localStorage.setItem(COMMENT_POOL_KEY,JSON.stringify(st));return {...src,id:Date.now()+Math.random()};}

function shufflePosts(posts){
    const shuffled = posts.slice();
    for(let i=shuffled.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }
    return shuffled;
}

function initialTruths(){
    return shufflePosts(LIE_POOL).map(post => ({
        ...post,
        comments:[],
        commentCount:randomBetween(1,50)
    }));
}

function load(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


if(saved){

    state =
        JSON.parse(saved);


    if(
        !state.nextId ||
        !Number.isFinite(state.nextId)
    ){

        state.nextId =
            Math.max(

                0,

                ...state.truths.map(
                    truth =>
                        Number(truth.id) || 0
                )

            ) + 1;

    }


    state.truths.forEach(truth => {

        if(!Array.isArray(truth.comments)){

            truth.comments = [];

        }


        truth.comments.forEach(comment => {

            if(!Array.isArray(comment.replies)){

                comment.replies = [];

            }

        });

    });

    if(!state.game || typeof state.game !== "object"){
        state.game = {};
    }

    state.game.power = Number(state.game.power) || 0;
    state.game.fame = Number(state.game.fame) || 0;
    state.game.roosters = Number(state.game.roosters) || 0;
    state.game.lastActivity = Number(state.game.lastActivity) || Date.now();
    state.game.roosterDecayClock = Number(state.game.roosterDecayClock) || 0;

}else{

            state.truths =
                initialTruths();

            state.game = {
                power:0,
                fame:0,
                roosters:0,
                lastActivity:Date.now(),
                roosterDecayClock:0
            };

        }

    }catch(error){

        state.truths =
            initialTruths();

        state.game = {
            power:0,
            fame:0,
            roosters:0,
            lastActivity:Date.now(),
            roosterDecayClock:0
        };

    }

    // Randomize the feed order on each load, while preserving every post and its data.
    if(Array.isArray(state.truths)){
        state.truths = shufflePosts(state.truths);
    }

}

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


function randomItem(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


function randomBetween(min,max){

    return Math.floor(

        Math.random() *
        (max-min+1) +
        min

    );

}


function getTruth(id){

    return state.truths.find(

        truth =>
            truth.id === Number(id)

    );

}


function timeAgo(timestamp){

    const seconds =
        Math.floor(
            (Date.now()-timestamp)/1000
        );


    if(seconds < 10)
        return "now";


    if(seconds < 60)
        return seconds+"s";


    const minutes =
        Math.floor(seconds/60);


    if(minutes < 60)
        return minutes+"m";


    const hours =
        Math.floor(minutes/60);


    if(hours < 24)
        return hours+"h";


    return Math.floor(hours/24)+"d";

}


/* =========================================================
   HEAT
   ========================================================= */

function getHeat(truth){

return (

    truth.likes * 3 +

    truth.dislikes * 2 +

    truth.retruths * 6 +

    truth.comments.length * 5

);

}


function heatClass(value){

    if(value >= 70)
        return "crazy";

    if(value >= 35)
        return "hot";

    return "";

}


/* =========================================================
   RANK
   ========================================================= */

function calculateRank(){

    const game = state.game || {power:0,fame:0,roosters:0};

    const power = Math.max(0, game.power || 0);
    const fame = Math.max(0, game.fame || 0);
    const roosters = Math.max(0, game.roosters || 0);

    document
        .getElementById("rank")
        .textContent =
        Math.ceil(roosters);

    document
        .getElementById("flockPower")
        .textContent =
        Math.round(power);

    document
        .getElementById("truthHeat")
        .textContent =
        Math.round(fame);

    /*
       Bars are visual gauges, not hard caps.
       They use a soft logarithmic scale so large scores
       can keep growing indefinitely.
    */

    const powerVisual =
        power > 0
        ? Math.min(100, Math.log10(power + 1) * 32)
        : 0;

    const fameVisual =
        fame > 0
        ? Math.min(100, Math.log10(fame + 1) * 32)
        : 0;

    document
        .getElementById("flockMeter")
        .style.width =
        powerVisual + "%";

    document
        .getElementById("heatMeter")
        .style.width =
        fameVisual + "%";

}


/* =========================================================
   GAMEPLAY: GROWTH + DECAY
   ========================================================= */

function ensureGameState(){

    if(!state.game){
        state.game = {};
    }

    state.game.power = Number(state.game.power) || 0;
    state.game.fame = Number(state.game.fame) || 0;
    state.game.roosters = Number(state.game.roosters) || 0;
    state.game.lastActivity = Number(state.game.lastActivity) || Date.now();
    state.game.roosterDecayClock = Number(state.game.roosterDecayClock) || 0;

}


function rewardActivity(type="post"){

    ensureGameState();

    const rewards = {
        post:{power:18, fame:12, roosters:1},
        quote:{power:10, fame:8, roosters:.5},
        comment:{power:5, fame:4, roosters:.2},
        reply:{power:4, fame:3, roosters:.15}
    };

    const reward = rewards[type] || rewards.post;

    state.game.power += reward.power;
    state.game.fame += reward.fame;
    state.game.roosters += reward.roosters;
    state.game.lastActivity = Date.now();
    state.game.roosterDecayClock = 0;

}


function decayGame(){

    ensureGameState();

    const now = Date.now();
    const idleSeconds = Math.floor((now - state.game.lastActivity) / 1000);

    if(idleSeconds < 1){
        return;
    }

    /* Every idle second visibly costs attention. */
    state.game.power = Math.max(0, state.game.power - 1.0);
    state.game.fame = Math.max(0, state.game.fame - 0.65);

    /* Roosters are harder won and disappear more slowly: one per 10 idle seconds. */
    state.game.roosterDecayClock += 1;

    if(state.game.roosterDecayClock >= 10){
        state.game.roosters = Math.max(0, state.game.roosters - 1);
        state.game.roosterDecayClock = 0;
    }

    calculateRank();
    save();

}

function likeTruth(truth){

    if(truth.liked){

        truth.likes =
            Math.max(
                0,
                truth.likes-1
            );

        truth.liked =
            false;

    }else{

        truth.likes++;

        truth.liked =
            true;


        if(truth.disliked){

            truth.dislikes =
                Math.max(
                    0,
                    truth.dislikes-1
                );

            truth.disliked =
                false;

        }

    }

}

            truth.likes =
                Math.max(
                    0,
                    truth.likes-1
                );

            truth.liked =
                false;

        }

    }

}


/* =========================================================
   RELIE
   ========================================================= */

function retruth(truth){

    if(truth.retruthed){

        truth.retruths =
            Math.max(
                0,
                truth.retruths-1
            );

        truth.retruthed =
            false;

        toast(
            "ReLie withdrawn"
        );

    }else{

        truth.retruths++;

        truth.retruthed =
            true;

        toast(
            "Lie amplified 🤯"
        );

    }

}

/* =========================================================
   BOT REACTION
   ========================================================= */

function isCommentBeingEdited(){

    const input =
        document.activeElement;

    return (
        input &&
        input.matches(".comment-box input") &&
        input.value.length > 0
    );

}

function botReact(id){

    const truth =
        getTruth(id);


    if(!truth)
        return;


    const bot =
        randomItem(bots);


    const lower =
        truth.text.toLowerCase();


    let likeChance =
        .46;


    let dislikeChance =
        .20;


    let commentChance =
        .25;


    if(

        lower.includes("truth") ||

        lower.includes("secret") ||

        lower.includes("they") ||

        lower.includes("everyone") ||

        lower.includes("wake")

    ){

        commentChance += .20;

    }


    if(

        lower.includes("?") ||

        lower.includes("why") ||

        lower.includes("how")

    ){

        dislikeChance += .12;

    }


    const roll =
        Math.random();


    if(
        roll < likeChance
    ){

        truth.likes++;


        toast(
            bot.name +
            " liked your Lie 🤥"
        );

    }


    else if(

        roll <
        likeChance +
        dislikeChance

    ){

        truth.dislikes++;


        toast(
            bot.name +
            " disliked your Lie 💩"
        );

    }


    else if(

        roll <
        likeChance +
        dislikeChance +
        commentChance

    ){

        truth.comments.push(nextPoolComment());


        toast(
            bot.name +
            " replied to your Lie 💬"
        );

    }


    else{

        truth.retruths++;


        toast(
            bot.name +
            " ReTruthed your Lie 🤯"
        );

    }


    save();

    if(!isCommentBeingEdited()){

        render();

    }

}

document
.getElementById("feed")
.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button"
            );


        if(!button)
            return;


        const article =
            button.closest(
                ".truth"
            );


        if(!article)
            return;


        const truth =
            getTruth(
                article.dataset.id
            );


        if(!truth)
            return;


        const action =
            button.dataset.action;


        if(action==="like"){

            likeTruth(truth);

            save();

            render();

        }


        else if(
            action==="dislike"
        ){

            dislikeTruth(truth);

            save();

            render();

        }


        else if(
            action==="retruth"
        ){

            retruth(truth);

            save();

            render();

        }


else if(
    action==="quote"
){

    openQuoteModal(truth);

}


        else if(
            action==="toggle-comments"
        ){

            const commentsBox =
                article.querySelector(
                    ".comments"
                );

            const opening =
                !commentsBox.classList.contains("open");

            if(
                opening &&
                (!Array.isArray(truth.comments) || truth.comments.length===0) &&
                Number(truth.commentCount) > 0
            ){

                truth.comments =
                    Array.from(
                        {length:Number(truth.commentCount)},
                        () => nextPoolComment()
                    );

                truth.commentCount =
                    truth.comments.length;

                save();

            }

            commentsBox.classList.toggle("open");

            render();

        }


        else if(
            action==="send-comment"
        ){

            const input =
                article.querySelector(
                    ".comment-box input"
                );


            addComment(
                truth,
                input
            );

        }

else if(
    action==="comment-reply"
){

    const comment =
        truth.comments.find(

            item =>
                String(item.id) ===
                String(
                    button.dataset.comment
                )

        );


if(comment){

    openReplyModal(
        truth,
        comment
    );

}

}

        else if(
            action==="comment-like"
        ){

            const comment =
                truth.comments.find(

                    item =>
                        String(item.id) ===
                        String(
                            button.dataset.comment
                        )

                );


            if(comment){

                comment.likes++;

                save();

                render();

            }

        }


        else if(
            action==="comment-dislike"
        ){

            const comment =
                truth.comments.find(

                    item =>
                        String(item.id) ===
                        String(
                            button.dataset.comment
                        )

                );


            if(comment){

                comment.dislikes++;

                save();

                render();

            }

        }


        else if(
            action==="share"
        ){

            toast(
                "The flock has been notified."
            );

        }

    }
);

        return;


    const truth =
        randomItem(
            state.truths
        );


    if(

        truth.author ===
        "The Coop" &&

        Math.random() < .65

    ){

        return;

    }


    botReact(
        truth.id
    );

}

/* =========================================================

   ========================================================= */

let toastTimer;


function toast(message){

    const element =
        document.getElementById(
            "toast"
        );


    element.textContent =
        message;


    element.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(

            () => {

                element.classList.remove(
                    "show"
                );

            },

            1900

        );

}

            setTimeout(

            );

}
